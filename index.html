<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Regal Sapphires</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Mono:wght@700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        
        :root {
            --bg: #000000;
            --card: rgba(20, 20, 20, 0.7);
            --red: #D00000;
            --red-light: #ff3333;
            --white: #ffffff;
            --text: #e2e8f0;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }
        
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; overflow: hidden; }
        body { 
            display: flex; flex-direction: column; 
            background: radial-gradient(circle at 50% 0%, #2a0000 0%, var(--bg) 80%);
        }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 500px; margin: 0 auto; width: 100%; position: relative; }
        
        /* HEADER */
        .header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 64px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(208, 0, 0, 0.3); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; }
        .header-left { color: var(--red); font-weight: 800; font-size: 14px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-center { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--white); cursor: pointer; padding: 10px; opacity: 0.9; }
        .header-right { display: flex; align-items: center; gap: 8px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: var(--white); }
        
        .coin-icon { 
            width: 20px; height: 20px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #ffffff, #e2e8f0 60%, #94a3b8);
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            display: inline-block; flex-shrink: 0; border: 1px solid #cbd5e1;
        }
        .sph-text { font-size: 12px; font-weight: 700; color: var(--red-light); margin-left: 2px; letter-spacing: 0.5px; }

        .content { flex: 1; overflow-y: auto; padding-top: 76px; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: var(--red); border-radius: 4px; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 70px; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid rgba(208, 0, 0, 0.3); display: flex; z-index: 1000; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: var(--text-dim); background: none; border: none; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
        .nav-btn .nav-icon { font-size: 22px; line-height: 1; filter: grayscale(1); transition: all 0.2s; }
        .nav-btn.active { color: var(--red); font-weight: 700; }
        .nav-btn.active .nav-icon { filter: grayscale(0) drop-shadow(0 0 8px rgba(208, 0, 0, 0.8)); }

        /* UI ELEMENTS */
        .card { background: var(--card); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(208, 0, 0, 0.2); border-radius: 16px; padding: 16px; margin: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        
        .btn { 
            border: 1px solid var(--red); border-radius: 12px; padding: 14px 20px; 
            font-size: 15px; font-weight: 700; cursor: pointer; 
            transition: all 0.2s; font-family: 'Montserrat', sans-serif; 
            color: var(--red); background: rgba(208, 0, 0, 0.05);
            letter-spacing: 0.5px; outline: none; touch-action: manipulation;
        }
        .btn:active { background: rgba(208, 0, 0, 0.2); transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--text-dim); color: var(--text-dim); background: transparent; }
        
        .btn-filled { background: var(--red); color: #000; border: none; box-shadow: 0 4px 15px rgba(208, 0, 0, 0.4); }
        .btn-filled:active { background: var(--red-light); }
        
        .btn-danger { border-color: var(--danger); color: var(--danger); }
        .btn-danger:active { background: rgba(239, 68, 68, 0.15); }
        
        .input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.6); color: var(--white); font-size: 18px; font-family: 'Roboto Mono', monospace; font-weight: 700; outline: none; transition: all 0.2s; touch-action: manipulation; }
        .input:focus { border-color: var(--red); background: rgba(0, 0, 0, 0.8); }

        /* MENU */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 16px; }
        .game-card { 
            background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 14px; padding: 16px 8px; text-align: center; cursor: pointer; 
            transition: all 0.2s; touch-action: manipulation; position: relative;
        }
        .game-card:active { border-color: var(--red); background: rgba(208, 0, 0, 0.1); transform: scale(0.95); }
        .game-card .game-emoji { font-size: 30px; margin-bottom: 8px; display: block; pointer-events: none; }
        .game-card .game-name { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; color: var(--text); pointer-events: none; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal { background: #111; border: 1px solid var(--red); border-radius: 20px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(208, 0, 0, 0.2); }
        .modal h3 { font-size: 20px; margin-bottom: 20px; color: var(--red); text-align: center; font-weight: 800; }
        .modal p { font-size: 15px; line-height: 1.6; color: var(--text); text-align: center; }

        /* GAME HEADER */
        .game-header { display: flex; align-items: center; justify-content: space-between; margin: 16px; }
        .game-title { font-size: 22px; font-weight: 900; color: var(--white); letter-spacing: 1px; }
        .instruction-block { background: rgba(208, 0, 0, 0.05); border-left: 3px solid var(--red); padding: 16px; margin: 16px; border-radius: 0 12px 12px 0; }
        .instruction-block .instr-title { font-size: 12px; font-weight: 800; color: var(--red); letter-spacing: 1px; margin-bottom: 8px; }
        .instruction-block .instr-text { font-size: 13px; line-height: 1.6; color: var(--text-dim); }

        /* BET INPUTS */
        .bet-row { display: flex; gap: 10px; margin: 16px; align-items: center; }
        .bet-row .input { flex: 1; }
        .quick-bets { display: flex; gap: 8px; margin: 0 16px 16px; }
        .quick-bets button { 
            flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); 
            color: var(--text); border-radius: 10px; padding: 12px 0; font-size: 13px; font-weight: 600; 
            cursor: pointer; font-family: 'Roboto Mono', monospace; transition: all 0.2s; outline: none; touch-action: manipulation;
        }
        .quick-bets button:active { background: rgba(208, 0, 0, 0.2); border-color: var(--red); color: var(--red); }

        /* RESULT */
        .result-badge { text-align: center; font-size: 16px; font-weight: 700; margin: 16px; min-height: 24px; pointer-events: none; }
        .win-text { color: var(--success); }
        .lose-text { color: var(--danger); }
        .neutral-text { color: var(--red); }

        /* LEADERBOARD */
        .leader-row { display: flex; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--card); margin-bottom: 8px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .leader-row.me { border-color: var(--red); }
        .leader-rank { width: 30px; font-weight: 800; font-size: 16px; color: var(--text-dim); text-align: center; font-family: 'Roboto Mono', monospace; }
        .leader-row:nth-child(1) .leader-rank { color: var(--red); }
        .leader-name { flex: 1; font-weight: 600; font-size: 15px; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--white); }
        .leader-balance { font-family: 'Roboto Mono', monospace; color: var(--red-light); font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        /* PROFILE */
        .profile-avatar { width: 90px; height: 90px; border-radius: 50%; background: #1a1a1a; border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 800; color: var(--red); margin: 0 auto 16px; }

        /* BONUS */
        .bonus-timer { font-family: 'Roboto Mono', monospace; font-size: 40px; font-weight: 700; color: var(--white); margin: 20px 0; text-align: center; }

        /* DICE */
        .dice-wrapper { margin: 16px; }
        .dice-bar-container { position: relative; height: 40px; background: rgba(0,0,0,0.6); border-radius: 10px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; display: flex; pointer-events: none; }
        .dice-bar-lose { background: var(--danger); transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: rgba(255,255,255,0.9); }
        .dice-bar-win { background: var(--success); transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; color: rgba(255,255,255,0.9); }
        .dice-slider { width: 100%; accent-color: var(--red); height: 10px; cursor: pointer; touch-action: manipulation; }
        .dice-display { text-align: center; font-size: 64px; font-weight: 900; font-family: 'Roboto Mono', monospace; color: var(--white); margin: 20px 0; pointer-events: none; }
        .dice-display.win { color: var(--success); }
        .dice-display.lose { color: var(--danger); }

        /* WHEEL */
        .wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--red); z-index: 10; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; border: 4px solid #111; box-shadow: 0 0 30px rgba(0,0,0,0.8); transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: var(--bg); border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 24px; z-index: 5; }
        .wheel-label { position: absolute; top: 50%; left: 50%; font-size: 14px; font-weight: 800; color: #fff; transform-origin: 0 0; pointer-events: none; z-index: 2; }

        /* CRASH */
        #crashCanvas { width: 100%; height: 240px; border-radius: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); }
        .crash-multiplier { text-align: center; font-size: 56px; font-weight: 900; font-family: 'Roboto Mono', monospace; color: var(--white); margin: 16px 0; pointer-events: none; }
        .crash-multiplier.crashed { color: var(--danger); }

        /* MINES */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 16px; }
        .mine-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: all 0.1s; touch-action: manipulation; }
        .mine-cell:active { background: rgba(208, 0, 0, 0.3); }
        .mine-cell.safe { background: rgba(34, 197, 94, 0.2); border-color: var(--success); pointer-events: none; }
        .mine-cell.bomb { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); pointer-events: none; }
        .mine-cell.disabled { pointer-events: none; opacity: 0.3; }

        /* THIMBLES */
        .thimbles-row { display: flex; justify-content: space-around; gap: 12px; margin: 24px 16px; perspective: 800px; }
        .thimble { flex: 1; max-width: 100px; aspect-ratio: 1 / 1.3; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 2px solid rgba(208, 0, 0, 0.3); border-radius: 12px 12px 8px 8px; position: relative; cursor: pointer; transition: transform 0.4s ease, box-shadow 0.3s ease; transform-origin: bottom center; }
        .thimble::before { content: ''; position: absolute; inset: 8px 12px auto 12px; height: 4px; background: rgba(208, 0, 0, 0.25); border-radius: 2px; }
        .thimble .ball { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%) scale(0); width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff, #94a3b8); box-shadow: 0 0 12px rgba(255,255,255,0.5); transition: transform 0.3s ease; }
        .thimble.lifted { transform: translateY(-30px) rotateX(20deg); box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
        .thimble.show-ball .ball { transform: translateX(-50%) scale(1); }
        .thimble.shuffling { box-shadow: 0 0 20px rgba(208,0,0,0.6); }

        /* SLOTS */
        .slots-machine { display: flex; justify-content: center; gap: 10px; margin: 20px 16px; padding: 16px; background: rgba(0,0,0,0.6); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        .slot-reel { width: 80px; height: 100px; background: #111; border-radius: 8px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); }
        .slot-strip { position: absolute; width: 100%; display: flex; flex-direction: column; align-items: center; transition: top 0.1s linear; }
        .slot-symbol { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; flex-shrink: 0; }

        /* BLACKJACK */
        .bj-cards { display: flex; flex-wrap: wrap; gap: 8px; min-height: 80px; margin: 12px 0; justify-content: center; pointer-events: none; }
        .bj-card { width: 50px; height: 70px; border-radius: 6px; background: #fff; color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 18px; border: 1px solid #cbd5e1; }
        .bj-card.red { color: var(--danger); }
        .bj-card.hidden { background: #111; color: var(--red); font-size: 24px; border: 1px solid var(--red); }
        .bj-buttons { display: flex; gap: 12px; margin: 16px; }
        .bj-buttons .btn { flex: 1; }

        /* COIN */
        .coin-wrapper { perspective: 1000px; display: flex; justify-content: center; margin: 40px 0; height: 160px; align-items: center; pointer-events: none; }
        .coin { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1); }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 60px; border: 4px solid var(--red); }
        .coin-front { background: #1a1a1a; transform: rotateX(0deg); }
        .coin-back { background: #000; transform: rotateX(180deg); }

        /* PLINKO */
        #plinkoCanvas { width: 100%; height: 380px; border-radius: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); display: block; }

        /* TOWER */
        .tower-row { display: flex; gap: 8px; margin: 8px 16px; justify-content: center; }
        .tower-cell { flex: 1; max-width: 80px; aspect-ratio: 1.2; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; color: #fff; position: relative; touch-action: manipulation; }
        .tower-cell:active { background: rgba(208, 0, 0, 0.3); }
        .tower-cell.active-level { border-color: var(--red); box-shadow: 0 0 10px rgba(208,0,0,0.3); }
        .tower-cell.safe { background: rgba(34, 197, 94, 0.2); border-color: var(--success); pointer-events: none; }
        .tower-cell.bomb { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); pointer-events: none; }
        .tower-cell.locked { opacity: 0.2; pointer-events: none; }
        .tower-mult { position: absolute; top: 4px; right: 6px; font-size: 10px; color: var(--red); font-weight: 700; pointer-events: none; }

        /* CUBE */
        .cube-result { text-align: center; font-size: 90px; margin: 20px 0; min-height: 120px; line-height: 1; pointer-events: none; }

        /* UPGRADER */
        .upg-wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 20px auto; border-radius: 50%; }
        .upg-wheel-bg { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; border: 4px solid #111; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .upg-pointer { position: absolute; top: 50%; left: 50%; width: 140px; height: 4px; background: var(--white); transform-origin: 0 50%; z-index: 10; border-radius: 4px; box-shadow: 0 0 10px rgba(255,255,255,0.8); transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .upg-pointer::after { content: ''; position: absolute; right: -6px; top: -6px; width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 12px solid var(--white); }
        .upg-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #111; border-radius: 50%; border: 2px solid var(--red); z-index: 5; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: none; color: var(--red); }

        /* ROULETTE */
        #rouletteCanvas { width: calc(100% - 32px); height: 320px; border-radius: 12px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); display: block; margin: 0 16px; }
        .roul-bets-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px; }
        .roul-bets-grid button { padding: 10px; font-size: 13px; }
        .roul-num-container { margin: 16px; }
        .roul-num-title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; text-align: center; }
        .roul-num-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
        .roul-num-btn { aspect-ratio: 1; border-radius: 4px; border: 1px solid rgba(255,255,255,0.1); font-weight: 700; font-size: 14px; cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; padding: 0; }
        .roul-num-btn.red { background: rgba(239, 68, 68, 0.4); color: #fff; }
        .roul-num-btn.black { background: rgba(0, 0, 0, 0.6); color: #fff; }
        .roul-num-btn.green { background: rgba(34, 197, 94, 0.4); color: #fff; }
        .roul-num-btn.active { border: 2px solid var(--red); box-shadow: 0 0 10px rgba(208,0,0,0.8); }

        /* ADMIN */
        .admin-player-row { background: #111; padding: 14px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; flex-direction: column; gap: 6px; touch-action: manipulation; }
        .admin-player-row:active { border-color: var(--red); }
        .admin-label { font-size: 15px; font-weight: 700; color: var(--white); display: flex; justify-content: space-between; pointer-events: none; }
        .admin-sub { font-size: 12px; color: var(--text-dim); pointer-events: none; font-family: 'Roboto Mono', monospace; }
        .admin-balance { color: var(--red); font-weight: 700; font-family: 'Roboto Mono', monospace; display: flex; align-items: center; gap: 6px; }
        .search-input { margin-bottom: 16px; }

        /* BAN */
        .ban-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; padding: 30px; text-align: center; }

        /* NEW GAMES STYLES */
        .hl-card { width: 120px; height: 160px; background: #fff; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto; color: #000; font-size: 40px; font-weight: 900; border: 4px solid #111; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hl-card.red { color: var(--danger); }
        .penalty-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px; }
        .penalty-cell { aspect-ratio: 1.5; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; }
        .penalty-cell:active { background: rgba(208,0,0,0.3); }
        .rps-grid { display: flex; gap: 12px; justify-content: center; margin: 20px 16px; }
        .rps-btn { flex: 1; aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; transition: all 0.2s; }
        .rps-btn:active { border-color: var(--red); background: rgba(208,0,0,0.1); }
        .rps-btn span { font-size: 12px; font-weight: bold; margin-top: 8px; color: var(--text); }
        .pump-container { height: 200px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; margin: 16px; }
        .pump-balloon { width: 100px; height: 100px; background: radial-gradient(circle at 30% 30%, var(--red-light), var(--red)); border-radius: 50%; transition: all 0.3s ease; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.5), 0 10px 20px rgba(208,0,0,0.3); }
        .slide-container { margin: 20px 16px; height: 60px; background: rgba(255,255,255,0.05); border-radius: 30px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .slide-zone { position: absolute; height: 100%; background: rgba(34, 197, 94, 0.4); border-left: 2px solid var(--success); border-right: 2px solid var(--success); }
        .slide-marker { position: absolute; width: 4px; height: 100%; background: var(--red); box-shadow: 0 0 10px var(--red); left: 0; }
        .lucky-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 16px; }
        .lucky-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; cursor: pointer; transition: all 0.2s; }
        .lucky-cell:active { background: rgba(208,0,0,0.2); }
        .lucky-cell.opened { background: #111; border-color: var(--red); pointer-events: none; }
        .cw-colors { display: flex; gap: 8px; margin: 16px; }
        .cw-colors button { flex: 1; padding: 16px 0; border-radius: 8px; border: none; font-weight: 700; color: #fff; cursor: pointer; }

        .hidden { display: none !important; }
        .center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mt-16 { margin-top: 16px; }
        .mb-8 { margin-bottom: 8px; }
        .flex-row { display: flex; gap: 10px; }
        .flex-row > * { flex: 1; }
        .small-text { font-size: 13px; color: var(--text-dim); }
    </style>
</head>
<body>
<div id="app">
    <header class="header">
        <div class="header-left" id="headerNick">Гость</div>
        <div class="header-center" id="secretTrigger">by bogname</div>
        <div class="header-right">
            <span class="coin-icon"></span>
            <span id="headerBalance">0</span>
            <span class="sph-text">SPH</span>
        </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="menu"><span class="nav-icon">🎮</span><span>Игры</span></button>
        <button class="nav-btn" data-nav="top"><span class="nav-icon">🏆</span><span>ТОП-10</span></button>
        <button class="nav-btn" data-nav="bonus"><span class="nav-icon">🎁</span><span>Бонус</span></button>
        <button class="nav-btn" data-nav="profile"><span class="nav-icon">👤</span><span>Профиль</span></button>
    </nav>
</div>

<script>
(function () {
    'use strict';

    const CLOUD_URL = "https://api.jsonbin.io/v3/b/6ade1189ac6210605a50e15e";
    const API_KEY = "$2a$10$Uej2IQIZlXOLtotKvDo3Iek.93rZ5jlR7t8wq5kFLqb4/AlHTrK0O"; 
    const ENCODED_PASS = "0LfQsNC50LrQsDE5NTY3OA==";

    const LS = {
        nick: 'nv_nick',
        balance: 'nv_balance',
        bonusTime: 'nv_bonus_ts',
        tgId: 'nv_tg_id'
    };

    let state = {
        nick: '', balance: 0, currentScreen: 'menu', currentGame: null, cleanupFns: [],
        bonusInterval: null, tgId: null, adminScreen: 'list', adminSelectedPlayer: null, adminPlayers: []
    };

    function getEl(id) { return document.getElementById(id); }
    function formatNum(n) { return Math.floor(n).toLocaleString('ru-RU'); }

    function secureRandom() {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] / 4294967296;
    }

    function checkPassword(input) {
        try {
            const decoded = decodeURIComponent(escape(atob(ENCODED_PASS)));
            return input === decoded;
        } catch (e) { return false; }
    }

    async function checkBan() {
        if (!state.tgId || state.tgId === 'local_user') return true;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            const me = arr.find(p => p.id === state.tgId);
            if (me && me.bannedUntil && me.bannedUntil > Date.now()) {
                showBanScreen(me.banReason, me.bannedUntil);
                return false;
            }
            return true;
        } catch (e) { return true; }
    }

    function showBanScreen(reason, until) {
        const overlay = document.createElement('div');
        overlay.className = 'ban-screen';
        const remainingMs = until - Date.now();
        const mins = Math.floor(remainingMs / 60000);
        const hours = Math.floor(mins / 60);
        overlay.innerHTML = `
            <div style="font-size: 80px; margin-bottom: 20px;">🚫</div>
            <h1 style="color: var(--danger); margin-bottom: 20px; font-size: 24px;">Доступ закрыт</h1>
            <p style="color: var(--text); font-size: 16px; margin-bottom: 10px;">Причина: <b>${reason}</b></p>
            <p style="color: var(--text-dim); font-size: 14px;">Осталось: ${hours > 0 ? hours + ' ч. ' : ''}${mins % 60} мин.</p>
            <button class="btn mt-16" onclick="location.reload()">Понятно</button>`;
        document.body.appendChild(overlay);
        document.getElementById('content').style.display = 'none';
    }

    function loadState() {
        state.nick = localStorage.getItem(LS.nick) || '';
        
        const savedBalance = localStorage.getItem(LS.balance);
        if (savedBalance === null) {
            state.balance = 1111111;
        } else {
            state.balance = parseInt(savedBalance, 10);
        }
        if (isNaN(state.balance)) state.balance = 1111111;
        
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            state.tgId = Telegram.WebApp.initDataUnsafe.user.id.toString();
            let tgName = Telegram.WebApp.initDataUnsafe.user.first_name || 'Гость';
            if (!localStorage.getItem(LS.nick)) {
                localStorage.setItem(LS.nick, tgName);
                state.nick = tgName;
            }
        } else {
            state.tgId = localStorage.getItem(LS.tgId) || 'local_user';
        }
        localStorage.setItem(LS.tgId, state.tgId);
    }

    async function syncBalance() {
        if (!state.tgId || state.tgId === 'local_user') return;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            const me = arr.find(p => p.id === state.tgId);
            
            if (!me) {
                state.balance = 1111111;
                localStorage.setItem(LS.balance, String(state.balance));
                savePlayerScore();
            } else {
                state.balance = me.balance;
                localStorage.setItem(LS.balance, String(state.balance));
            }
            updateHeader();
        } catch (e) {}
    }

    function saveBalance() {
        if (state.balance < 0) state.balance = 0; 
        localStorage.setItem(LS.balance, String(state.balance));
        updateHeader();
        savePlayerScore();
    }

    function updateHeader() {
        getEl('headerNick').textContent = state.nick || 'Гость';
        getEl('headerBalance').textContent = formatNum(state.balance);
    }

    function registerCleanup(fn) { state.cleanupFns.push(fn); }
    function clearAllTimers() {
        state.cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
        state.cleanupFns = [];
        if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; }
    }

    function setScreen(name) {
        clearAllTimers();
        state.currentScreen = name;
        state.currentGame = null;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
        renderScreen();
    }

    function renderScreen() {
        const c = getEl('content');
        c.innerHTML = '';
        switch (state.currentScreen) {
            case 'menu': renderMenu(c); break;
            case 'top': renderTop(c); break;
            case 'bonus': renderBonus(c); break;
            case 'profile': renderProfile(c); break;
            case 'admin': renderAdmin(c); break;
            default: renderMenu(c);
        }
    }

    // ============ СЕКРЕТНОЕ НАЖАТИЕ ============
    let clickCount = 0;
    let clickTimer = null;
    
    getEl('secretTrigger').addEventListener('click', () => {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        
        if (clickCount >= 5) {
            clickCount = 0;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>Вход для разработчика</h3>
                    <input class="input" id="adminPass" type="password" placeholder="Введите пароль">
                    <div id="adminError" style="color:var(--danger);font-size:12px;text-align:center;margin-top:8px;min-height:18px;"></div>
                    <div class="flex-row mt-16">
                        <button class="btn" id="adminCancel">Отмена</button>
                        <button class="btn btn-filled" id="adminConfirm">Войти</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#adminPass');
            input.focus();
            
            overlay.querySelector('#adminConfirm').addEventListener('click', () => {
                if (checkPassword(input.value)) {
                    overlay.remove();
                    state.currentScreen = 'admin';
                    state.adminScreen = 'list';
                    renderScreen();
                } else {
                    overlay.querySelector('#adminError').textContent = 'Неверный пароль!';
                }
            });
            overlay.querySelector('#adminCancel').addEventListener('click', () => overlay.remove());
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') overlay.querySelector('#adminConfirm').click(); });
        }
    });

    // ============ АДМИН ПАНЕЛЬ ============
    async function renderAdmin(c) {
        const h = document.createElement('div');
        h.className = 'game-header';
        h.innerHTML = `<button class="btn" id="adminBackBtn">← Выйти</button><span class="game-title">Админ</span><span style="width:70px"></span>`;
        c.appendChild(h);
        h.querySelector('#adminBackBtn').addEventListener('click', () => setScreen('menu'));

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        c.appendChild(wrap);

        if (state.adminScreen === 'list') {
            wrap.innerHTML = `
                <div class="flex-row mt-16" style="margin-bottom:16px;">
                    <button class="btn" id="adminRefresh">🔄 Обновить</button>
                    <button class="btn" id="adminRules">📜 Правила</button>
                </div>
                <input class="input search-input" id="adminSearch" type="text" placeholder="Поиск по нику или ID...">
                <div id="adminList"><div class="center small-text mt-16">Загрузка...</div></div>
            `;
            
            const listEl = wrap.querySelector('#adminList');
            const searchInput = wrap.querySelector('#adminSearch');
            
            async function loadPlayers() {
                listEl.innerHTML = '<div class="center small-text mt-16">Загрузка...</div>';
                try {
                    const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
                    const data = await res.json();
                    let arr = data.record;
                    if (typeof arr === 'string') arr = JSON.parse(arr);
                    if (!Array.isArray(arr)) arr = [];
                    if (state.nick && !arr.find(p => p.id === state.tgId)) {
                        arr.push({ id: state.tgId, name: state.nick, balance: state.balance });
                    }
                    state.adminPlayers = arr;
                    renderPlayerList();
                } catch (e) {
                    listEl.innerHTML = '<div class="center small-text" style="color:var(--danger);">Ошибка загрузки</div>';
                }
            }
            
            function renderPlayerList() {
                const query = searchInput.value.toLowerCase();
                const filtered = state.adminPlayers.filter(p => 
                    (p.name || '').toLowerCase().includes(query) || (p.id || '').toLowerCase().includes(query)
                );
                if (filtered.length === 0) {
                    listEl.innerHTML = '<div class="center small-text">Никого не найдено</div>';
                    return;
                }
                listEl.innerHTML = '';
                filtered.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'admin-player-row';
                    row.innerHTML = `
                        <div class="admin-label"><span>${p.name || 'Без имени'}</span><span class="admin-balance"><span class="coin-icon" style="width:14px;height:14px;"></span> ${formatNum(p.balance || 0)}</span></div>
                        <div class="admin-sub">ID: ${p.id || 'Нет ID'}</div>
                    `;
                    row.addEventListener('click', () => {
                        state.adminSelectedPlayer = p;
                        state.adminScreen = 'actions';
                        renderAdmin(c);
                    });
                    listEl.appendChild(row);
                });
            }
            
            wrap.querySelector('#adminRefresh').addEventListener('click', loadPlayers);
            searchInput.addEventListener('input', renderPlayerList);
            wrap.querySelector('#adminRules').addEventListener('click', () => { state.adminScreen = 'rules'; renderAdmin(c); });
            
            loadPlayers();
            
        } else if (state.adminScreen === 'actions') {
            const p = state.adminSelectedPlayer;
            wrap.innerHTML = `
                <button class="btn" id="adminBackToList" style="margin-bottom:16px; width:100%;">← Назад к списку</button>
                <div class="card" style="margin:0 0 16px 0; text-align:center;">
                    <div style="font-size:20px;font-weight:800;color:var(--white);">${p.name}</div>
                    <div class="small-text mt-8" style="font-family:'Roboto Mono'">ID: ${p.id}</div>
                    <div class="mt-8" style="color:var(--red);font-weight:800;font-size:18px; display:flex; align-items:center; justify-content:center; gap:6px;">
                        Баланс: ${formatNum(p.balance || 0)} <span class="coin-icon" style="width:16px;height:16px;"></span>
                    </div>
                </div>
                
                <div class="card" style="margin:0 0 16px 0;">
                    <div style="font-weight:700;margin-bottom:12px;color:var(--white);">Дать/Забрать SPH (минус = забрать)</div>
                    <input class="input" id="adminGiveAmount" type="number" placeholder="Сумма">
                    <button class="btn btn-filled mt-16" id="adminGiveBtn" style="width:100%;">Применить</button>
                </div>

                <div class="card" style="margin:0 0 16px 0;">
                    <div style="font-weight:700;margin-bottom:12px;color:var(--white);">Забанить</div>
                    <input class="input" id="adminBanTime" type="number" placeholder="Минуты" style="margin-bottom:12px;">
                    <input class="input" id="adminBanReason" type="text" placeholder="Причина" style="margin-bottom:16px;">
                    <button class="btn btn-danger" id="adminBanBtn" style="width:100%; margin-bottom:12px;">Забанить</button>
                    <button class="btn" id="adminUnbanBtn" style="width:100%;">Разбанить</button>
                </div>
            `;
            
            wrap.querySelector('#adminBackToList').addEventListener('click', () => { state.adminScreen = 'list'; renderAdmin(c); });
            
            wrap.querySelector('#adminGiveBtn').addEventListener('click', async () => {
                const amount = parseInt(wrap.querySelector('#adminGiveAmount').value, 10);
                if (!amount || amount === 0) { showToast('Введите сумму!'); return; }
                p.balance = (p.balance || 0) + amount;
                if (p.balance < 0) p.balance = 0;
                if (p.id === state.tgId) {
                    state.balance = p.balance;
                    localStorage.setItem(LS.balance, String(state.balance));
                    updateHeader();
                }
                showToast(`Баланс изменен на ${amount > 0 ? '+' : ''}${formatNum(amount)} SPH`);
                await saveAdminChanges();
            });
            
            wrap.querySelector('#adminBanBtn').addEventListener('click', async () => {
                const mins = parseInt(wrap.querySelector('#adminBanTime').value, 10);
                const reason = wrap.querySelector('#adminBanReason').value.trim();
                if (!mins || mins <= 0) { showToast('Введите время!'); return; }
                p.bannedUntil = Date.now() + (mins * 60000);
                p.banReason = reason || 'Без причины';
                showToast(`Игрок забанен!`);
                await saveAdminChanges();
            });

            wrap.querySelector('#adminUnbanBtn').addEventListener('click', async () => {
                p.bannedUntil = 0;
                p.banReason = '';
                showToast(`Игрок разбанен!`);
                await saveAdminChanges();
            });
            
        } else if (state.adminScreen === 'rules') {
            wrap.innerHTML = `
                <button class="btn" id="adminBackToList" style="margin-bottom:16px; width:100%;">← Назад к списку</button>
                <div class="card" style="margin:0;">
                    <div style="font-weight:800;font-size:18px;color:var(--red);margin-bottom:16px;">📜 Правила</div>
                    <div class="small-text" style="line-height:1.8;color:var(--text);">
                        1. Запрещено использовать баги.<br>
                        2. Запрещено оскорблять других.<br>
                        3. Администрация вправе выдать бан.<br>
                        4. Играйте честно!
                    </div>
                </div>
            `;
            wrap.querySelector('#adminBackToList').addEventListener('click', () => { state.adminScreen = 'list'; renderAdmin(c); });
        }
    }

    async function saveAdminChanges() {
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            
            const p = state.adminSelectedPlayer;
            const idx = arr.findIndex(x => x.id === p.id);
            if (idx !== -1) {
                arr[idx].balance = p.balance;
                arr[idx].bannedUntil = p.bannedUntil;
                arr[idx].banReason = p.banReason;
            } else {
                arr.push(p);
            }
            
            arr.sort((a, b) => b.balance - a.balance);
            await fetch(CLOUD_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(arr.slice(0, 100))
            });
        } catch (e) { console.warn(e); }
    }

    // ============ ИГРЫ ============
    function renderMenu(c) {
        const games = [
            { id: 'crash', name: 'CRASH', emoji: '📈' },
            { id: 'mines', name: 'MINES', emoji: '💣' },
            { id: 'dice', name: 'DICE', emoji: '🎲' },
            { id: 'wheel', name: 'WHEEL', emoji: '🎡' },
            { id: 'thimbles', name: 'SHELLS', emoji: '🥃' },
            { id: 'slots', name: 'SLOTS', emoji: '🎰' },
            { id: 'blackjack', name: 'BLACKJACK', emoji: '🃏' },
            { id: 'coin', name: 'COIN', emoji: '🪙' },
            { id: 'plinko', name: 'PLINKO', emoji: '⚪' },
            { id: 'tower', name: 'TOWER', emoji: '🏗️' },
            { id: 'cube', name: 'CUBE', emoji: '🎲' },
            { id: 'roulette', name: 'ROULETTE', emoji: '🎡' },
            { id: 'upgrader', name: 'UPGRADER', emoji: '⬆️' },
            { id: 'limbo', name: 'LIMBO', emoji: '🚀' },
            { id: 'hilo', name: 'HILO', emoji: '🃏' },
            { id: 'penalty', name: 'PENALTY', emoji: '⚽' },
            { id: 'war', name: 'WAR', emoji: '⚔️' },
            { id: 'baccarat', name: 'BACCARAT', emoji: '👑' },
            { id: 'keno', name: 'KENO', emoji: '🔢' },
            { id: 'rps', name: 'RPS', emoji: '✊' },
            { id: 'pump', name: 'PUMP', emoji: '🎈' },
            { id: 'slide', name: 'SLIDE', emoji: '🎯' },
            { id: 'lucky', name: 'LUCKY NUM', emoji: '🍀' },
            { id: 'colorwheel', name: 'COLOR WHEEL', emoji: '🎨' }
        ];
        const grid = document.createElement('div');
        grid.className = 'games-grid';
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `<span class="game-emoji">${g.emoji}</span><span class="game-name">${g.name}</span>`;
            card.addEventListener('click', () => openGame(g.id));
            grid.appendChild(card);
        });
        c.appendChild(grid);
    }

    function openGame(id) {
        clearAllTimers();
        state.currentScreen = 'game';
        state.currentGame = id;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        renderGame();
    }

    function renderGame() {
        const c = getEl('content');
        c.innerHTML = '';
        const game = state.currentGame;
        const games = {
            crash: renderCrash, mines: renderMines, dice: renderDice, wheel: renderWheel,
            thimbles: renderThimbles, slots: renderSlots, blackjack: renderBlackjack,
            coin: renderCoin, plinko: renderPlinko, tower: renderTower, cube: renderCube,
            roulette: renderRoulette, upgrader: renderUpgrader,
            limbo: renderLimbo, hilo: renderHiLo, penalty: renderPenalty, war: renderWar,
            baccarat: renderBaccarat, keno: renderKeno, rps: renderRPS, pump: renderPump,
            slide: renderSlide, lucky: renderLucky, colorwheel: renderColorWheel
        };
        if (games[game]) games[game](c);
    }

    function buildGameHeader(c, title, instructions) {
        const h = document.createElement('div');
        h.className = 'game-header';
        h.innerHTML = `<button class="btn" id="backBtn">← Назад</button><span class="game-title">${title}</span><span style="width:80px"></span>`;
        c.appendChild(h);
        h.querySelector('#backBtn').addEventListener('click', () => setScreen('menu'));

        const instr = document.createElement('div');
        instr.className = 'instruction-block';
        instr.innerHTML = `<div class="instr-title">📋 ПРАВИЛА</div><div class="instr-text">${instructions}</div>`;
        c.appendChild(instr);
    }

    function buildBetInput(c, defaultVal) {
        const row = document.createElement('div');
        row.className = 'bet-row';
        row.innerHTML = `<input class="input" id="betInput" type="number" min="1" max="2000000" placeholder="Ставка" value="${defaultVal || 100}">`;
        c.appendChild(row);

        const quick = document.createElement('div');
        quick.className = 'quick-bets';
        [1000, 10000, 100000, 'MAX'].forEach(v => {
            const b = document.createElement('button');
            b.textContent = v;
            b.addEventListener('click', () => { 
                const inp = getEl('betInput');
                if (v === 'MAX') {
                    if (state.balance > 2000000) {
                        inp.value = 2000000;
                        showToast('Максимальная ставка 2 000 000!');
                    } else {
                        inp.value = Math.max(1, state.balance);
                    }
                } else {
                    inp.value = v; 
                }
            });
            quick.appendChild(b);
        });
        c.appendChild(quick);
        return row;
    }

    function validateBet() {
        const inp = getEl('betInput');
        if (!inp) return null;
        const val = inp.value.trim();
        if (!val || isNaN(val)) { showToast('Введите сумму!'); return null; }
        const num = parseInt(val, 10);
        if (num <= 0) { showToast('Ставка > 0!'); return null; }
        if (num > 2000000) { showToast('Максимум 2 000 000!'); return null; }
        if (num > state.balance) { showToast('Недостаточно средств!'); return null; }
        return num;
    }

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';

    // ============ CRASH ============
    function renderCrash(c) {
        buildGameHeader(c, 'CRASH', 'Ракета летит вверх. Успейте забрать до взрыва!');
        buildBetInput(c, 100);
        const wrap = document.createElement('div'); wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `<canvas id="crashCanvas" width="600" height="440"></canvas><div class="crash-multiplier" id="crashMult">1.00x</div><div class="flex-row mt-16"><button class="btn" id="crashStart">Старт</button><button class="btn btn-filled" id="crashCashout" disabled>Забрать</button></div>`;
        c.appendChild(wrap);

        const canvas = getEl('crashCanvas'), ctx = canvas.getContext('2d'), multEl = getEl('crashMult'), startBtn = getEl('crashStart'), cashoutBtn = getEl('crashCashout');
        let running = false, crashed = false, cashedOut = false, currentMult = 1.0, crashPoint = 1.0, animId = null, startTs = 0, betAmount = 0;

        function drawCrashScene(t, mult, isCrashed) {
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(208, 0, 0, 0.1)'; ctx.lineWidth = 1;
            for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 5); ctx.lineTo(W, H * i / 5); ctx.stroke(); }
            const points = [], steps = 60;
            for (let i = 0; i <= steps; i++) {
                const p = (i / steps) * Math.min(t, 1);
                const x = 60 + p * (W - 120);
                const y = H - 50 - Math.pow(p, 1.8) * (H - 100) * Math.min(mult / 3, 1) * 1.1;
                points.push({ x, y });
            }
            if (points.length > 1) {
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.strokeStyle = isCrashed ? 'var(--danger)' : 'var(--red)'; ctx.lineWidth = 4;
                ctx.stroke();
                const last = points[points.length - 1];
                ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(isCrashed ? '💥' : '🚀', last.x, last.y - 20);
            }
        }

        function crashLoop(ts) {
            if (!running) return;
            if (!startTs) startTs = ts;
            const elapsed = (ts - startTs) / 1000;
            currentMult = 1.0 + elapsed * 0.45;
            if (currentMult > 30) currentMult = 30;
            if (currentMult >= crashPoint) { currentMult = crashPoint; doCrash(); return; }
            multEl.textContent = currentMult.toFixed(2) + 'x';
            drawCrashScene(Math.min(elapsed / 3, 1), currentMult, false);
            animId = requestAnimationFrame(crashLoop);
        }

        function doCrash() {
            running = false; crashed = true;
            if (animId) cancelAnimationFrame(animId);
            multEl.textContent = 'CRASH! ' + crashPoint.toFixed(2) + 'x'; multEl.classList.add('crashed');
            drawCrashScene(1, crashPoint, true); cashoutBtn.disabled = true;
            if (!cashedOut) showResult(c, '💥 Взрыв! Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
            startBtn.disabled = false; startBtn.textContent = 'Старт';
        }

        startBtn.addEventListener('click', () => {
            if (running) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            running = true; crashed = false; cashedOut = false; currentMult = 1.0; startTs = 0;
            multEl.classList.remove('crashed'); multEl.textContent = '1.00x';
            let r = secureRandom(); let cp = r < 0.15 ? 1.00 : (0.85 / (1 - r));
            if (cp > 10) cp = 10; if (cp < 1.01) cp = 1.01; crashPoint = cp;
            startBtn.disabled = true; cashoutBtn.disabled = false;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            animId = requestAnimationFrame(crashLoop);
        });

        cashoutBtn.addEventListener('click', () => {
            if (!running || cashedOut || crashed) return;
            cashedOut = true; running = false;
            if (animId) cancelAnimationFrame(animId);
            const winAmt = Math.floor(betAmount * currentMult);
            state.balance += winAmt; saveBalance();
            multEl.textContent = '✅ ' + currentMult.toFixed(2) + 'x';
            showResult(c, '💰 Выплата ' + formatNum(winAmt) + ' SPH', 'win');
            cashoutBtn.disabled = true; startBtn.disabled = false;
        });
        registerCleanup(() => { running = false; if (animId) cancelAnimationFrame(animId); });
    }

    // ============ THIMBLES ============
    function renderThimbles(c) {
        buildGameHeader(c, 'SHELLS', 'Найдите шарик.');
        buildBetInput(c, 100);
        const row = document.createElement('div'); row.className = 'thimbles-row'; row.id = 'thimblesRow'; c.appendChild(row);
        const startBtn = document.createElement('button'); startBtn.className = 'btn'; startBtn.style.cssText = 'display:block;width:80%;margin:16px auto;'; startBtn.textContent = 'Начать'; c.appendChild(startBtn);
        let ballIndex = 0, playing = false, betAmount = 0, phase = 'idle', thimbleEls = [];

        function buildThimbles() {
            row.innerHTML = ''; thimbleEls = [];
            for (let i = 0; i < 3; i++) {
                const t = document.createElement('div'); t.className = 'thimble'; t.dataset.index = i; t.innerHTML = '<div class="ball"></div>';
                t.addEventListener('click', () => onThimbleClick(i)); row.appendChild(t); thimbleEls.push(t);
            }
        }

        function animateShuffle() {
            let step = 0; const totalSteps = 5;
            const shuffleInterval = setInterval(() => {
                thimbleEls.forEach((t) => {
                    t.classList.add('shuffling'); const randX = (secureRandom() - 0.5) * 60, randY = -20 - secureRandom() * 20;
                    t.style.transform = `translate(${randX}px, ${randY}px) rotate(${(secureRandom()-0.5)*30}deg)`;
                    setTimeout(() => { t.classList.remove('shuffling'); t.style.transform = ''; }, 400);
                });
                step++;
                if (step >= totalSteps) {
                    clearInterval(shuffleInterval);
                    const idxArr = [0, 1, 2]; for (let i = idxArr.length - 1; i > 0; i--) { const j = Math.floor(secureRandom() * (i + 1)); [idxArr[i], idxArr[j]] = [idxArr[j], idxArr[i]]; }
                    thimbleEls.forEach((t, i) => { t.dataset.index = idxArr[i]; });
                    phase = 'guess'; startBtn.disabled = false; startBtn.textContent = 'Выбрать';
                }
            }, 500);
            registerCleanup(() => clearInterval(shuffleInterval));
        }

        function onThimbleClick(i) {
            if (phase !== 'guess') return;
            phase = 'result'; playing = false;
            thimbleEls.forEach(t => t.classList.add('lifted'));
            let visualWinnerIdx = -1;
            thimbleEls.forEach((t, idx) => { if (parseInt(t.dataset.index) === ballIndex) { visualWinnerIdx = idx; t.classList.add('show-ball'); } });
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            if (i === visualWinnerIdx) {
                const winAmt = Math.floor(betAmount * 2.7);
                state.balance += winAmt; saveBalance();
                showResult(c, '🎉 Угадали! +' + formatNum(winAmt) + ' SPH', 'win');

                showResult(c, '😞 Промах. Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
            }
            startBtn.textContent = 'Ещё раз'; startBtn.disabled = false; startBtn.onclick = null;
        }

        startBtn.addEventListener('click', () => {
            if (playing) return; if (phase === 'guess') return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            playing = true; phase = 'show'; startBtn.disabled = true; startBtn.textContent = 'Смотрим...';
            buildThimbles(); ballIndex = Math.floor(secureRandom() * 3);
            thimbleEls.forEach(t => t.classList.add('lifted'));
            setTimeout(() => { thimbleEls[ballIndex].classList.add('show-ball'); }, 100);
            setTimeout(() => { thimbleEls.forEach(t => { t.classList.remove('lifted'); }); }, 1200);
            setTimeout(() => { thimbleEls.forEach(t => t.classList.remove('show-ball')); phase = 'shuffling'; animateShuffle(); }, 1800);
            const old = c.querySelector('.result-badge'); if (old) old.remove();
        });

        registerCleanup(() => { playing = false; phase = 'idle'; });
    }

        const symbols = ['7️⃣', '💎', '🍒', '🍋', '🔔']; const reelStrips = [getEl('reel0'), getEl('reel1'), getEl('reel2')];
        let spinning = false, intervals = [], timeouts = [];

        function populateReel(el) {
            el.innerHTML = '';
            for (let i = 0; i < 20; i++) { const s = document.createElement('div'); s.className = 'slot-symbol'; s.textContent = symbols[Math.floor(secureRandom() * symbols.length)]; el.appendChild(s); }
        }
        reelStrips.forEach(populateReel); reelStrips.forEach(r => { r.style.top = '-100px'; });

        function startReelSpin(idx, stopAfter) {
            const el = reelStrips[idx]; let pos = -100;
            const iv = setInterval(() => {
                pos -= 100; if (pos <= -1900) pos = -100; el.style.top = pos + 'px';
                el.querySelectorAll('.slot-symbol').forEach(s => { if (secureRandom() < 0.3) s.textContent = symbols[Math.floor(secureRandom() * symbols.length)]; });

                clearInterval(iv); const finalSymbols = [];

                el.querySelectorAll('.slot-symbol').forEach(s => { s.textContent = fs; }); el.dataset.finalSymbol = fs;

        function finishSlots() {

            const old = c.querySelector('.result-badge'); if (old) old.remove();

        const ranks = [ { r: '2', v: 2 }, { r: '3', v: 3 }, { r: '4', v: 4 }, { r: '5', v: 5 }, { r: '6', v: 6 }, { r: '7', v: 7 }, { r: '8', v: 8 }, { r: '9', v: 9 }, { r: '10', v: 10 }, { r: 'J', v: 10 }, { r: 'Q', v: 10 }, { r: 'K', v: 10 }, { r: 'A', v: 11 } ];

            dealerTimeouts.forEach(t => clearTimeout(t)); dealerTimeouts = [];
            playerHand.push(deck.pop()); dealerHand.push(deck.pop()); playerHand.push(deck.pop()); dealerHand.push(deck.pop());
            renderHands(); getEl('bjHit').disabled = false; getEl('bjStand').disabled = false; getEl('bjDeal').disabled = true;
            getEl('bjResult').textContent = ''; getEl('bjResult').className = 'result-badge';
            if (calcScore(playerHand) === 21) {
                const winAmt = Math.floor(betAmount * 1.5);

        });

        getEl('bjStand').addEventListener('click', () => {
            if (!gameActive) return;
            dealerHidden = false; getEl('bjHit').disabled = true; getEl('bjStand').disabled = true; renderHands();
            function dealerDraw() {
                if (calcScore(dealerHand) < 17) {
                    dealerHand.push(deck.pop()); renderHands();
                    const t = setTimeout(dealerDraw, 500); dealerTimeouts.push(t);
                } else { checkResult(); }
            }
            function checkResult() {
                const ps = calcScore(playerHand), ds = calcScore(dealerHand);
                if (ds > 21) {
                    const winAmt = Math.floor(betAmount * 2);
                    endGame('🎉 Дилер перебрал! +' + formatNum(winAmt) + ' SPH', 'win', winAmt);

                }
                else if (ps === ds) endGame('🤝 Ничья.', 'neutral', betAmount);
                else endGame('😞 Дилер победил.', 'lose');
            }
            const t = setTimeout(dealerDraw, 500); dealerTimeouts.push(t);
        });
        registerCleanup(() => { dealerTimeouts.forEach(t => clearTimeout(t)); dealerTimeouts = []; gameActive = false; });
    }

    // ============ PLINKO ============
    function renderPlinko(c) {
        buildGameHeader(c, 'PLINKO', 'Шарик падает вниз.');
        buildBetInput(c, 100);
        const canvasWrap = document.createElement('div'); canvasWrap.style.cssText = 'margin:0 16px;';
        canvasWrap.innerHTML = '<canvas id="plinkoCanvas" width="600" height="680"></canvas>'; c.appendChild(canvasWrap);
        const btn = document.createElement('button'); btn.className = 'btn btn-filled'; btn.style.cssText = 'display:block;width:80%;margin:16px auto;'; btn.textContent = 'Запустить'; c.appendChild(btn);
        const canvas = getEl('plinkoCanvas'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
        const rows = 7, pegRadius = 6, bottomSlots = [5, 2, 0.5, 0.2, 0.5, 2, 5], slotColors = ['var(--red)', '#7f1d1d', '#b91c1c', '#1a1a1a', '#b91c1c', '#7f1d1d', 'var(--red)'];
        let pegs = [], gameActive = false, betAmount = 0;

        function buildPegs() {
            pegs = []; const topY = 80, bottomY = H - 120, rowSpacing = (bottomY - topY) / (rows - 1);
            for (let r = 0; r < rows; r++) {
                const count = r + 2, y = topY + r * rowSpacing, totalWidth = (count - 1) * 60, startX = W / 2 - totalWidth / 2;
                for (let i = 0; i < count; i++) pegs.push({ x: startX + i * 60, y });
            }
        }
        buildPegs();

        function drawPlinko(bx, by) {
            ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(0, 0, 0, 0.6)'; ctx.fillRect(0, 0, W, H);
            for (const p of pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, pegRadius, 0, Math.PI * 2); ctx.fillStyle = '#2a0000'; ctx.fill(); }
            const slotW = W / bottomSlots.length;
            for (let i = 0; i < bottomSlots.length; i++) {
                const x = i * slotW, y = H - 70, h = 55;
                ctx.fillStyle = slotColors[i] + '33'; ctx.strokeStyle = slotColors[i]; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(x + 4, y, slotW - 8, h, 8); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(bottomSlots[i] + 'x', x + slotW / 2, y + h / 2);
            }
            if (bx !== null && by !== null) {
                ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
            }
        }
        drawPlinko(null, null);

        btn.addEventListener('click', () => {
            if (gameActive) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance(); gameActive = true;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            let ballX = W / 2 + (secureRandom() - 0.5) * 10, ballY = 30, vy = 4.5, vx = 0;
            const intervalId = setInterval(() => {
                if (!gameActive) { clearInterval(intervalId); return; }
                ballY += vy; ballX += vx; vx *= 0.85;
                for (const p of pegs) {
                    const dx = ballX - p.x, dy = ballY - p.y, dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 18) {
                        const angle = Math.atan2(dy, dx); ballX = p.x + Math.cos(angle) * 19; ballY = p.y + Math.sin(angle) * 19;
                        vx = (secureRandom() - 0.5) * 14;
                        vy = Math.abs(vy) * 0.9 + 1;
                    }
                }
                if (ballX < 20) { ballX = 20; vx = Math.abs(vx) * 0.6; }
                if (ballX > W - 20) { ballX = W - 20; vx = -Math.abs(vx) * 0.6; }
                if (ballY >= H - 80) {
                    clearInterval(intervalId); gameActive = false;
                    const slotW = W / bottomSlots.length; let slotIdx = Math.floor(ballX / slotW);
                    if (slotIdx < 0) slotIdx = 0; if (slotIdx >= bottomSlots.length) slotIdx = bottomSlots.length - 1;
                    const mult = bottomSlots[slotIdx], winAmt = Math.floor(betAmount * mult);
                    if (mult >= 1) { state.balance += winAmt; saveBalance(); showResult(c, `🎉 Луза ${mult}x! +${formatNum(winAmt)} SPH`, mult >= 2 ? 'win' : 'neutral'); }
                    else { state.balance += winAmt; saveBalance(); showResult(c, `😞 Луза ${mult}x. Возврат ${formatNum(winAmt)} SPH`, 'lose'); }
                    drawPlinko(null, null); return;
                }
                drawPlinko(ballX, ballY);
            }, 16);
            registerCleanup(() => { clearInterval(intervalId); gameActive = false; });
        });
        registerCleanup(() => { gameActive = false; });
    }

    // ============ TOWER ============
    function renderTower(c) {
        buildGameHeader(c, 'TOWER', 'Поднимайтесь выше. Избегайте мин.');
        buildBetInput(c, 100);
        const towerWrap = document.createElement('div'); towerWrap.id = 'towerWrap'; towerWrap.style.cssText = 'margin:16px 0;'; c.appendChild(towerWrap);
        const controls = document.createElement('div'); controls.className = 'flex-row mt-16'; controls.style.margin = '16px';
        controls.innerHTML = `<button class="btn" id="towerStart">Начать</button><button class="btn btn-filled" id="towerCashout" disabled>Забрать</button>`;
        c.appendChild(controls);
        const multipliers = [1.3, 1.8, 2.5, 4.0, 6.0];
        let active = false, currentLevel = 0, betAmount = 0, towerMines = [], gameOver = false;

        function buildTower() {
            towerWrap.innerHTML = '';
            for (let level = 4; level >= 0; level--) {
                const row = document.createElement('div'); row.className = 'tower-row'; row.dataset.level = level;
                for (let cell = 0; cell < 4; cell++) {
                    const el = document.createElement('div'); el.className = 'tower-cell'; el.dataset.level = level; el.dataset.cell = cell;
                    el.innerHTML = `<span class="tower-mult">${multipliers[level]}x</span>`;
                    el.addEventListener('click', () => onTowerClick(level, cell, el));
                    if (level > 0) el.classList.add('locked'); row.appendChild(el);
                }
                towerWrap.appendChild(row);
            }
        }

        function onTowerClick(level, cell, el) {
            if (!active || gameOver) return;
            if (level !== currentLevel) return;
            if (el.classList.contains('safe') || el.classList.contains('bomb')) return;
            if (towerMines[level] === cell) {
                gameOver = true; active = false; el.textContent = '💣'; el.classList.add('bomb');
                towerWrap.querySelectorAll('.tower-cell').forEach(e => {
                    if (parseInt(e.dataset.level) >= currentLevel) {
                        const lv = parseInt(e.dataset.level), cl = parseInt(e.dataset.cell);
                        if (towerMines[lv] === cl && !e.classList.contains('bomb')) { e.textContent = '💣'; e.classList.add('bomb'); }
                    }
                });
                towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
                showResult(c, '💥 Мина! Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false; return;
            }
            el.classList.add('safe'); el.textContent = '💎'; el.classList.remove('locked');
            if (currentLevel < 4) {
                const nextRow = towerWrap.querySelectorAll('.tower-row')[4 - (currentLevel + 1)];
                if (nextRow) nextRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
                currentLevel++;
                const cashoutBtn = getEl('towerCashout'); cashoutBtn.disabled = false;
                cashoutBtn.textContent = 'Забрать ' + formatNum(Math.floor(betAmount * multipliers[currentLevel - 1])) + ' SPH';
            } else {
                currentLevel = 5; active = false; gameOver = true;
                const winAmt = Math.floor(betAmount * multipliers[4]); state.balance += winAmt; saveBalance();
                showResult(c, '🏆 Вы прошли башню! +' + formatNum(winAmt) + ' SPH', 'win');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
            }
        }

        getEl('towerStart').addEventListener('click', () => {
            if (active) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            active = true; gameOver = false; currentLevel = 0; towerMines = [];
            for (let i = 0; i < 5; i++) towerMines.push(Math.floor(secureRandom() * 4));
            buildTower();
            const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
            if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
            getEl('towerCashout').disabled = true; getEl('towerCashout').textContent = 'Забрать';
            getEl('towerStart').disabled = true; const old = c.querySelector('.result-badge'); if (old) old.remove();
        });

        getEl('towerCashout').addEventListener('click', () => {
            if (!active || gameOver || currentLevel === 0) return;
            active = false; gameOver = true;
            const mult = multipliers[currentLevel - 1], winAmt = Math.floor(betAmount * mult);
            state.balance += winAmt; saveBalance();
            showResult(c, '💰 Забрано ' + formatNum(winAmt) + ' SPH', 'win');
            towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
            getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
        });
        buildTower();
        towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
        const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
        if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => e.classList.remove('locked'));
    }

                    resEl.textContent = diceFaces[result - 1];
                    let win = false, multiplier = 1;

                    if (mode === 'exact') { win = result === exactChoice; multiplier = 5; }
                    else if (mode === 'even') { const isEven = result % 2 === 0; win = (evenChoice === 'even' && isEven) || (evenChoice === 'odd' && !isEven); multiplier = 1.9; }
                    else if (mode === 'over') { win = (overChoice === 'over' && result > 3.5) || (overChoice === 'under' && result < 3.5); multiplier = 1.9; }

                    if (win) { const winAmt = Math.floor(betAmount * multiplier); state.balance += winAmt; saveBalance(); showResult(c, `🎉 Выиграло ${result}! +${formatNum(winAmt)} SPH`, 'win'); }
                    else { showResult(c, `😞 Выпало ${result}. Потеряно ${formatNum(betAmount)} SPH`, 'lose'); }
                    rolling = false; playBtn.disabled = false;
                }
            }, 60);
            registerCleanup(() => clearInterval(spinInterval));
        });
        updateModeUI();
    }

    // ============ РУЛЕТКА ============
    function renderRoulette(c) {
        buildGameHeader(c, 'ROULETTE', 'Настоящая рулетка. Выберите ставку.');
        buildBetInput(c, 100);

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `
            <div style="position:relative; margin-bottom:16px;">
                <div style="position:absolute; top:-10px; left:50%; transform:translateX(-50%); width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-top:24px solid var(--red); z-index:10; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.8));"></div>
                <canvas id="rouletteCanvas" width="600" height="400" style="width:100%; height:auto; display:block; border-radius:12px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.05);"></canvas>
            </div>
            
            <div class="roul-bets-grid">
                <button class="btn btn-danger" id="roulRed">Красное (x2)</button>
                <button class="btn" id="roulBlack" style="border-color:#666;color:#ccc;">Черное (x2)</button>
                <button class="btn" id="roulEven">Чет (x2)</button>
                <button class="btn" id="roulOdd">Нечет (x2)</button>
                <button class="btn" id="roulLow">1-18 (x2)</button>
