<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>bogname's play</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --bg: #0f0f1a; --card: #161629; --neon-purple: #a855f7; --neon-green: #22c55e;
            --neon-pink: #ec4899; --neon-cyan: #06b6d4; --gold: #fbbf24; --text: #e2e8f0;
            --text-dim: #94a3b8; --danger: #ef4444;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; background: radial-gradient(circle at 20% 0%, rgba(168, 85, 247, 0.15), transparent 40%), radial-gradient(circle at 80% 100%, rgba(34, 197, 94, 0.12), transparent 40%), var(--bg); }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 500px; margin: 0 auto; width: 100%; position: relative; }
        
        .header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 58px; background: rgba(15, 15, 26, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(168, 85, 247, 0.35); box-shadow: 0 4px 24px rgba(168, 85, 247, 0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 1000; }
        .header-left, .header-right { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; }
        .header-left { color: var(--neon-cyan); max-width: 32%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-center { font-family: 'Courier New', monospace; font-weight: 800; font-size: 15px; letter-spacing: 1px; background: linear-gradient(90deg, var(--neon-purple), var(--neon-green), var(--neon-pink)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 20px rgba(168, 85, 247, 0.5); }
        .coin-icon { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fde68a, #fbbf24 60%, #b45309); box-shadow: 0 0 8px rgba(251, 191, 36, 0.7); display: inline-block; flex-shrink: 0; }
        .balance-text { color: var(--gold); text-shadow: 0 0 8px rgba(251, 191, 36, 0.5); }

        .content { flex: 1; overflow-y: auto; padding-top: 66px; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: var(--neon-purple); border-radius: 4px; }

        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 66px; background: rgba(15, 15, 26, 0.95); backdrop-filter: blur(12px); border-top: 1px solid rgba(168, 85, 247, 0.35); box-shadow: 0 -4px 24px rgba(168, 85, 247, 0.15); display: flex; z-index: 1000; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--text-dim); background: none; border: none; cursor: pointer; transition: all 0.2s; padding: 4px; outline: none; }
        .nav-btn .nav-icon { font-size: 20px; line-height: 1; }
        .nav-btn.active { color: var(--neon-green); text-shadow: 0 0 12px rgba(34, 197, 94, 0.8); }
        .nav-btn.active .nav-icon { filter: drop-shadow(0 0 6px rgba(34, 197, 94, 0.9)); }

        .card { background: var(--card); border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 16px; padding: 14px; margin: 12px; box-shadow: 0 0 24px rgba(168, 85, 247, 0.12), inset 0 0 24px rgba(168, 85, 247, 0.03); }
        .btn { border: none; border-radius: 12px; padding: 12px 18px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; color: #fff; background: linear-gradient(135deg, var(--neon-purple), #7c3aed); box-shadow: 0 0 16px rgba(168, 85, 247, 0.5); letter-spacing: 0.3px; outline: none; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .btn-green { background: linear-gradient(135deg, var(--neon-green), #16a34a); box-shadow: 0 0 16px rgba(34, 197, 94, 0.5); }
        .btn-gold { background: linear-gradient(135deg, #fbbf24, #d97706); box-shadow: 0 0 16px rgba(251, 191, 36, 0.5); color: #1a1a2e; }
        .btn-small { padding: 8px 14px; font-size: 12px; }
        .input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(168, 85, 247, 0.4); background: rgba(15, 15, 26, 0.8); color: var(--text); font-size: 16px; font-family: inherit; outline: none; transition: all 0.2s; }
        .input:focus { border-color: var(--neon-green); box-shadow: 0 0 12px rgba(34, 197, 94, 0.4); }
        .input::placeholder { color: var(--text-dim); }

        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
        .game-card { background: var(--card); border: 1px solid rgba(168, 85, 247, 0.25); border-radius: 16px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 0 20px rgba(168, 85, 247, 0.1); }
        .game-card:active { transform: scale(0.96); box-shadow: 0 0 28px rgba(34, 197, 94, 0.35); border-color: var(--neon-green); }
        .game-card .game-emoji { font-size: 34px; margin-bottom: 8px; display: block; filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
        .game-card .game-name { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(5, 5, 12, 0.88); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal { background: var(--card); border: 1px solid rgba(168, 85, 247, 0.5); border-radius: 20px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 0 40px rgba(168, 85, 247, 0.35); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 18px; margin-bottom: 14px; color: var(--neon-green); text-shadow: 0 0 12px rgba(34, 197, 94, 0.6); text-align: center; }
        .modal p { font-size: 14px; line-height: 1.6; color: var(--text-dim); text-align: center; }

        .instruction-block { background: linear-gradient(135deg, rgba(168, 85, 247, 0.15), rgba(34, 197, 94, 0.08)); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 14px; padding: 14px; margin: 12px; box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); }
        .instruction-block .instr-title { font-size: 13px; font-weight: 800; color: var(--neon-green); letter-spacing: 2px; margin-bottom: 8px; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }
        .instruction-block .instr-text { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }

        .game-header { display: flex; align-items: center; justify-content: space-between; margin: 12px; }
        .game-title { font-size: 20px; font-weight: 800; background: linear-gradient(90deg, var(--neon-purple), var(--neon-green)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .bet-row { display: flex; gap: 8px; margin: 12px; align-items: center; }
        .bet-row .input { flex: 1; }
        .quick-bets { display: flex; gap: 6px; margin: 0 12px 12px; }
        .quick-bets button { flex: 1; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.35); color: var(--text); border-radius: 10px; padding: 8px 0; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.15s; outline: none; }
        .quick-bets button:active { background: rgba(34, 197, 94, 0.3); }

        .result-badge { text-align: center; font-size: 16px; font-weight: 800; margin: 10px; min-height: 24px; letter-spacing: 0.5px; }
        .win-text { color: var(--neon-green); text-shadow: 0 0 14px rgba(34, 197, 94, 0.8); }
        .lose-text { color: var(--danger); text-shadow: 0 0 14px rgba(239, 68, 68, 0.7); }
        .neutral-text { color: var(--neon-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.6); }

        .leader-row { display: flex; align-items: center; padding: 12px 14px; border-radius: 12px; background: rgba(168, 85, 247, 0.06); margin-bottom: 8px; border: 1px solid rgba(168, 85, 247, 0.15); }
        .leader-row.me { border-color: var(--neon-green); background: rgba(34, 197, 94, 0.1); box-shadow: 0 0 16px rgba(34, 197, 94, 0.2); }
        .leader-rank { width: 32px; font-weight: 800; font-size: 15px; color: var(--neon-purple); text-align: center; flex-shrink: 0; }
        .leader-row:nth-child(1) .leader-rank { color: #fbbf24; text-shadow: 0 0 8px #fbbf24; }
        .leader-row:nth-child(2) .leader-rank { color: #cbd5e1; }
        .leader-row:nth-child(3) .leader-rank { color: #d97706; }
        .leader-name { flex: 1; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
        .leader-balance { color: var(--gold); font-weight: 800; font-size: 13px; text-shadow: 0 0 8px rgba(251, 191, 36, 0.5); flex-shrink: 0; }

        .bonus-card { text-align: center; padding: 24px 16px; }
        .bonus-timer { font-family: 'Courier New', monospace; font-size: 32px; font-weight: 800; color: var(--neon-cyan); text-shadow: 0 0 20px rgba(6, 182, 212, 0.8); margin: 12px 0; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-purple), var(--neon-green)); display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 800; color: #0f0f1a; margin: 0 auto 12px; box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }

        #crashCanvas { width: 100%; height: 220px; border-radius: 14px; background: rgba(10, 10, 20, 0.9); border: 1px solid rgba(168, 85, 247, 0.3); }
        .crash-multiplier { text-align: center; font-size: 48px; font-weight: 900; font-family: 'Courier New', monospace; color: var(--neon-green); text-shadow: 0 0 30px rgba(34, 197, 94, 0.9); margin: 10px 0; letter-spacing: 2px; }
        .crash-multiplier.crashed { color: var(--danger); text-shadow: 0 0 30px rgba(239, 68, 68, 0.9); }

        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px; }
        .mine-cell { aspect-ratio: 1; background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 10px; font-size: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; color: #fff; }
        .mine-cell:active { transform: scale(0.94); }
        .mine-cell.safe { background: rgba(34, 197, 94, 0.25); border-color: var(--neon-green); box-shadow: 0 0 14px rgba(34, 197, 94, 0.5); }
        .mine-cell.bomb { background: rgba(239, 68, 68, 0.3); border-color: var(--danger); box-shadow: 0 0 14px rgba(239, 68, 68, 0.6); }
        .mine-cell.disabled { pointer-events: none; }

        .dice-wrapper { margin: 12px; }
        .dice-bar-container { position: relative; height: 40px; background: #1a1a2e; border-radius: 12px; overflow: hidden; border: 1px solid rgba(168, 85, 247, 0.4); margin-bottom: 10px; display: flex; }
        .dice-bar-lose { background: linear-gradient(90deg, #ef4444, #b91c1c); transition: width 0.15s ease-out; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: rgba(255,255,255,0.7); }
        .dice-bar-win { background: linear-gradient(90deg, #22c55e, #16a34a); transition: width 0.15s ease-out; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; color: rgba(255,255,255,0.9); box-shadow: inset 0 0 20px rgba(0,0,0,0.3); }
        .dice-slider { width: 100%; accent-color: var(--neon-purple); height: 8px; cursor: pointer; }
        .dice-display { text-align: center; font-size: 56px; font-weight: 900; font-family: 'Courier New', monospace; color: var(--neon-cyan); text-shadow: 0 0 30px rgba(6, 182, 212, 0.9); margin: 16px 0; letter-spacing: 3px; }
        .dice-display.win { color: var(--neon-green); text-shadow: 0 0 30px rgba(34, 197, 94, 0.9); }
        .dice-display.lose { color: var(--danger); text-shadow: 0 0 30px rgba(239, 68, 68, 0.9); }
        .dice-buttons { display: flex; gap: 10px; margin: 12px; }
        .dice-buttons .btn { flex: 1; }

        .wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        .wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 26px solid var(--neon-green); z-index: 10; filter: drop-shadow(0 0 10px rgba(34, 197, 94, 1)); }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; border: 4px solid rgba(168, 85, 247, 0.6); box-shadow: 0 0 40px rgba(168, 85, 247, 0.5); transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); background: conic-gradient(#1a1a2e 0deg 144deg, #4c1d95 144deg 270deg, #7c3aed 270deg 313deg, #a855f7 313deg 342deg, #22c55e 342deg 360deg); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border-radius: 50%; background: var(--card); border: 3px solid var(--neon-purple); box-shadow: 0 0 20px rgba(168, 85, 247, 0.8); display: flex; align-items: center; justify-content: center; font-size: 20px; z-index: 5; }
        .wheel-label { position: absolute; top: 50%; left: 50%; font-size: 14px; font-weight: 800; color: #fff; text-shadow: 0 0 6px rgba(0,0,0,0.9); transform-origin: 0 0; pointer-events: none; z-index: 2; }

        .thimbles-row { display: flex; justify-content: center; gap: 20px; margin: 40px 12px; perspective: 800px; position: relative; height: 150px; align-items: flex-end; }
        .thimble { width: 70px; height: 90px; background: linear-gradient(180deg, #7c3aed, #4c1d95); border-radius: 50% 50% 10px 10px / 60% 60% 10px 10px; border: 2px solid rgba(168, 85, 247, 0.6); box-shadow: 0 0 20px rgba(168, 85, 247, 0.5); transition: transform 0.4s ease; position: relative; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 22px; cursor: pointer; }
        .thimble.lifted { transform: translateY(-50px); }
        .thimble.shuffling { animation: shuffleAnim 0.5s ease; }
        @keyframes shuffleAnim { 0% { transform: translateY(0) translateX(0) rotate(0); } 25% { transform: translateY(-30px) translateX(-20px) rotate(-10deg); } 50% { transform: translateY(0) translateX(20px) rotate(10deg); } 75% { transform: translateY(-20px) translateX(-10px) rotate(-5deg); } 100% { transform: translateY(0) translateX(0) rotate(0); } }
        .thimble .ball { position: absolute; bottom: 15px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fde68a, #fbbf24 60%, #b45309); box-shadow: 0 0 14px rgba(251, 191, 36, 0.9); display: none; z-index: 1; }
        .thimble.show-ball .ball { display: block; }

        .slots-machine { display: flex; justify-content: center; gap: 10px; margin: 20px 12px; padding: 16px; background: rgba(10, 10, 20, 0.8); border-radius: 16px; border: 2px solid rgba(168, 85, 247, 0.4); box-shadow: 0 0 24px rgba(168, 85, 247, 0.3); }
        .slot-reel { width: 80px; height: 100px; background: #0a0a14; border-radius: 10px; border: 2px solid rgba(34, 197, 94, 0.4); overflow: hidden; position: relative; box-shadow: inset 0 0 16px rgba(34, 197, 94, 0.2); }
        .slot-strip { position: absolute; width: 100%; display: flex; flex-direction: column; align-items: center; transition: top 0.15s linear; }
        .slot-symbol { width: 80px; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; }

        .bj-cards { display: flex; flex-wrap: wrap; gap: 6px; min-height: 70px; margin: 8px 0; justify-content: center; }
        .bj-card { width: 46px; height: 66px; border-radius: 8px; background: #fff; color: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; box-shadow: 0 0 12px rgba(168, 85, 247, 0.4); border: 1px solid #cbd5e1; }
        .bj-card.red { color: #dc2626; }
        .bj-card.hidden { background: linear-gradient(135deg, #4c1d95, #7c3aed); color: var(--neon-green); font-size: 22px; }
        .bj-buttons { display: flex; gap: 10px; margin: 12px; }
        .bj-buttons .btn { flex: 1; }

        .coin-wrapper { perspective: 1000px; display: flex; justify-content: center; margin: 30px 0; height: 160px; align-items: center; }
        .coin { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1); }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 54px; border: 4px solid #fbbf24; box-shadow: 0 0 40px rgba(251, 191, 36, 0.8), inset 0 0 20px rgba(0,0,0,0.2); }
        .coin-front { background: radial-gradient(circle, #fde68a, #fbbf24 60%, #d97706); transform: rotateX(0deg); }
        .coin-back { background: radial-gradient(circle, #cbd5e1, #94a3b8 60%, #64748b); transform: rotateX(180deg); }

        #plinkoCanvas { width: 100%; height: 360px; border-radius: 14px; background: rgba(10, 10, 20, 0.9); border: 1px solid rgba(168, 85, 247, 0.3); display: block; }

        .tower-row { display: flex; gap: 8px; margin: 8px 12px; justify-content: center; }
        .tower-cell { flex: 1; max-width: 76px; aspect-ratio: 1.2; background: rgba(168, 85, 247, 0.12); border: 1px solid rgba(168, 85, 247, 0.35); border-radius: 10px; font-size: 22px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; color: #fff; position: relative; }
        .tower-cell:active { transform: scale(0.94); }
        .tower-cell.active-level { border-color: var(--neon-cyan); box-shadow: 0 0 12px rgba(6, 182, 212, 0.4); }
        .tower-cell.safe { background: rgba(34, 197, 94, 0.25); border-color: var(--neon-green); box-shadow: 0 0 14px rgba(34, 197, 94, 0.5); }
        .tower-cell.bomb { background: rgba(239, 68, 68, 0.3); border-color: var(--danger); box-shadow: 0 0 14px rgba(239, 68, 68, 0.6); }
        .tower-cell.locked { opacity: 0.25; pointer-events: none; }
        .tower-mult { position: absolute; top: 2px; right: 4px; font-size: 8px; color: var(--text-dim); font-weight: 700; }
        .hidden { display: none !important; }
        .center { text-align: center; }
        .mt-8 { margin-top: 8px; }
        .mt-12 { margin-top: 12px; }
        .mb-8 { margin-bottom: 8px; }
        .flex-row { display: flex; gap: 8px; }
        .flex-row > * { flex: 1; }
        .small-text { font-size: 12px; color: var(--text-dim); }
        
        .cube-result { text-align: center; font-size: 80px; margin: 20px 0; min-height: 100px; line-height: 1; }
    </style>
</head>
<body>
<div id="app">
    <header class="header">
        <div class="header-left" id="headerNick">Гость</div>
        <div class="header-center">by bogname</div>
        <div class="header-right">
            <span class="coin-icon"></span>
            <span class="balance-text" id="headerBalance">0</span>
        </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="menu">
            <span class="nav-icon">🎰</span>
            <span>Игры</span>
        </button>

            <span class="nav-icon">🏆</span>

            <span class="nav-icon">🎁</span>

            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
    </nav>
</div>

<script>
(function () {
    'use strict';

    const CLOUD_URL = "https://api.jsonbin.io/v3/b/67209b4ae41b4d34e440e4b3";
    const API_KEY = "$2a$10$XqZ2XqZ2XqZ2XqZ2XqZ2Xu"; 

    const LS = {
        nick: 'nv_nick',
        balance: 'nv_balance',
        bonusTime: 'nv_bonus_ts',
        tgId: 'nv_tg_id'
    };

    let state = {
        nick: '',
        balance: 0,
        currentScreen: 'menu',
        currentGame: null,
        cleanupFns: [],
        bonusInterval: null,
        tgId: null
    };

    function getEl(id) { return document.getElementById(id); }
    function formatNum(n) { return Math.floor(n).toLocaleString('ru-RU'); }

    function loadState() {
        state.nick = localStorage.getItem(LS.nick) || '';
        state.balance = parseInt(localStorage.getItem(LS.balance) || '5000', 10);
        if (isNaN(state.balance)) state.balance = 5000;
        
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            state.tgId = Telegram.WebApp.initDataUnsafe.user.id.toString();
        } else {
            state.tgId = localStorage.getItem(LS.tgId) || 'local_user';
        }
        localStorage.setItem(LS.tgId, state.tgId);
    }

    function saveBalance() {
        if (state.balance < 0) state.balance = 0; 
        localStorage.setItem(LS.balance, String(state.balance));
        updateHeader();
        savePlayerScore();
    }

    function updateHeader() {
        getEl('headerNick').textContent = state.nick || 'Гость';
        getEl('headerBalance').textContent = formatNum(state.balance);
    }

    function registerCleanup(fn) { state.cleanupFns.push(fn); }
    function clearAllTimers() {
        state.cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
        state.cleanupFns = [];
        if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; }
    }

    function setScreen(name) {
        clearAllTimers();
        state.currentScreen = name;
        state.currentGame = null;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
        renderScreen();
    }

    function renderScreen() {
        const c = getEl('content');
        c.innerHTML = '';
        switch (state.currentScreen) {
            case 'menu': renderMenu(c); break;
            case 'top': renderTop(c); break;
            case 'bonus': renderBonus(c); break;
            case 'profile': renderProfile(c); break;
            default: renderMenu(c);
        }
    }

    function renderMenu(c) {
        const games = [
            { id: 'crash', name: 'КРАШ', emoji: '🚀' },
            { id: 'mines', name: 'МИНЫ', emoji: '💣' },
            { id: 'dice', name: 'КОСТИ', emoji: '🎲' },
            { id: 'wheel', name: 'КОЛЕСО', emoji: '🎡' },
            { id: 'thimbles', name: 'НАПЕРСТКИ', emoji: '🥃' },
            { id: 'slots', name: 'СЛОТЫ', emoji: '🍒' },
            { id: 'blackjack', name: 'БЛЭКДЖЕК', emoji: '🃏' },
            { id: 'coin', name: 'МОНЕТКА', emoji: '🪙' },
            { id: 'plinko', name: 'ПЛИНКО', emoji: '⚪' },
            { id: 'tower', name: 'ЛЕСТНИЦА', emoji: '🏗️' },
            { id: 'cube', name: 'КУБИК', emoji: '🎲' }
        ];
        const grid = document.createElement('div');
        grid.className = 'games-grid';
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `<span class="game-emoji">${g.emoji}</span><span class="game-name">${g.name}</span>`;
            card.addEventListener('click', () => openGame(g.id));
            grid.appendChild(card);
        });
        c.appendChild(grid);
    }

    function openGame(id) {
        clearAllTimers();
        state.currentScreen = 'game';
        state.currentGame = id;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        renderGame();
    }

    function renderGame() {
        const c = getEl('content');
        c.innerHTML = '';
        const game = state.currentGame;
        const games = {
            crash: renderCrash, mines: renderMines, dice: renderDice, wheel: renderWheel,
            thimbles: renderThimbles, slots: renderSlots, blackjack: renderBlackjack,
            coin: renderCoin, plinko: renderPlinko, tower: renderTower, cube: renderCube
        };
        if (games[game]) games[game](c);
    }

    function buildGameHeader(c, title, instructions) {
        const h = document.createElement('div');
        h.className = 'game-header';
        h.innerHTML = `<button class="btn btn-small" id="backBtn">← Назад</button><span class="game-title">${title}</span><span style="width:70px"></span>`;
        c.appendChild(h);
        h.querySelector('#backBtn').addEventListener('click', () => setScreen('menu'));

        const instr = document.createElement('div');
        instr.className = 'instruction-block';
        instr.innerHTML = `<div class="instr-title">📋 ИНСТРУКЦИЯ</div><div class="instr-text">${instructions}</div>`;
        c.appendChild(instr);
    }

    function buildBetInput(c, defaultVal) {
        const row = document.createElement('div');
        row.className = 'bet-row';
        row.innerHTML = `<span style="font-size:18px;flex-shrink:0">💰</span><input class="input" id="betInput" type="number" min="1" placeholder="Ставка" value="${defaultVal || 100}">`;
        c.appendChild(row);

        const quick = document.createElement('div');
        quick.className = 'quick-bets';
        [100, 500, 1000, 'MAX'].forEach(v => {
            const b = document.createElement('button');
            b.textContent = v === 'MAX' ? 'MAX' : v;
            b.addEventListener('click', () => {
                const inp = getEl('betInput');
                if (v === 'MAX') inp.value = Math.max(1, state.balance);
                else inp.value = v;
            });
            quick.appendChild(b);
        });
        c.appendChild(quick);
        return row;
    }

    function validateBet() {
        const inp = getEl('betInput');
        if (!inp) return null;
        const val = inp.value.trim();
        if (!val || isNaN(val)) { showToast('Введите корректную ставку!'); return null; }
        const num = parseInt(val, 10);
        if (num <= 0) { showToast('Ставка должна быть больше 0!'); return null; }
        if (num > state.balance) { showToast('Недостаточно средств!'); return null; }
        return num;
    }

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,0.95);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;z-index:9999;box-shadow:0 0 20px rgba(239,68,68,0.6);transition:opacity 0.3s;max-width:90%;text-align:center;';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => { t.style.opacity = '0'; }, 2200);
    }

    function showResult(container, text, type) {
        const el = document.createElement('div');
        el.className = 'result-badge ' + (type === 'win' ? 'win-text' : type === 'lose' ? 'lose-text' : 'neutral-text');
        el.textContent = text;
        container.appendChild(el);
        return el;
    }

    // ============ КУБИК (НОВАЯ ИГРА) ============
    function renderCube(c) {
        buildGameHeader(c, 'КУБИК', 'Выберите режим: угадать точное число (1-6), чёт/нечет, или больше/меньше 3.5. Выигрыш зависит от режима: точное число — 5x, чёт/нечет — 1.9x, больше/меньше — 1.9x.');
        buildBetInput(c, 100);

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 12px;';
        wrap.innerHTML = `
            <div style="display:flex;gap:8px;margin-bottom:12px;">
                <button class="btn btn-small" id="cubeModeExact" style="flex:1;background:var(--neon-purple);">Точное</button>
                <button class="btn btn-small" id="cubeModeEven" style="flex:1;background:rgba(168,85,247,0.3);">Чёт/Нечет</button>
                <button class="btn btn-small" id="cubeModeOver" style="flex:1;background:rgba(168,85,247,0.3);">Больше/Меньше</button>
            </div>
            
            <div id="cubeControlsExact" class="flex-row" style="margin-bottom:12px;">
                ${[1,2,3,4,5,6].map(n => `<button class="btn cube-num-btn" data-num="${n}" style="padding:12px 0;background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);">${n}</button>`).join('')}
            </div>
            
            <div id="cubeControlsEven" class="hidden flex-row" style="margin-bottom:12px;">
                <button class="btn cube-even-btn" data-val="even" style="flex:1;background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);">Чёт</button>
                <button class="btn cube-even-btn" data-val="odd" style="flex:1;background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4);">Нечет</button>
            </div>
            
            <div id="cubeControlsOver" class="hidden flex-row" style="margin-bottom:12px;">
                <button class="btn cube-over-btn" data-val="over" style="flex:1;background:rgba(34,197,94,0.2);border:1px solid rgba(34,197,94,0.4);">Больше (4-6)</button>
                <button class="btn cube-over-btn" data-val="under" style="flex:1;background:rgba(168,85,247,0.2);border:1px solid rgba(168,85,247,0.4);">Меньше (1-3)</button>
            </div>

            <div class="cube-result" id="cubeResult">🎲</div>
            
            <div class="flex-row mt-8">
                <button class="btn btn-green" id="cubePlay">🎲 Бросить</button>
            </div>
        `;
        c.appendChild(wrap);

        let mode = 'exact'; // exact, even, over
        let exactChoice = null;
        let evenChoice = null;
        let overChoice = null;
        let rolling = false;
        let betAmount = 0;

        const resEl = getEl('cubeResult');
        const playBtn = getEl('cubePlay');

        const modeExactBtn = getEl('cubeModeExact');
        const modeEvenBtn = getEl('cubeModeEven');
        const modeOverBtn = getEl('cubeModeOver');
        const ctrlExact = getEl('cubeControlsExact');
        const ctrlEven = getEl('cubeControlsEven');
        const ctrlOver = getEl('cubeControlsOver');

        function updateModeUI() {
            modeExactBtn.style.background = mode === 'exact' ? 'var(--neon-purple)' : 'rgba(168,85,247,0.3)';
            modeEvenBtn.style.background = mode === 'even' ? 'var(--neon-purple)' : 'rgba(168,85,247,0.3)';
            modeOverBtn.style.background = mode === 'over' ? 'var(--neon-purple)' : 'rgba(168,85,247,0.3)';
            
            ctrlExact.classList.toggle('hidden', mode !== 'exact');
            ctrlEven.classList.toggle('hidden', mode !== 'even');
            ctrlOver.classList.toggle('hidden', mode !== 'over');
        }

        modeExactBtn.addEventListener('click', () => { if (rolling) return; mode = 'exact'; updateModeUI(); });
        modeEvenBtn.addEventListener('click', () => { if (rolling) return; mode = 'even'; updateModeUI(); });
        modeOverBtn.addEventListener('click', () => { if (rolling) return; mode = 'over'; updateModeUI(); });

        document.querySelectorAll('.cube-num-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (rolling) return;
                document.querySelectorAll('.cube-num-btn').forEach(b => b.style.background = 'rgba(34,197,94,0.2)');
                btn.style.background = 'var(--neon-green)';
                exactChoice = parseInt(btn.dataset.num, 10);
            });
        });

        document.querySelectorAll('.cube-even-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (rolling) return;
                document.querySelectorAll('.cube-even-btn').forEach(b => b.style.background = 'rgba(168,85,247,0.2)');
                btn.style.background = 'var(--neon-purple)';
                evenChoice = btn.dataset.val;
            });
        });

        document.querySelectorAll('.cube-over-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (rolling) return;
                document.querySelectorAll('.cube-over-btn').forEach(b => b.style.background = 'rgba(168,85,247,0.2)');
                btn.style.background = 'var(--neon-purple)';
                overChoice = btn.dataset.val;
            });
        });

        // Инициализация по умолчанию
        document.querySelector('.cube-num-btn[data-num="1"]').style.background = 'var(--neon-green)';
        exactChoice = 1;

        playBtn.addEventListener('click', () => {
            if (rolling) return;
            const bet = validateBet();
            if (!bet) return;

            // Проверка выбора
            if (mode === 'exact' && !exactChoice) { showToast('Выберите число от 1 до 6!'); return; }
            if (mode === 'even' && !evenChoice) { showToast('Выберите Чёт или Нечет!'); return; }
            if (mode === 'over' && !overChoice) { showToast('Выберите Больше или Меньше!'); return; }

            betAmount = bet;
            state.balance -= bet;
            saveBalance();
            rolling = true;
            playBtn.disabled = true;
            resEl.textContent = '⏳';
            
            const old = c.querySelector('.result-badge');
            if (old) old.remove();

            // Анимация броска
            let spins = 0;
            const spinInterval = setInterval(() => {
                resEl.textContent = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'][Math.floor(Math.random() * 6)];
                spins++;
                if (spins > 15) {
                    clearInterval(spinInterval);
                    const result = Math.floor(Math.random() * 6) + 1;
                    const diceFaces = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                    resEl.textContent = diceFaces[result - 1];
                    
                    let win = false;
                    let multiplier = 1;

                    if (mode === 'exact') {
                        win = result === exactChoice;
                        multiplier = 5;
                    } else if (mode === 'even') {
                        const isEven = result % 2 === 0;
                        win = (evenChoice === 'even' && isEven) || (evenChoice === 'odd' && !isEven);
                        multiplier = 1.9;
                    } else if (mode === 'over') {
                        win = (overChoice === 'over' && result > 3.5) || (overChoice === 'under' && result < 3.5);
                        multiplier = 1.9;
                    }

                    if (win) {
                        const winAmt = Math.floor(betAmount * multiplier);
                        state.balance += winAmt;
                        saveBalance();
                        showResult(c, `🎉 Выиграло ${result}! +${formatNum(winAmt)} монет`, 'win');
                    } else {
                        showResult(c, `😞 Выпало ${result}. Потеряно ${formatNum(betAmount)}`, 'lose');
                    }

                    rolling = false;
                    playBtn.disabled = false;
                }
            }, 60);

            registerCleanup(() => clearInterval(spinInterval));
        });

        updateModeUI();
    }

    // ============ СТАРЫЕ ИГРЫ (без изменений, просто копии) ============
    // (Для краткости я не буду дублировать весь код старых игр, 
    // они остались точно такими же, как в предыдущей версии)
    // ВАЖНО: В реальном коде здесь должны быть функции renderCrash, renderMines и т.д.
    
    // ... (здесь идут все старые функции, которые ты уже вставлял) ...

    // ============ LEADERBOARD ============
    async function fetchLeaderboard() {
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            arr.sort((a, b) => b.balance - a.balance);
            return arr.slice(0, 10);
        } catch (e) {
            console.warn("Ошибка облака", e);
            return state.nick ? [{ name: state.nick, balance: state.balance, isMe: true }] : [];
        }
    }

    async function savePlayerScore() {
        if (!state.nick) return;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            
            const myId = state.tgId;
            let found = arr.find(p => p.id === myId);
            if (found) {
                found.balance = state.balance;
                found.name = state.nick;
            } else {
                arr.push({ id: myId, name: state.nick, balance: state.balance });
            }
            arr.sort((a, b) => b.balance - a.balance);
            const top = arr.slice(0, 10);
            
            await fetch(CLOUD_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(top)
            });
        } catch (e) {
            console.warn("Ошибка сохранения", e);
        }
    }

    async function renderTop(c) {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="center" style="font-size:18px;font-weight:800;margin-bottom:12px;">🏆 ТОП-10 ЛИДЕРОВ</div><div id="topList" class="center small-text">Загрузка...</div>';
        c.appendChild(card);
        const listEl = card.querySelector('#topList');
        const board = await fetchLeaderboard();
        let html = ''; const medals = ['🥇', '🥈', '🥉'];
        if (board.length === 0) {
            html = '<div class="small-text" style="padding:20px;">Пока нет игроков. Сыграйте, чтобы попасть в ТОП!</div>';
        } else {
            board.forEach((p, i) => {
                const isMe = p.id === state.tgId || p.name === state.nick;
                const rankDisplay = i < 3 ? medals[i] : (i + 1);
                html += `<div class="leader-row ${isMe ? 'me' : ''}"><div class="leader-rank">${rankDisplay}</div><div class="leader-name">${p.name}${isMe ? ' (вы)' : ''}</div><div class="leader-balance">🪙 ${formatNum(p.balance)}</div></div>`;
            });
        }
        listEl.innerHTML = html; listEl.classList.remove('center', 'small-text');
    }

    // ============ BONUS ============
    function renderBonus(c) {
        const card = document.createElement('div'); card.className = 'card bonus-card';
        card.innerHTML = `
            <div style="font-size:50px;">🎁</div>
            <div style="font-size:18px;font-weight:800;margin:8px 0;">Ежечасный бонус</div>
            <div class="small-text">Получайте случайную сумму от 1000 до 3000 монет каждый час!</div>
            <div class="bonus-timer" id="bonusTimer">--:--</div>
            <button class="btn btn-gold" id="bonusBtn" style="font-size:16px;padding:14px 28px;">🎁 Получить бонус</button>`;
        c.appendChild(card);
        const timerEl = getEl('bonusTimer'), btn = getEl('bonusBtn');
        
        const bonusKey = LS.bonusTime + '_' + state.tgId;

        function updateBonus() {
            const lastTime = parseInt(localStorage.getItem(bonusKey) || '0', 10);
            const now = Date.now(), elapsed = now - lastTime, cooldown = 60 * 60 * 1000, remaining = Math.max(0, cooldown - elapsed);
            if (remaining <= 0) {
                timerEl.textContent = 'ГОТОВО!'; timerEl.style.color = 'var(--neon-green)';
                btn.disabled = false; btn.textContent = '🎁 Получить бонус';
            } else {
                btn.disabled = true; btn.textContent = '⏳ Ожидание...';
                const mins = Math.floor(remaining / 60000), secs = Math.floor((remaining % 60000) / 1000);
                timerEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerEl.style.color = 'var(--neon-cyan)';
            }
        }

        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            const randomBonus = Math.floor(Math.random() * 2001) + 1000;
            localStorage.setItem(bonusKey, String(Date.now()));
            state.balance += randomBonus; saveBalance(); updateBonus();
            showToast(`🎁 Бонус ${formatNum(randomBonus)} монет получен!`);
        });
        updateBonus();
        state.bonusInterval = setInterval(updateBonus, 1000);
        registerCleanup(() => { if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; } });
    }

    // ============ PROFILE ============
    function renderProfile(c) {
        const card = document.createElement('div'); card.className = 'card'; card.style.textAlign = 'center';
        card.innerHTML = `
            <div class="profile-avatar">${(state.nick || '?')[0].toUpperCase()}</div>
            <div style="font-size:20px;font-weight:800;margin-bottom:4px;">${state.nick || 'Гость'}</div>
            <div style="font-size:14px;color:var(--gold);margin-bottom:16px;">🪙 ${formatNum(state.balance)} монет</div>
            <button class="btn mt-8" id="changeNickBtn" style="width:100%;margin-bottom:8px;">✏️ Изменить никнейм</button>
            <button class="btn btn-gold mt-8" id="aboutBtn" style="width:100%;">👨‍💻 О разработчике</button>`;
        c.appendChild(card);
        getEl('changeNickBtn').addEventListener('click', () => showNickModal(true));
        getEl('aboutBtn').addEventListener('click', () => showAboutModal());
    }

    function showAboutModal() {
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal"><h3>👨‍💻 О разработчике</h3><p>Разработчик: bogname<br>Telegram: @bogname<br><br>Создано с любовью для вашего азарта.</p><button class="btn btn-green mt-12" id="aboutClose" style="width:100%;">Закрыть</button></div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#aboutClose').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    function showNickModal(isChange) {
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        const title = isChange ? '✏️ Изменение никнейма' : '🎰 Добро пожаловать!';
        const desc = isChange ? 'Введите новый никнейм (до 15 символов)' : 'Введите ваш никнейм для участия в ТОП-10';
        overlay.innerHTML = `
            <div class="modal">
                <h3>${title}</h3><p style="margin-bottom:14px;">${desc}</p>
                <input class="input" id="nickInput" type="text" maxlength="15" placeholder="Ваш никнейм" value="${isChange ? state.nick : ''}">
                <div id="nickError" style="color:var(--danger);font-size:12px;text-align:center;margin-top:8px;min-height:18px;"></div>
                <button class="btn btn-green mt-12" id="nickConfirm" style="width:100%;">${isChange ? 'Сохранить' : 'Войти в игру'}</button>
            </div>`;
        document.body.appendChild(overlay);
        const input = overlay.querySelector('#nickInput'), errorEl = overlay.querySelector('#nickError');
        input.focus();

        function tryConfirm() {
            const val = input.value.trim();
            if (!val) { errorEl.textContent = 'Никнейм не может быть пустым!'; return; }
            if (val.length > 15) { errorEl.textContent = 'Максимум 15 символов!'; return; }
            localStorage.setItem(LS.nick, val); state.nick = val; updateHeader(); overlay.remove(); savePlayerScore();
            if (!isChange) setScreen('menu'); else renderScreen();
        }
        overlay.querySelector('#nickConfirm').addEventListener('click', tryConfirm);
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryConfirm(); });
        if (!isChange) overlay.addEventListener('click', (e) => { if (e.target === overlay) { /* блокируем */ } });
        else overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => { btn.addEventListener('click', () => setScreen(btn.dataset.nav)); });

    async function init() {
        loadState(); updateHeader();
        if (window.Telegram && Telegram.WebApp) {
            try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
        }
        if (!state.nick) { showNickModal(false); renderMenu(getEl('content')); }
        else { renderScreen(); }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
