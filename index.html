    async function checkBan() {
        if (!state.tgId || state.tgId === 'local_user') return true;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            const me = arr.find(p => p.id === state.tgId);
            if (me && me.bannedUntil && me.bannedUntil > Date.now()) {
                showBanScreen(me.banReason, me.bannedUntil);
                return false;
            }
            return true;
        } catch (e) { return true; }
    }

    function showBanScreen(reason, until) {
        const overlay = document.createElement('div');
        overlay.className = 'ban-screen';
        const remainingMs = until - Date.now();
        const mins = Math.floor(remainingMs / 60000);
        const hours = Math.floor(mins / 60);
        overlay.innerHTML = `
            <div style="font-size: 80px; margin-bottom: 20px;">🚫</div>
            <h1 style="color: #ef4444; margin-bottom: 20px; font-size: 24px;">Вы забанены</h1>
            <p style="color: #e2e8f0; font-size: 16px; margin-bottom: 10px;">Причина: <b>${reason}</b></p>
            <p style="color: #94a3b8; font-size: 14px;">Осталось: ${hours > 0 ? hours + ' ч. ' : ''}${mins % 60} мин.</p>
            <button class="btn btn-danger mt-12" onclick="location.reload()" style="margin-top: 30px;">Понятно</button>
        `;
        document.body.appendChild(overlay);
        document.getElementById('content').style.display = 'none';
    }

    function loadState() {
        state.nick = localStorage.getItem(LS.nick) || '';
        state.balance = parseInt(localStorage.getItem(LS.balance) || '5000', 10);
        if (isNaN(state.balance)) state.balance = 5000;
        
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            state.tgId = Telegram.WebApp.initDataUnsafe.user.id.toString();
            let tgName = Telegram.WebApp.initDataUnsafe.user.first_name || 'Гость';
            if (!localStorage.getItem(LS.nick)) {
                localStorage.setItem(LS.nick, tgName);
                state.nick = tgName;
            }
        } else {
            state.tgId = localStorage.getItem(LS.tgId) || 'local_user';
        }
        localStorage.setItem(LS.tgId, state.tgId);
    }

    function saveBalance() {
        if (state.balance < 0) state.balance = 0; 
        localStorage.setItem(LS.balance, String(state.balance));

        getEl('headerNick').textContent = state.nick || 'Гость';

    // ============ CRASH ============
    function renderCrash(c) {
        buildGameHeader(c, 'КРАШ', 'Сделайте ставку. Ракета начинает вертикальный полет, увеличивая множитель выигрыша. Успейте нажать кнопку «Забрать» до того, как ракета взорвется. Если произойдет Crash — ваша ставка сгорит!');
        buildBetInput(c, 100);
        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 12px;';
        wrap.innerHTML = `<canvas id="crashCanvas" width="600" height="440"></canvas><div class="crash-multiplier" id="crashMult">1.00x</div><div class="flex-row mt-8"><button class="btn btn-green" id="crashStart">🚀 Старт</button><button class="btn btn-gold" id="crashCashout" disabled>💰 Забрать</button></div>`;
        c.appendChild(wrap);

        const canvas = getEl('crashCanvas'), ctx = canvas.getContext('2d'), multEl = getEl('crashMult'), startBtn = getEl('crashStart'), cashoutBtn = getEl('crashCashout');
        let running = false, crashed = false, cashedOut = false, currentMult = 1.0, crashPoint = 1.0, animId = null, startTs = 0, betAmount = 0;

        function drawCrashScene(t, mult, isCrashed) {
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = 'rgba(10,10,20,0.95)'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(168,85,247,0.12)'; ctx.lineWidth = 1;
            for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 5); ctx.lineTo(W, H * i / 5); ctx.stroke(); }
            const points = [], steps = 60;
            for (let i = 0; i <= steps; i++) {
                const p = (i / steps) * Math.min(t, 1);
                const x = 60 + p * (W - 120);
                const y = H - 50 - Math.pow(p, 1.8) * (H - 100) * Math.min(mult / 3, 1) * 1.1;
                points.push({ x, y });
            }
            if (points.length > 1) {
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.strokeStyle = isCrashed ? '#ef4444' : '#22c55e'; ctx.lineWidth = 4;
                ctx.shadowColor = isCrashed ? '#ef4444' : '#22c55e'; ctx.shadowBlur = 20; ctx.stroke(); ctx.shadowBlur = 0;
                const last = points[points.length - 1];
                ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.save(); ctx.translate(last.x, last.y - 20);
                if (!isCrashed) ctx.rotate(-0.6);
                ctx.fillText(isCrashed ? '💥' : '🚀', 0, 0); ctx.restore();
            }
            if (isCrashed) { ctx.fillStyle = 'rgba(239,68,68,0.15)'; ctx.fillRect(0, 0, W, H); }
        }

        function crashLoop(ts) {
            if (!running) return;
            if (!startTs) startTs = ts;
            const elapsed = (ts - startTs) / 1000;
            currentMult = 1.0 + elapsed * 0.55;
            if (currentMult > 30) currentMult = 30;
            if (currentMult >= crashPoint) { currentMult = crashPoint; doCrash(); return; }
            multEl.textContent = currentMult.toFixed(2) + 'x';
            drawCrashScene(Math.min(elapsed / 3, 1), currentMult, false);
            animId = requestAnimationFrame(crashLoop);
        }

        function doCrash() {
            running = false; crashed = true;
            if (animId) cancelAnimationFrame(animId);
            multEl.textContent = 'CRASH! ' + crashPoint.toFixed(2) + 'x'; multEl.classList.add('crashed');
            drawCrashScene(1, crashPoint, true); cashoutBtn.disabled = true;
            if (!cashedOut) showResult(c, '💥 Взрыв! Вы потеряли ' + formatNum(betAmount) + ' монет', 'lose');
            startBtn.disabled = false; startBtn.textContent = '🚀 Старт';
        }

        startBtn.addEventListener('click', () => {
            if (running) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            running = true; crashed = false; cashedOut = false; currentMult = 1.0; startTs = 0;
            multEl.classList.remove('crashed'); multEl.textContent = '1.00x';
            let r = Math.random(); let cp = r < 0.05 ? 1.00 : (0.96 / (1 - r));
            if (cp > 10) cp = 10; if (cp < 1.01) cp = 1.01; crashPoint = cp;
            startBtn.disabled = true; cashoutBtn.disabled = false;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            animId = requestAnimationFrame(crashLoop);
        });

        cashoutBtn.addEventListener('click', () => {
            if (!running || cashedOut || crashed) return;
            cashedOut = true; running = false;
            if (animId) cancelAnimationFrame(animId);
            const winAmt = Math.floor(betAmount * currentMult);
            state.balance += winAmt; saveBalance();
            multEl.textContent = '✅ ' + currentMult.toFixed(2) + 'x';
            showResult(c, '💰 Вы забрали ' + formatNum(winAmt) + ' монет!', 'win');
            cashoutBtn.disabled = true; startBtn.disabled = false;
        });
        registerCleanup(() => { running = false; if (animId) cancelAnimationFrame(animId); });
    }

    // ============ MINES ============
    function renderMines(c) {
        buildGameHeader(c, 'МИНЫ', 'Укажите количество мин (от 1 до 24) на поле 5x5 и сделайте ставку. Открывайте ячейки. Каждая безопасная ячейка увеличивает множитель выигрыша. Вы можете забрать деньги в любой момент. Если наступите на мину — проиграете ставку.');
        const mineRow = document.createElement('div');
        mineRow.style.cssText = 'display:flex;align-items:center;gap:10px;margin:12px;';

    // ============ THIMBLES ============
    function renderThimbles(c) {
        buildGameHeader(c, 'НАПЕРСТКИ', 'Под одним из трех наперстков прячется золотой шарик. Наперстки закроются и перемешаются. Угадайте, под каким наперстком шарик, чтобы умножить ставку на 2.7x!');
        buildBetInput(c, 100);
        const row = document.createElement('div'); row.className = 'thimbles-row'; row.id = 'thimblesRow'; c.appendChild(row);
        const startBtn = document.createElement('button'); startBtn.className = 'btn btn-green'; startBtn.style.cssText = 'display:block;width:80%;margin:12px auto;'; startBtn.textContent = '🎩 Начать'; c.appendChild(startBtn);
        let ballIndex = 0, playing = false, betAmount = 0, phase = 'idle', thimbleEls = [];

        function buildThimbles() {
            row.innerHTML = ''; thimbleEls = [];
            for (let i = 0; i < 3; i++) {
                const t = document.createElement('div'); t.className = 'thimble'; t.dataset.index = i; t.innerHTML = '<div class="ball"></div>';
                t.addEventListener('click', () => onThimbleClick(i)); row.appendChild(t); thimbleEls.push(t);
            }
        }

        function animateShuffle() {
            let step = 0; const totalSteps = 6;
            const shuffleInterval = setInterval(() => {
                thimbleEls.forEach((t) => {
                    t.classList.add('shuffling'); const randX = (Math.random() - 0.5) * 60, randY = -20 - Math.random() * 20;
                    t.style.transform = `translate(${randX}px, ${randY}px) rotate(${(Math.random()-0.5)*30}deg)`;
                    setTimeout(() => { t.classList.remove('shuffling'); t.style.transform = ''; }, 400);
                });
                step++;
                if (step >= totalSteps) {
                    clearInterval(shuffleInterval);
                    const idxArr = [0, 1, 2]; for (let i = idxArr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idxArr[i], idxArr[j]] = [idxArr[j], idxArr[i]]; }
                    thimbleEls.forEach((t, i) => { t.dataset.index = idxArr[i]; });
                    phase = 'guess'; startBtn.disabled = false; startBtn.textContent = '🎩 Выберите наперсток';
                }
            }, 500);
            registerCleanup(() => clearInterval(shuffleInterval));
        }

        function onThimbleClick(i) {
            if (phase !== 'guess') return;
            phase = 'result'; playing = false;
            thimbleEls.forEach(t => t.classList.add('lifted'));
            let visualWinnerIdx = -1;
            thimbleEls.forEach((t, idx) => { if (parseInt(t.dataset.index) === ballIndex) { visualWinnerIdx = idx; t.classList.add('show-ball'); } });
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            if (i === visualWinnerIdx) {
                const winAmt = Math.floor(betAmount * 2.7); state.balance += winAmt; saveBalance();
                showResult(c, '🎉 Угадали! +' + formatNum(winAmt) + ' монет', 'win');
            } else {
                showResult(c, '😞 Не угадали. Шарик был под номером ' + (visualWinnerIdx + 1) + '. Потеряно ' + formatNum(betAmount), 'lose');
            }
            startBtn.textContent = '🎩 Ещё раз'; startBtn.disabled = false; startBtn.onclick = null;
        }

        startBtn.addEventListener('click', () => {
            if (playing) return; if (phase === 'guess') return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            playing = true; phase = 'show'; startBtn.disabled = true; startBtn.textContent = '🎩 Шарик прячется...';
            buildThimbles(); ballIndex = Math.floor(Math.random() * 3);
            thimbleEls.forEach(t => t.classList.add('lifted'));
            setTimeout(() => { thimbleEls[ballIndex].classList.add('show-ball'); }, 100);
            setTimeout(() => { thimbleEls.forEach(t => { t.classList.remove('lifted'); }); }, 1200);
            setTimeout(() => { thimbleEls.forEach(t => t.classList.remove('show-ball')); phase = 'shuffling'; animateShuffle(); }, 1800);
            const old = c.querySelector('.result-badge'); if (old) old.remove();
        });
        buildThimbles();
        registerCleanup(() => { playing = false; phase = 'idle'; });
    }

        c.appendChild(wrap);
        const suits = ['♠', '♥', '♦', '♣'];
        const ranks = [ { r: '2', v: 2 }, { r: '3', v: 3 }, { r: '4', v: 4 }, { r: '5', v: 5 }, { r: '6', v: 6 }, { r: '7', v: 7 }, { r: '8', v: 8 }, { r: '9', v: 9 }, { r: '10', v: 10 }, { r: 'J', v: 10 }, { r: 'Q', v: 10 }, { r: 'K', v: 10 }, { r: 'A', v: 11 } ];
        let deck = [], playerHand = [], dealerHand = [], gameActive = false, dealerHidden = true, betAmount = 0, dealerTimeouts = [];

        function buildDeck() {
            deck = []; for (const s of suits) for (const rk of ranks) deck.push({ suit: s, rank: rk.r, value: rk.v });
            for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
        }

        function calcScore(hand) {
            let sum = 0, aces = 0;

    // ============ PLINKO ============
    function renderPlinko(c) {
        buildGameHeader(c, 'ПЛИНКО', 'Запустите шарик сверху треугольного поля. Сталкиваясь с колышками, шарик будет случайно менять траекторию падения и приземлится в одну из луз. Множитель лузы определит ваш выигрыш.');
        buildBetInput(c, 100);
        const canvasWrap = document.createElement('div'); canvasWrap.style.cssText = 'margin:0 12px;';
        canvasWrap.innerHTML = '<canvas id="plinkoCanvas" width="600" height="680"></canvas>'; c.appendChild(canvasWrap);
        const btn = document.createElement('button'); btn.className = 'btn btn-green'; btn.style.cssText = 'display:block;width:80%;margin:12px auto;'; btn.textContent = '⚪ Запустить шарик'; c.appendChild(btn);
        const canvas = getEl('plinkoCanvas'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
        const rows = 7, pegRadius = 6, bottomSlots = [5, 2, 0.5, 0.2, 0.5, 2, 5], slotColors = ['#22c55e', '#a855f7', '#7c3aed', '#4c1d95', '#7c3aed', '#a855f7', '#22c55e'];
        let pegs = [], gameActive = false, betAmount = 0;

        function buildPegs() {
            pegs = []; const topY = 80, bottomY = H - 120, rowSpacing = (bottomY - topY) / (rows - 1);
            for (let r = 0; r < rows; r++) {
                const count = r + 2, y = topY + r * rowSpacing, totalWidth = (count - 1) * 60, startX = W / 2 - totalWidth / 2;
                for (let i = 0; i < count; i++) pegs.push({ x: startX + i * 60, y });
            }
        }
        buildPegs();

        function drawPlinko(bx, by) {
            ctx.clearRect(0, 0, W, H); ctx.fillStyle = 'rgba(10,10,20,0.95)'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(168,85,247,0.08)'; ctx.lineWidth = 1;
            for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 6); ctx.lineTo(W, H * i / 6); ctx.stroke(); }
            for (const p of pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, pegRadius, 0, Math.PI * 2); ctx.fillStyle = 'rgba(168,85,247,0.7)'; ctx.shadowColor = '#a855f7'; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0; }
            const slotW = W / bottomSlots.length;
            for (let i = 0; i < bottomSlots.length; i++) {
                const x = i * slotW, y = H - 70, h = 55;
                ctx.fillStyle = slotColors[i] + '33'; ctx.strokeStyle = slotColors[i]; ctx.lineWidth = 2; ctx.shadowColor = slotColors[i]; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.roundRect(x + 4, y, slotW - 8, h, 8); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(bottomSlots[i] + 'x', x + slotW / 2, y + h / 2);
            }
            if (bx !== null && by !== null) {
                ctx.beginPath(); ctx.arc(bx, by, 12, 0, Math.PI * 2); ctx.fillStyle = '#22c55e';
                ctx.shadowColor = '#22c55e'; ctx.shadowBlur = 25; ctx.fill(); ctx.shadowBlur = 0;
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
            }
        }
        drawPlinko(null, null);

        btn.addEventListener('click', () => {
            if (gameActive) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance(); gameActive = true;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            let ballX = W / 2 + (Math.random() - 0.5) * 10, ballY = 30, vy = 4.5, vx = 0;
            const intervalId = setInterval(() => {
                if (!gameActive) { clearInterval(intervalId); return; }
                ballY += vy; ballX += vx; vx *= 0.85;
                for (const p of pegs) {
                    const dx = ballX - p.x, dy = ballY - p.y, dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 20) {
                        const angle = Math.atan2(dy, dx); ballX = p.x + Math.cos(angle) * 21; ballY = p.y + Math.sin(angle) * 21;
                        vx = (Math.random() - 0.5) * 14; vy = Math.abs(vy) * 0.9 + 1;
                    }
                }
                if (ballX < 20) { ballX = 20; vx = Math.abs(vx) * 0.6; }
                if (ballX > W - 20) { ballX = W - 20; vx = -Math.abs(vx) * 0.6; }
                if (ballY >= H - 80) {
                    clearInterval(intervalId); gameActive = false;
                    const slotW = W / bottomSlots.length; let slotIdx = Math.floor(ballX / slotW);
                    if (slotIdx < 0) slotIdx = 0; if (slotIdx >= bottomSlots.length) slotIdx = bottomSlots.length - 1;
                    const mult = bottomSlots[slotIdx], winAmt = Math.floor(betAmount * mult);
                    if (mult >= 1) { state.balance += winAmt; saveBalance(); showResult(c, `🎉 Шарик в лузе ${mult}x! +${formatNum(winAmt)} монет`, mult >= 2 ? 'win' : 'neutral'); }
                    else { state.balance += winAmt; saveBalance(); showResult(c, `😞 Шарик в лузе ${mult}x. Возврат ${formatNum(winAmt)} монет`, 'lose'); }
                    drawPlinko(null, null); return;
                }
                drawPlinko(ballX, ballY);
            }, 16);
            registerCleanup(() => { clearInterval(intervalId); gameActive = false; });
        });
        registerCleanup(() => { gameActive = false; });
    }

    // ============ TOWER ============
    function renderTower(c) {
        buildGameHeader(c, 'ЛЕСТНИЦА', 'Перед вами башня из 5 уровней. На каждом уровне по 4 закрытых плиты, под одной из них — мина. Успешный выбор плиты поднимает вас на уровень выше и увеличивает множитель. Вы можете забрать выигрыш на любом этапе, но при взрыве потеряете всё.');
        buildBetInput(c, 100);
        const towerWrap = document.createElement('div'); towerWrap.id = 'towerWrap'; towerWrap.style.cssText = 'margin:8px 0;'; c.appendChild(towerWrap);
        const controls = document.createElement('div'); controls.className = 'flex-row mt-8'; controls.style.margin = '12px';
        controls.innerHTML = `<button class="btn btn-green" id="towerStart">▶ Начать</button><button class="btn btn-gold" id="towerCashout" disabled>💰 Забрать</button>`;
        c.appendChild(controls);
        const multipliers = [1.3, 1.8, 2.5, 4.0, 6.0];
        let active = false, currentLevel = 0, betAmount = 0, towerMines = [], gameOver = false;

        function buildTower() {
            towerWrap.innerHTML = '';
            for (let level = 4; level >= 0; level--) {
                const row = document.createElement('div'); row.className = 'tower-row'; row.dataset.level = level;
                for (let cell = 0; cell < 4; cell++) {
                    const el = document.createElement('div'); el.className = 'tower-cell'; el.dataset.level = level; el.dataset.cell = cell;
                    el.innerHTML = `<span class="tower-mult">${multipliers[level]}x</span>`;
                    el.addEventListener('click', () => onTowerClick(level, cell, el));
                    if (level > 0) el.classList.add('locked'); row.appendChild(el);
                }
                towerWrap.appendChild(row);
            }
        }

        function onTowerClick(level, cell, el) {
            if (!active || gameOver) return;
            if (level !== currentLevel) return;
            if (el.classList.contains('safe') || el.classList.contains('bomb')) return;
            if (towerMines[level] === cell) {
                gameOver = true; active = false; el.textContent = '💣'; el.classList.add('bomb');
                towerWrap.querySelectorAll('.tower-cell').forEach(e => {
                    if (parseInt(e.dataset.level) >= currentLevel) {
                        const lv = parseInt(e.dataset.level), cl = parseInt(e.dataset.cell);
                        if (towerMines[lv] === cl && !e.classList.contains('bomb')) { e.textContent = '💣'; e.classList.add('bomb'); }
                    }
                });
                towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
                showResult(c, '💥 Мина! Вы потеряли ' + formatNum(betAmount) + ' монет', 'lose');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false; return;
            }
            el.classList.add('safe'); el.textContent = '💎'; el.classList.remove('locked');
            if (currentLevel < 4) {
                const nextRow = towerWrap.querySelectorAll('.tower-row')[4 - (currentLevel + 1)];
                if (nextRow) nextRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
                currentLevel++;
                const cashoutBtn = getEl('towerCashout'); cashoutBtn.disabled = false;
                cashoutBtn.textContent = '💰 Забрать ' + formatNum(Math.floor(betAmount * multipliers[currentLevel - 1]));
            } else {
                currentLevel = 5; active = false; gameOver = true;
                const winAmt = Math.floor(betAmount * multipliers[4]); state.balance += winAmt; saveBalance();
                showResult(c, '🏆 Вы прошли башню! +' + formatNum(winAmt) + ' монет', 'win');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
            }
        }

        getEl('towerStart').addEventListener('click', () => {
            if (active) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            active = true; gameOver = false; currentLevel = 0; towerMines = [];
            for (let i = 0; i < 5; i++) towerMines.push(Math.floor(Math.random() * 4));
            buildTower();
            const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
            if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
            getEl('towerCashout').disabled = true; getEl('towerCashout').textContent = '💰 Забрать';
            getEl('towerStart').disabled = true; const old = c.querySelector('.result-badge'); if (old) old.remove();
        });

        getEl('towerCashout').addEventListener('click', () => {
            if (!active || gameOver || currentLevel === 0) return;
            active = false; gameOver = true;
            const mult = multipliers[currentLevel - 1], winAmt = Math.floor(betAmount * mult);
            state.balance += winAmt; saveBalance();
            showResult(c, '💰 Вы забрали ' + formatNum(winAmt) + ' монет!', 'win');
            towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
            getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
        });
        buildTower();
        towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
        const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
        if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => e.classList.remove('locked'));
    }

            <div class="flex-row mt-8">
                <button class="btn btn-green" id="roulSpin">🎰 Крутить</button>
            </div>
        `;
        c.appendChild(wrap);

        let betAmount = 0;
        let selectedColor = null;
        const resEl = getEl('roulResult');

        getEl('roulRed').addEventListener('click', () => { selectedColor = 'red'; showToast('Выбрано: Красное'); });
        getEl('roulBlack').addEventListener('click', () => { selectedColor = 'black'; showToast('Выбрано: Черное'); });
        getEl('roulZero').addEventListener('click', () => { selectedColor = 'zero'; showToast('Выбрано: Зеро'); });

        getEl('roulSpin').addEventListener('click', () => {
            if (!selectedColor) { showToast('Выберите цвет!'); return; }
            const bet = validateBet(); if (!bet) return;
            
            betAmount = bet;
            state.balance -= bet;
            saveBalance();
            
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            
            let spins = 0;
            const spinInterval = setInterval(() => {
                const num = Math.floor(Math.random() * 37);
                resEl.textContent = (num === 0 ? '🟢' : (num % 2 === 0 ? '⚫' : '🔴')) + ' ' + num;
                spins++;
                if (spins > 20) {
                    clearInterval(spinInterval);
                    const finalNum = Math.floor(Math.random() * 37);
                    const isRed = finalNum !== 0 && finalNum % 2 !== 0;
                    const isBlack = finalNum !== 0 && finalNum % 2 === 0;
                    const isZero = finalNum === 0;
                    
                    resEl.textContent = (isZero ? '🟢' : (isRed ? '🔴' : '⚫')) + ' ' + finalNum;
                    
                    let win = false;
                    let mult = 0;
                    
                    if (selectedColor === 'red' && isRed) { win = true; mult = 2; }
                    else if (selectedColor === 'black' && isBlack) { win = true; mult = 2; }
                    else if (selectedColor === 'zero' && isZero) { win = true; mult = 14; }
                    
                    if (win) {
                        const winAmt = betAmount * mult;
                        state.balance += winAmt;
                        saveBalance();
                        showResult(c, `🎉 Победа! Выпало ${finalNum}. +${formatNum(winAmt)} монет`, 'win');
                    } else {
                        showResult(c, `😞 Выпало ${finalNum}. Потеряно ${formatNum(betAmount)} монет`, 'lose');
                    }
                }
            }, 80);
            registerCleanup(() => clearInterval(spinInterval));
        });
    }

    // ============ LEADERBOARD ============
    async function fetchLeaderboard() {
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            arr.sort((a, b) => b.balance - a.balance);
            return arr.slice(0, 10);
        } catch (e) {
            console.warn("Ошибка облака", e);
            return state.nick ? [{ name: state.nick, balance: state.balance, isMe: true }] : [];
        }
    }

    async function savePlayerScore() {
        if (!state.nick) return;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            
            const myId = state.tgId;
            let found = arr.find(p => p.id === myId);
            if (found) {
                found.balance = state.balance;
                found.name = state.nick;
            } else {
                arr.push({ id: myId, name: state.nick, balance: state.balance });
            }
            arr.sort((a, b) => b.balance - a.balance);
            const top = arr.slice(0, 100);
            
            await fetch(CLOUD_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(top)
            });
        } catch (e) {
            console.warn("Ошибка сохранения", e);
        }
    }

    async function renderTop(c) {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="center" style="font-size:18px;font-weight:800;margin-bottom:12px;">🏆 ТОП-10 ЛИДЕРОВ</div><div id="topList" class="center small-text">Загрузка...</div>';
        c.appendChild(card);
        const listEl = card.querySelector('#topList');
        const board = await fetchLeaderboard();
        let html = ''; const medals = ['🥇', '🥈', '🥉'];
        if (board.length === 0) {
            html = '<div class="small-text" style="padding:20px;">Пока нет игроков. Сыграйте, чтобы попасть в ТОП!</div>';
        } else {
            board.forEach((p, i) => {
                const isMe = p.id === state.tgId || p.name === state.nick;
                const rankDisplay = i < 3 ? medals[i] : (i + 1);
                html += `<div class="leader-row ${isMe ? 'me' : ''}"><div class="leader-rank">${rankDisplay}</div><div class="leader-name">${p.name}${isMe ? ' (вы)' : ''}</div><div class="leader-balance">🪙 ${formatNum(p.balance)}</div></div>`;
            });
        }
        listEl.innerHTML = html; listEl.classList.remove('center', 'small-text');
    }

    // ============ BONUS ============
    function renderBonus(c) {
        const card = document.createElement('div'); card.className = 'card bonus-card';
        card.innerHTML = `
            <div style="font-size:50px;">🎁</div>
            <div style="font-size:18px;font-weight:800;margin:8px 0;">Ежечасный бонус</div>
            <div class="small-text">Получайте случайную сумму от 1000 до 3000 монет каждый час!</div>
            <div class="bonus-timer" id="bonusTimer">--:--</div>
            <button class="btn btn-gold" id="bonusBtn" style="font-size:16px;padding:14px 28px;">🎁 Получить бонус</button>`;
        c.appendChild(card);
        const timerEl = getEl('bonusTimer'), btn = getEl('bonusBtn');
        
        const bonusKey = LS.bonusTime + '_' + state.tgId;

        function updateBonus() {
            const lastTime = parseInt(localStorage.getItem(bonusKey) || '0', 10);
            const now = Date.now(), elapsed = now - lastTime, cooldown = 60 * 60 * 1000, remaining = Math.max(0, cooldown - elapsed);
            if (remaining <= 0) {
                timerEl.textContent = 'ГОТОВО!'; timerEl.style.color = 'var(--neon-green)';
                btn.disabled = false; btn.textContent = '🎁 Получить бонус';
            } else {
                btn.disabled = true; btn.textContent = '⏳ Ожидание...';
                const mins = Math.floor(remaining / 60000), secs = Math.floor((remaining % 60000) / 1000);
                timerEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerEl.style.color = 'var(--neon-cyan)';
            }
        }

        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            const randomBonus = Math.floor(Math.random() * 2001) + 1000;
            localStorage.setItem(bonusKey, String(Date.now()));
            state.balance += randomBonus; saveBalance(); updateBonus();
            showToast(`🎁 Бонус ${formatNum(randomBonus)} монет получен!`);
        });
        updateBonus();
        state.bonusInterval = setInterval(updateBonus, 1000);
        registerCleanup(() => { if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; } });
    }

    // ============ PROFILE ============
    function renderProfile(c) {
        const card = document.createElement('div'); card.className = 'card'; card.style.textAlign = 'center';
        card.innerHTML = `
            <div class="profile-avatar">${(state.nick || '?')[0].toUpperCase()}</div>
            <div style="font-size:20px;font-weight:800;margin-bottom:4px;">${state.nick || 'Гость'}</div>
            <div style="font-size:14px;color:var(--gold);margin-bottom:16px;">🪙 ${formatNum(state.balance)} монет</div>
            <button class="btn btn-gold mt-8" id="aboutBtn" style="width:100%;">👨‍💻 О разработчике</button>`;
        c.appendChild(card);
        getEl('aboutBtn').addEventListener('click', () => showAboutModal());
    }

    function showAboutModal() {
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal"><h3>👨‍💻 О разработчике</h3><p>Разработчик: bogname<br>Telegram: @bogname<br><br>Создано с любовью для вашего азарта.</p><button class="btn btn-green mt-12" id="aboutClose" style="width:100%;">Закрыть</button></div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#aboutClose').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => { btn.addEventListener('click', () => setScreen(btn.dataset.nav)); });

    async function init() {
        loadState(); updateHeader();
        if (window.Telegram && Telegram.WebApp) {
            try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
        }
        
        const isNotBanned = await checkBan();
        if (!isNotBanned) return;

        if (!state.nick) { renderMenu(getEl('content')); }
        else { renderScreen(); }
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
