<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Regal Sapphires</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Roboto+Mono:wght@700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        :root {
            --bg: #0a1128;
            --card: #121c3a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --white: #ffffff;
            --text: #d1d5db;
            --text-dim: #6b7280;
            --danger: #b91c1c;
            --success: #15803d;
        }
        html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; background: radial-gradient(circle at 50% 0%, #16244b 0%, var(--bg) 70%); }
        #app { display: flex; flex-direction: column; height: 100%; max-width: 500px; margin: 0 auto; width: 100%; position: relative; }
        
        /* HEADER */
        .header { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 64px; background: rgba(10, 17, 40, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(212, 175, 55, 0.3); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; z-index: 1000; }
        .header-left { color: var(--gold-light); font-weight: 600; font-size: 14px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .header-center { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 15px; letter-spacing: 1px; color: var(--white); cursor: pointer; padding: 10px; opacity: 0.9; }
        .header-right { display: flex; align-items: center; gap: 8px; font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; color: var(--white); }
        
        .coin-icon { 
            width: 20px; height: 20px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #ffffff, #f3e5ab 40%, #d4af37 100%);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4), inset 0 -2px 4px rgba(0,0,0,0.3);
            display: inline-block; flex-shrink: 0;
        }
        
        .sph-text { font-size: 12px; font-weight: 700; color: var(--gold-light); margin-left: 2px; letter-spacing: 0.5px; }

        .content { flex: 1; overflow-y: auto; padding-top: 76px; padding-bottom: 90px; -webkit-overflow-scrolling: touch; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; height: 70px; background: rgba(10, 17, 40, 0.95); backdrop-filter: blur(15px); border-top: 1px solid rgba(212, 175, 55, 0.3); display: flex; z-index: 1000; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; color: var(--text-dim); background: none; border: none; cursor: pointer; transition: all 0.2s; touch-action: manipulation; }
        .nav-btn .nav-icon { font-size: 22px; line-height: 1; filter: grayscale(1); transition: all 0.2s; }
        .nav-btn.active { color: var(--gold); font-weight: 700; }
        .nav-btn.active .nav-icon { filter: grayscale(0) drop-shadow(0 0 8px rgba(212, 175, 55, 0.8)); transform: scale(1.1); }

        /* UI ELEMENTS */
        .card { background: linear-gradient(145deg, #16224a, #0f1832); border: 1px solid rgba(212, 175, 55, 0.2); border-radius: 16px; padding: 16px; margin: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255,255,255,0.05); }
        
        .btn { 
            border: none; border-radius: 12px; padding: 16px 20px; font-size: 16px; font-weight: 800; cursor: pointer; 
            transition: all 0.1s; font-family: 'Montserrat', sans-serif; color: #000; 
            background: linear-gradient(180deg, #ffffff 0%, #f3e5ab 50%, #d4af37 100%);
            box-shadow: 0 6px 0 #8a6e1c, 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255,255,255,0.8);
            letter-spacing: 0.5px; outline: none; touch-action: manipulation; position: relative; top: 0;
        }
        .btn:active { top: 6px; box-shadow: 0 0px 0 #8a6e1c, 0 2px 10px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255,255,255,0.8); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; top: 6px; background: #555; color: #888; }
        
        .btn-outline { 
            background: transparent; border: 2px solid var(--gold); color: var(--gold); 
            box-shadow: 0 4px 0 #8a6e1c, 0 5px 15px rgba(0,0,0,0.3); top: 0;
        }
        .btn-outline:active { top: 4px; box-shadow: 0 0 0 #8a6e1c, 0 2px 5px rgba(0,0,0,0.3); background: rgba(212, 175, 55, 0.1); }
        
        .btn-danger { 
            background: linear-gradient(180deg, #f87171 0%, #ef4444 50%, #b91c1c 100%); color: #fff;
            box-shadow: 0 6px 0 #7f1d1d, 0 10px 20px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255,255,255,0.4);
        }
        .btn-danger:active { top: 6px; box-shadow: 0 0px 0 #7f1d1d, 0 2px 10px rgba(0, 0, 0, 0.4), inset 0 2px 0 rgba(255,255,255,0.4); }
        
        .input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid rgba(212, 175, 55, 0.4); background: rgba(0, 0, 0, 0.4); color: var(--white); font-size: 18px; font-family: 'Roboto Mono', monospace; font-weight: 700; outline: none; transition: all 0.2s; touch-action: manipulation; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
        .input:focus { border-color: var(--white); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.3); }

        /* MENU */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 16px; }
        .game-card { 
            background: linear-gradient(145deg, #16224a, #0f1832); border: 1px solid rgba(212, 175, 55, 0.15); 
            border-radius: 16px; padding: 20px 14px; text-align: center; cursor: pointer; 
            transition: all 0.1s; box-shadow: 0 6px 0 #050812, 0 10px 20px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.05); 
            touch-action: manipulation; position: relative; top: 0;
        }
        .game-card:active { top: 6px; box-shadow: 0 0px 0 #050812, 0 2px 10px rgba(0,0,0,0.3); border-color: var(--gold); }
        .game-card .game-emoji { font-size: 38px; margin-bottom: 10px; display: block; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); pointer-events: none; }
        .game-card .game-name { font-size: 13px; font-weight: 800; letter-spacing: 1px; color: var(--white); pointer-events: none; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(5, 8, 20, 0.95); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 5000; padding: 20px; }
        .modal { background: var(--card); border: 1px solid var(--gold); border-radius: 24px; padding: 28px; width: 100%; max-width: 380px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255,255,255,0.1); animation: modalIn 0.2s cubic-bezier(0.1, 0.8, 0.3, 1); }
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .modal h3 { font-size: 20px; margin-bottom: 20px; color: var(--gold); text-align: center; font-weight: 800; }
        .modal p { font-size: 15px; line-height: 1.6; color: var(--text); text-align: center; }

        /* GAME HEADER */
        .game-header { display: flex; align-items: center; justify-content: space-between; margin: 16px; }
        .game-title { font-size: 24px; font-weight: 900; color: var(--white); letter-spacing: 1px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .instruction-block { background: rgba(212, 175, 55, 0.05); border-left: 4px solid var(--gold); border-radius: 8px; padding: 16px; margin: 16px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
        .instruction-block .instr-title { font-size: 12px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; }
        .instruction-block .instr-text { font-size: 13px; line-height: 1.6; color: var(--text); }

        /* BET INPUTS */
        .bet-row { display: flex; gap: 10px; margin: 16px; align-items: center; }
        .bet-row .input { flex: 1; }
        .quick-bets { display: flex; gap: 8px; margin: 0 16px 16px; }
        .quick-bets button { 
            flex: 1; background: linear-gradient(180deg, #2a3b6b 0%, #1e2a4f 100%); 
            border: 1px solid rgba(255,255,255,0.1); color: var(--white); border-radius: 10px; padding: 12px 0; 
            font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'Roboto Mono', monospace; 
            transition: all 0.1s; outline: none; box-shadow: 0 4px 0 #0d142e; top: 0; position: relative;
        }
        .quick-bets button:active { top: 4px; box-shadow: 0 0 0 #0d142e; }

        /* RESULT */
        .result-badge { text-align: center; font-size: 18px; font-weight: 800; margin: 16px; min-height: 28px; pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .win-text { color: #4ade80; }
        .lose-text { color: #f87171; }
        .neutral-text { color: var(--gold); }

        /* LEADERBOARD */
        .leader-row { display: flex; align-items: center; padding: 16px; border-radius: 12px; background: linear-gradient(145deg, #16224a, #0f1832); margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .leader-row.me { border-color: var(--gold); background: linear-gradient(145deg, #2a3b6b, #1e2a4f); box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .leader-rank { width: 36px; font-weight: 900; font-size: 18px; color: var(--text-dim); text-align: center; font-family: 'Roboto Mono', monospace; }
        .leader-row:nth-child(1) .leader-rank { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
        .leader-row:nth-child(2) .leader-rank { color: #cbd5e1; }
        .leader-row:nth-child(3) .leader-rank { color: #b45309; }
        .leader-name { flex: 1; font-weight: 700; font-size: 16px; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--white); }
        .leader-balance { font-family: 'Roboto Mono', monospace; color: var(--gold-light); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 6px; }

        /* PROFILE */
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #1e3a8a, #0f1832); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 44px; font-weight: 900; color: var(--gold); margin: 0 auto 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(212, 175, 55, 0.3); }

        /* BONUS */
        .bonus-timer { font-family: 'Roboto Mono', monospace; font-size: 42px; font-weight: 700; color: var(--white); margin: 20px 0; text-align: center; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        /* DICE */
        .dice-wrapper { margin: 16px; }
        .dice-bar-container { position: relative; height: 48px; background: #0a1128; border-radius: 12px; overflow: hidden; border: 2px solid #1e2a4f; margin-bottom: 16px; display: flex; pointer-events: none; box-shadow: inset 0 4px 10px rgba(0,0,0,0.5); }
        .dice-bar-lose { background: linear-gradient(180deg, #7f1d1d, #450a0a); transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: rgba(255,255,255,0.5); }
        .dice-bar-win { background: linear-gradient(180deg, #14532d, #052e16); transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: rgba(255,255,255,0.8); }
        .dice-slider { width: 100%; accent-color: var(--gold); height: 12px; cursor: pointer; touch-action: manipulation; border-radius: 6px; }
        .dice-display { text-align: center; font-size: 72px; font-weight: 900; font-family: 'Roboto Mono', monospace; color: var(--white); margin: 20px 0; pointer-events: none; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .dice-display.win { color: #4ade80; text-shadow: 0 0 20px rgba(74, 222, 128, 0.5); }
        .dice-display.lose { color: #f87171; text-shadow: 0 0 20px rgba(248, 113, 113, 0.5); }

        /* WHEEL */
        .wheel-wrapper { position: relative; width: 300px; height: 300px; margin: 20px auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6)); }
        .wheel-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--white); z-index: 10; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8)); }
        .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden; border: 6px solid #1e2a4f; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px var(--gold); transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(145deg, #16224a, #0f1832); border: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 5; box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5); }
        .wheel-label { position: absolute; top: 50%; left: 50%; font-size: 16px; font-weight: 900; color: var(--white); text-shadow: 0 2px 6px rgba(0,0,0,1); transform-origin: 0 0; pointer-events: none; z-index: 2; }

        /* CRASH */
        #crashCanvas { width: 100%; height: 240px; border-radius: 16px; background: #0a1128; border: 2px solid #1e2a4f; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .crash-multiplier { text-align: center; font-size: 64px; font-weight: 900; font-family: 'Roboto Mono', monospace; color: var(--white); margin: 16px 0; pointer-events: none; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
        .crash-multiplier.crashed { color: var(--danger); text-shadow: 0 0 20px rgba(185, 28, 28, 0.5); }

        /* MINES */
        .mines-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 16px; }
        .mine-cell { aspect-ratio: 1; background: linear-gradient(180deg, #2a3b6b, #1e2a4f); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 26px; cursor: pointer; transition: all 0.1s; touch-action: manipulation; box-shadow: 0 4px 0 #0d142e; position: relative; top: 0; }
        .mine-cell:active { top: 4px; box-shadow: 0 0 0 #0d142e; }
        .mine-cell.safe { background: linear-gradient(180deg, #166534, #14532d); border-color: #22c55e; pointer-events: none; box-shadow: 0 0 0 #052e16; top: 4px; }
        .mine-cell.bomb { background: linear-gradient(180deg, #991b1b, #7f1d1d); border-color: #ef4444; pointer-events: none; box-shadow: 0 0 0 #450a0a; top: 4px; }
        .mine-cell.disabled { pointer-events: none; opacity: 0.3; box-shadow: none; top: 4px; }

        /* UPGRADER */
        .upg-wheel-wrapper { position: relative; width: 280px; height: 280px; margin: 20px auto; border-radius: 50%; box-shadow: 0 15px 30px rgba(0,0,0,0.6); }
        .upg-wheel-bg { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; pointer-events: none; background: #0a1128; border: 6px solid #1e2a4f; box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 0 0 4px var(--gold); }
        .upg-pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--white); z-index: 10; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.8)); }
        .upg-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; background: linear-gradient(145deg, #16224a, #0f1832); border-radius: 50%; border: 3px solid var(--gold); z-index: 5; display: flex; align-items: center; justify-content: center; font-weight: bold; pointer-events: none; color: var(--gold); box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5); }
        .upg-arrow { position: absolute; top: 50%; left: 50%; width: 120px; height: 6px; background: var(--white); transform-origin: 0 50%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1); z-index: 4; box-shadow: 0 0 15px rgba(255,255,255,0.8); pointer-events: none; border-radius: 4px; }

        /* SLOTS */
        .slots-machine { display: flex; justify-content: center; gap: 12px; margin: 24px 16px; padding: 20px; background: #0a1128; border-radius: 20px; border: 4px solid #1e2a4f; box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 0 2px var(--gold); }
        .slot-reel { width: 85px; height: 110px; background: #121c3a; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .slot-strip { position: absolute; width: 100%; display: flex; flex-direction: column; align-items: center; transition: top 0.1s linear; }
        .slot-symbol { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; font-size: 48px; flex-shrink: 0; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.5)); }

        /* BLACKJACK */
        .bj-cards { display: flex; flex-wrap: wrap; gap: 8px; min-height: 80px; margin: 12px 0; justify-content: center; pointer-events: none; }
        .bj-card { width: 55px; height: 75px; border-radius: 8px; background: #fff; color: #0a1128; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 20px; border: 1px solid #cbd5e1; box-shadow: 0 6px 15px rgba(0,0,0,0.4); }
        .bj-card.red { color: #dc2626; }
        .bj-card.hidden { background: linear-gradient(135deg, #1e3a8a, #0a1128); color: var(--gold); font-size: 28px; border: 2px solid var(--gold); }
        .bj-buttons { display: flex; gap: 12px; margin: 16px; }
        .bj-buttons .btn { flex: 1; }

        /* COIN */
        .coin-wrapper { perspective: 1000px; display: flex; justify-content: center; margin: 40px 0; height: 160px; align-items: center; pointer-events: none; }
        .coin { width: 140px; height: 140px; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.3, 1); }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; font-size: 64px; border: 4px solid var(--gold); box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.3); }
        .coin-front { background: linear-gradient(135deg, #ffffff, #f3e5ab 50%, #d4af37); transform: rotateX(0deg); }
        .coin-back { background: linear-gradient(135deg, #cbd5e1, #64748b); transform: rotateX(180deg); }

        /* PLINKO */
        #plinkoCanvas { width: 100%; height: 380px; border-radius: 16px; background: #0a1128; border: 2px solid #1e2a4f; display: block; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }

        /* TOWER */
        .tower-row { display: flex; gap: 10px; margin: 10px 16px; justify-content: center; }
        .tower-cell { flex: 1; max-width: 80px; aspect-ratio: 1.2; background: linear-gradient(180deg, #2a3b6b, #1e2a4f); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; font-size: 26px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.1s; color: #fff; position: relative; box-shadow: 0 4px 0 #0d142e; touch-action: manipulation; top: 0; }
        .tower-cell:active { top: 4px; box-shadow: 0 0 0 #0d142e; }
        .tower-cell.active-level { border-color: var(--gold); box-shadow: 0 4px 0 #0d142e, 0 0 15px rgba(212, 175, 55, 0.4); }
        .tower-cell.safe { background: linear-gradient(180deg, #166534, #14532d); border-color: #22c55e; pointer-events: none; box-shadow: 0 0 0 #052e16; top: 4px; }
        .tower-cell.bomb { background: linear-gradient(180deg, #991b1b, #7f1d1d); border-color: #ef4444; pointer-events: none; box-shadow: 0 0 0 #450a0a; top: 4px; }
        .tower-cell.locked { opacity: 0.2; pointer-events: none; box-shadow: none; top: 4px; }
        .tower-mult { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--gold); font-weight: 800; pointer-events: none; }

        /* CUBE */
        .cube-result { text-align: center; font-size: 100px; margin: 20px 0; min-height: 130px; line-height: 1; pointer-events: none; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5)); }

        /* DUEL */
        .ring-container { position: relative; width: 100%; height: 260px; background: #0a1128; border: 4px solid #1e2a4f; border-radius: 20px; margin: 16px 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; padding: 16px; overflow: hidden; box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 0 2px var(--gold); }
        .fighter { width: 70px; height: 70px; background: linear-gradient(145deg, #16224a, #0f1832); border: 3px solid var(--gold); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: 12px; transition: all 0.5s ease; position: relative; pointer-events: none; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        .fighter .avatar { font-size: 30px; margin-bottom: 2px; }
        .fighter.dead { transform: scale(0.5) translateY(100px); opacity: 0; }
        .fighter.punch { animation: punchAnim 0.3s; }
        @keyframes punchAnim { 0% { transform: scale(1); } 50% { transform: scale(1.2) translateX(10px); } 100% { transform: scale(1); } }

        /* ADMIN */

        .admin-sub { font-size: 12px; color: var(--text-dim); pointer-events: none; font-family: 'Roboto Mono', monospace; }
        .admin-balance { color: var(--gold); font-weight: 800; font-family: 'Roboto Mono', monospace; display: flex; align-items: center; gap: 6px; font-size: 15px; }

        <button class="nav-btn" data-nav="profile"><span class="nav-icon">👤</span><span>Профиль</span></button>
    </nav>
</div>

<script>
(function () {
    'use strict';

    const CLOUD_URL = "https://api.jsonbin.io/v3/b/6ade1189ac6210605a50e15e";
    const API_KEY = "$2a$10$Uej2IQIZlXOLtotKvDo3Iek.93rZ5jlR7t8wq5kFLqb4/AlHTrK0O"; 
    const ENCODED_PASS = "0LfQsNC50LrQsDE5NTY3OA==";

    const LS = {
        nick: 'nv_nick',
        balance: 'nv_balance',
        bonusTime: 'nv_bonus_ts',
        tgId: 'nv_tg_id'
    };

    let state = {
        nick: '', balance: 0, currentScreen: 'menu', currentGame: null, cleanupFns: [],
        bonusInterval: null, tgId: null, adminScreen: 'list', adminSelectedPlayer: null, adminPlayers: []
    };

    function getEl(id) { return document.getElementById(id); }
    function formatNum(n) { return Math.floor(n).toLocaleString('ru-RU'); }

    function secureRandom() {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        return array[0] / 4294967296;
    }

    function checkPassword(input) {
        try {
            const decoded = decodeURIComponent(escape(atob(ENCODED_PASS)));
            return input === decoded;
        } catch (e) { return false; }
    }

    async function checkBan() {
        if (!state.tgId || state.tgId === 'local_user') return true;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            const me = arr.find(p => p.id === state.tgId);
            if (me && me.bannedUntil && me.bannedUntil > Date.now()) {
                showBanScreen(me.banReason, me.bannedUntil);
                return false;
            }
            return true;
        } catch (e) { return true; }
    }

    function showBanScreen(reason, until) {
        const overlay = document.createElement('div');
        overlay.className = 'ban-screen';
        const remainingMs = until - Date.now();
        const mins = Math.floor(remainingMs / 60000);
        const hours = Math.floor(mins / 60);
        overlay.innerHTML = `
            <div style="font-size: 80px; margin-bottom: 20px;">🚫</div>
            <h1 style="color: #ef4444; margin-bottom: 20px; font-size: 24px;">Доступ закрыт</h1>
            <p style="color: #e2e8f0; font-size: 16px; margin-bottom: 10px;">Причина: <b>${reason}</b></p>
            <p style="color: #94a3b8; font-size: 14px;">Осталось: ${hours > 0 ? hours + ' ч. ' : ''}${mins % 60} мин.</p>
            <button class="btn btn-outline mt-16" onclick="location.reload()">Понятно</button>`;
        document.body.appendChild(overlay);
        document.getElementById('content').style.display = 'none';
    }

    function loadState() {
        state.nick = localStorage.getItem(LS.nick) || '';
        state.balance = parseInt(localStorage.getItem(LS.balance) || '5000', 10);
        if (isNaN(state.balance)) state.balance = 5000;
        
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
            state.tgId = Telegram.WebApp.initDataUnsafe.user.id.toString();
            let tgName = Telegram.WebApp.initDataUnsafe.user.first_name || 'Гость';
            if (!localStorage.getItem(LS.nick)) {
                localStorage.setItem(LS.nick, tgName);
                state.nick = tgName;
            }
        } else {
            state.tgId = localStorage.getItem(LS.tgId) || 'local_user';
        }
        localStorage.setItem(LS.tgId, state.tgId);
    }

    async function syncBalance() {
        if (!state.tgId || state.tgId === 'local_user') return;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            const me = arr.find(p => p.id === state.tgId);
            if (me && me.balance !== undefined) {
                state.balance = me.balance;
                localStorage.setItem(LS.balance, String(state.balance));
                updateHeader();
            }
        } catch (e) {}
    }

    function saveBalance() {
        if (state.balance < 0) state.balance = 0; 
        localStorage.setItem(LS.balance, String(state.balance));
        updateHeader();
        savePlayerScore();
    }

    function updateHeader() {
        getEl('headerNick').textContent = state.nick || 'Гость';
        getEl('headerBalance').textContent = formatNum(state.balance);
    }

    function registerCleanup(fn) { state.cleanupFns.push(fn); }
    function clearAllTimers() {
        state.cleanupFns.forEach(fn => { try { fn(); } catch (e) {} });
        state.cleanupFns = [];
        if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; }
    }

    function setScreen(name) {
        clearAllTimers();
        state.currentScreen = name;
        state.currentGame = null;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.nav === name));
        renderScreen();
    }

    function renderScreen() {
        const c = getEl('content');
        c.innerHTML = '';
        switch (state.currentScreen) {
            case 'menu': renderMenu(c); break;
            case 'top': renderTop(c); break;
            case 'bonus': renderBonus(c); break;
            case 'profile': renderProfile(c); break;
            case 'admin': renderAdmin(c); break;
            default: renderMenu(c);
        }
    }

    // ============ СЕКРЕТНОЕ НАЖАТИЕ ============
    let clickCount = 0;
    let clickTimer = null;
    
    getEl('secretTrigger').addEventListener('click', () => {
        clickCount++;
        clearTimeout(clickTimer);
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        
        if (clickCount >= 5) {
            clickCount = 0;
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal">
                    <h3>Вход для разработчика</h3>
                    <input class="input" id="adminPass" type="password" placeholder="Введите пароль">
                    <div id="adminError" style="color:var(--danger);font-size:12px;text-align:center;margin-top:8px;min-height:18px;"></div>
                    <div class="flex-row mt-16">
                        <button class="btn btn-outline" id="adminCancel">Отмена</button>
                        <button class="btn" id="adminConfirm">Войти</button>
                    </div>
                </div>`;
            document.body.appendChild(overlay);
            const input = overlay.querySelector('#adminPass');
            input.focus();
            
            overlay.querySelector('#adminConfirm').addEventListener('click', () => {
                if (checkPassword(input.value)) {
                    overlay.remove();
                    state.currentScreen = 'admin';
                    state.adminScreen = 'list';
                    renderScreen();
                } else {
                    overlay.querySelector('#adminError').textContent = 'Неверный пароль!';
                }
            });
            overlay.querySelector('#adminCancel').addEventListener('click', () => overlay.remove());
            input.addEventListener('keydown', (e) => { if (e.key === 'Enter') overlay.querySelector('#adminConfirm').click(); });
        }
    });

    // ============ АДМИН ПАНЕЛЬ ============
    async function renderAdmin(c) {
        const h = document.createElement('div');
        h.className = 'game-header';
        h.innerHTML = `<button class="btn btn-outline btn-small" id="adminBackBtn">← Выйти</button><span class="game-title">Админ</span><span style="width:70px"></span>`;
        c.appendChild(h);
        h.querySelector('#adminBackBtn').addEventListener('click', () => setScreen('menu'));

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        c.appendChild(wrap);

        if (state.adminScreen === 'list') {
            wrap.innerHTML = `
                <div class="flex-row mt-16" style="margin-bottom:16px;">
                    <button class="btn btn-outline" id="adminRefresh">🔄 Обновить</button>
                    <button class="btn btn-outline" id="adminRules">📜 Правила</button>
                </div>
                <input class="input search-input" id="adminSearch" type="text" placeholder="Поиск по нику или ID...">
                <div id="adminList"><div class="center small-text mt-16">Загрузка...</div></div>
            `;
            
            const listEl = wrap.querySelector('#adminList');
            const searchInput = wrap.querySelector('#adminSearch');
            
            async function loadPlayers() {
                listEl.innerHTML = '<div class="center small-text mt-16">Загрузка...</div>';
                try {
                    const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
                    const data = await res.json();
                    let arr = data.record;
                    if (typeof arr === 'string') arr = JSON.parse(arr);
                    if (!Array.isArray(arr)) arr = [];
                    if (state.nick && !arr.find(p => p.id === state.tgId)) {
                        arr.push({ id: state.tgId, name: state.nick, balance: state.balance });
                    }
                    state.adminPlayers = arr;
                    renderPlayerList();
                } catch (e) {
                    listEl.innerHTML = '<div class="center small-text" style="color:var(--danger);">Ошибка загрузки</div>';
                }
            }
            
            function renderPlayerList() {
                const query = searchInput.value.toLowerCase();
                const filtered = state.adminPlayers.filter(p => 
                    (p.name || '').toLowerCase().includes(query) || (p.id || '').toLowerCase().includes(query)
                );
                if (filtered.length === 0) {
                    listEl.innerHTML = '<div class="center small-text">Никого не найдено</div>';
                    return;
                }
                listEl.innerHTML = '';
                filtered.forEach(p => {
                    const row = document.createElement('div');
                    row.className = 'admin-player-row';
                    row.innerHTML = `
                        <div class="admin-label"><span>${p.name || 'Без имени'}</span><span class="admin-balance"><span class="coin-icon" style="width:14px;height:14px;"></span> ${formatNum(p.balance || 0)}</span></div>
                        <div class="admin-sub">ID: ${p.id || 'Нет ID'}</div>
                    `;
                    row.addEventListener('click', () => {
                        state.adminSelectedPlayer = p;
                        state.adminScreen = 'actions';
                        renderAdmin(c);
                    });
                    listEl.appendChild(row);
                });
            }
            
            wrap.querySelector('#adminRefresh').addEventListener('click', loadPlayers);
            searchInput.addEventListener('input', renderPlayerList);
            wrap.querySelector('#adminRules').addEventListener('click', () => { state.adminScreen = 'rules'; renderAdmin(c); });
            
            loadPlayers();
            
        } else if (state.adminScreen === 'actions') {
            const p = state.adminSelectedPlayer;
            wrap.innerHTML = `
                <button class="btn btn-outline" id="adminBackToList" style="margin-bottom:16px; width:100%;">← Назад к списку</button>
                <div class="card" style="margin:0 0 16px 0; text-align:center;">
                    <div style="font-size:22px;font-weight:900;color:var(--white);">${p.name}</div>
                    <div class="small-text mt-8" style="font-family:'Roboto Mono'">ID: ${p.id}</div>
                    <div class="mt-8" style="color:var(--gold);font-weight:800;font-size:20px; display:flex; align-items:center; justify-content:center; gap:6px;">
                        Баланс: ${formatNum(p.balance || 0)} <span class="coin-icon" style="width:18px;height:18px;"></span>
                    </div>
                </div>
                
                <div class="card" style="margin:0 0 16px 0;">
                    <div style="font-weight:800;margin-bottom:12px;color:var(--white);">Дать/Забрать SPH (минус = забрать)</div>
                    <input class="input" id="adminGiveAmount" type="number" placeholder="Сумма">
                    <button class="btn mt-16" id="adminGiveBtn" style="width:100%;">Применить</button>
                </div>

                <div class="card" style="margin:0 0 16px 0;">
                    <div style="font-weight:800;margin-bottom:12px;color:var(--white);">Забанить</div>
                    <input class="input" id="adminBanTime" type="number" placeholder="Минуты" style="margin-bottom:12px;">
                    <input class="input" id="adminBanReason" type="text" placeholder="Причина" style="margin-bottom:16px;">
                    <button class="btn btn-danger" id="adminBanBtn" style="width:100%; margin-bottom:12px;">Забанить</button>
                    <button class="btn btn-outline" id="adminUnbanBtn" style="width:100%;">Разбанить</button>
                </div>
            `;
            
            wrap.querySelector('#adminBackToList').addEventListener('click', () => { state.adminScreen = 'list'; renderAdmin(c); });
            
            wrap.querySelector('#adminGiveBtn').addEventListener('click', async () => {
                const amount = parseInt(wrap.querySelector('#adminGiveAmount').value, 10);
                if (!amount || amount === 0) { showToast('Введите сумму!'); return; }
                p.balance = (p.balance || 0) + amount;
                if (p.balance < 0) p.balance = 0;
                if (p.id === state.tgId) {
                    state.balance = p.balance;
                    localStorage.setItem(LS.balance, String(state.balance));
                    updateHeader();
                }
                showToast(`Баланс изменен на ${amount > 0 ? '+' : ''}${formatNum(amount)} SPH`);
                await saveAdminChanges();
            });
            
            wrap.querySelector('#adminBanBtn').addEventListener('click', async () => {
                const mins = parseInt(wrap.querySelector('#adminBanTime').value, 10);
                const reason = wrap.querySelector('#adminBanReason').value.trim();
                if (!mins || mins <= 0) { showToast('Введите время!'); return; }
                p.bannedUntil = Date.now() + (mins * 60000);
                p.banReason = reason || 'Без причины';
                showToast(`Игрок забанен!`);
                await saveAdminChanges();
            });

            wrap.querySelector('#adminUnbanBtn').addEventListener('click', async () => {
                p.bannedUntil = 0;
                p.banReason = '';
                showToast(`Игрок разбанен!`);
                await saveAdminChanges();
            });
            
        } else if (state.adminScreen === 'rules') {
            wrap.innerHTML = `
                <button class="btn btn-outline" id="adminBackToList" style="margin-bottom:16px; width:100%;">← Назад к списку</button>
                <div class="card" style="margin:0;">
                    <div style="font-weight:900;font-size:20px;color:var(--gold);margin-bottom:16px;">📜 Правила</div>
                    <div class="small-text" style="line-height:1.8;color:var(--text);font-size:15px;">
                        1. Запрещено использовать баги.<br><br>
                        2. Запрещено оскорблять других.<br><br>
                        3. Администрация вправе выдать бан.<br><br>
                        4. Играйте честно!
                    </div>
                </div>
            `;
            wrap.querySelector('#adminBackToList').addEventListener('click', () => { state.adminScreen = 'list'; renderAdmin(c); });
        }
    }

    async function saveAdminChanges() {
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            
            const p = state.adminSelectedPlayer;
            const idx = arr.findIndex(x => x.id === p.id);
            if (idx !== -1) {
                arr[idx].balance = p.balance;
                arr[idx].bannedUntil = p.bannedUntil;
                arr[idx].banReason = p.banReason;
            } else {
                arr.push(p);
            }
            
            arr.sort((a, b) => b.balance - a.balance);
            await fetch(CLOUD_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(arr.slice(0, 100))
            });
        } catch (e) { console.warn(e); }
    }

    // ============ ИГРЫ ============
    function renderMenu(c) {
        const games = [
            { id: 'crash', name: 'CRASH', emoji: '📈' },
            { id: 'mines', name: 'MINES', emoji: '💣' },
            { id: 'dice', name: 'DICE', emoji: '🎲' },
            { id: 'wheel', name: 'WHEEL', emoji: '🎡' },
            { id: 'thimbles', name: 'SHELLS', emoji: '🥃' },
            { id: 'slots', name: 'SLOTS', emoji: '🎰' },
            { id: 'blackjack', name: 'BLACKJACK', emoji: '🃏' },
            { id: 'coin', name: 'COIN', emoji: '🪙' },
            { id: 'plinko', name: 'PLINKO', emoji: '⚪' },
            { id: 'tower', name: 'TOWER', emoji: '🏗️' },
            { id: 'cube', name: 'CUBE', emoji: '🎲' },
            { id: 'roulette', name: 'ROULETTE', emoji: '🎯' },
            { id: 'duel', name: 'DUEL', emoji: '🥊' },
            { id: 'upgrader', name: 'UPGRADER', emoji: '⬆️' }
        ];
        const grid = document.createElement('div');
        grid.className = 'games-grid';
        games.forEach(g => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `<span class="game-emoji">${g.emoji}</span><span class="game-name">${g.name}</span>`;
            card.addEventListener('click', () => openGame(g.id));
            grid.appendChild(card);
        });
        c.appendChild(grid);
    }

    function openGame(id) {
        clearAllTimers();
        state.currentScreen = 'game';
        state.currentGame = id;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        renderGame();
    }

    function renderGame() {
        const c = getEl('content');
        c.innerHTML = '';
        const game = state.currentGame;
        const games = {
            crash: renderCrash, mines: renderMines, dice: renderDice, wheel: renderWheel,
            thimbles: renderThimbles, slots: renderSlots, blackjack: renderBlackjack,
            coin: renderCoin, plinko: renderPlinko, tower: renderTower, cube: renderCube,
            roulette: renderRoulette, duel: renderDuel, upgrader: renderUpgrader
        };
        if (games[game]) games[game](c);
    }

    function buildGameHeader(c, title, instructions) {
        const h = document.createElement('div');
        h.className = 'game-header';
        h.innerHTML = `<button class="btn btn-outline btn-small" id="backBtn">← Назад</button><span class="game-title">${title}</span><span style="width:80px"></span>`;
        c.appendChild(h);
        h.querySelector('#backBtn').addEventListener('click', () => setScreen('menu'));

        const instr = document.createElement('div');
        instr.className = 'instruction-block';
        instr.innerHTML = `<div class="instr-title">📋 ПРАВИЛА</div><div class="instr-text">${instructions}</div>`;
        c.appendChild(instr);
    }

    function buildBetInput(c, defaultVal) {
        const row = document.createElement('div');
        row.className = 'bet-row';
        row.innerHTML = `<input class="input" id="betInput" type="number" min="1" max="5000000" placeholder="Ставка" value="${defaultVal || 100}">`;
        c.appendChild(row);

        const quick = document.createElement('div');
        quick.className = 'quick-bets';
        [1000, 10000, 100000, 5000000].forEach(v => {
            const b = document.createElement('button');
            b.textContent = v === 5000000 ? 'MAX' : (v >= 100000 ? (v/1000)+'K' : v);
            b.addEventListener('click', () => { getEl('betInput').value = v; });
            quick.appendChild(b);
        });
        c.appendChild(quick);
        return row;
    }

    function validateBet() {
        const inp = getEl('betInput');
        if (!inp) return null;
        const val = inp.value.trim();
        if (!val || isNaN(val)) { showToast('Введите сумму!'); return null; }
        const num = parseInt(val, 10);
        if (num <= 0) { showToast('Ставка > 0!'); return null; }
        if (num > 5000000) { showToast('Максимум 5 000 000!'); return null; }
        if (num > state.balance) { showToast('Недостаточно средств!'); return null; }
        return num;
    }

    function showToast(msg) {
        let t = document.getElementById('toast');
        if (!t) {
            t = document.createElement('div');
            t.id = 'toast';
            t.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1e3a8a;color:#fff;padding:14px 28px;border-radius:12px;font-size:14px;font-weight:700;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.6);transition:opacity 0.3s;max-width:90%;text-align:center;pointer-events:none;border:2px solid var(--gold);';
            document.body.appendChild(t);
        }
        t.textContent = msg;
        t.style.opacity = '1';
        clearTimeout(t._timeout);
        t._timeout = setTimeout(() => { t.style.opacity = '0'; }, 2200);
    }

    function showResult(container, text, type) {
        const el = document.createElement('div');
        el.className = 'result-badge ' + (type === 'win' ? 'win-text' : type === 'lose' ? 'lose-text' : 'neutral-text');
        el.textContent = text;
        container.appendChild(el);
        return el;
    }

    // ============ CRASH ============
    function renderCrash(c) {
        buildGameHeader(c, 'CRASH', 'Ракета летит вверх. Успейте забрать до взрыва!');
        buildBetInput(c, 100);
        const wrap = document.createElement('div'); wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `<canvas id="crashCanvas" width="600" height="440"></canvas><div class="crash-multiplier" id="crashMult">1.00x</div><div class="flex-row mt-16"><button class="btn btn-outline" id="crashStart">Старт</button><button class="btn" id="crashCashout" disabled>Забрать</button></div>`;
        c.appendChild(wrap);

        const canvas = getEl('crashCanvas'), ctx = canvas.getContext('2d'), multEl = getEl('crashMult'), startBtn = getEl('crashStart'), cashoutBtn = getEl('crashCashout');
        let running = false, crashed = false, cashedOut = false, currentMult = 1.0, crashPoint = 1.0, animId = null, startTs = 0, betAmount = 0;

        function drawCrashScene(t, mult, isCrashed) {
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = '#0a1128'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
            for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 5); ctx.lineTo(W, H * i / 5); ctx.stroke(); }
            const points = [], steps = 60;
            for (let i = 0; i <= steps; i++) {
                const p = (i / steps) * Math.min(t, 1);
                const x = 60 + p * (W - 120);
                const y = H - 50 - Math.pow(p, 1.8) * (H - 100) * Math.min(mult / 3, 1) * 1.1;
                points.push({ x, y });
            }
            if (points.length > 1) {
                ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
                for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
                ctx.strokeStyle = isCrashed ? '#ef4444' : '#d4af37'; ctx.lineWidth = 4;
                ctx.shadowColor = isCrashed ? '#ef4444' : '#d4af37'; ctx.shadowBlur = 15; ctx.stroke(); ctx.shadowBlur = 0;
                const last = points[points.length - 1];
                ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.save(); ctx.translate(last.x, last.y - 20);
                if (!isCrashed) ctx.rotate(-0.6);
                ctx.fillText(isCrashed ? '💥' : '🚀', 0, 0); ctx.restore();
            }
            if (isCrashed) { ctx.fillStyle = 'rgba(239,68,68,0.1)'; ctx.fillRect(0, 0, W, H); }
        }

        function crashLoop(ts) {
            if (!running) return;
            if (!startTs) startTs = ts;
            const elapsed = (ts - startTs) / 1000;
            currentMult = 1.0 + elapsed * 0.45;
            if (currentMult > 30) currentMult = 30;
            if (currentMult >= crashPoint) { currentMult = crashPoint; doCrash(); return; }
            multEl.textContent = currentMult.toFixed(2) + 'x';
            drawCrashScene(Math.min(elapsed / 3, 1), currentMult, false);
            animId = requestAnimationFrame(crashLoop);
        }

        function doCrash() {
            running = false; crashed = true;
            if (animId) cancelAnimationFrame(animId);
            multEl.textContent = 'CRASH! ' + crashPoint.toFixed(2) + 'x'; multEl.classList.add('crashed');
            drawCrashScene(1, crashPoint, true); cashoutBtn.disabled = true;
            if (!cashedOut) showResult(c, '💥 Взрыв! Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
            startBtn.disabled = false; startBtn.textContent = 'Старт';
        }

        startBtn.addEventListener('click', () => {
            if (running) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            running = true; crashed = false; cashedOut = false; currentMult = 1.0; startTs = 0;
            multEl.classList.remove('crashed'); multEl.textContent = '1.00x';
            let r = secureRandom(); let cp = r < 0.15 ? 1.00 : (0.85 / (1 - r));
            if (cp > 10) cp = 10; if (cp < 1.01) cp = 1.01; crashPoint = cp;
            startBtn.disabled = true; cashoutBtn.disabled = false;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            animId = requestAnimationFrame(crashLoop);
        });

        cashoutBtn.addEventListener('click', () => {
            if (!running || cashedOut || crashed) return;
            cashedOut = true; running = false;
            if (animId) cancelAnimationFrame(animId);
            
            const winAmt = Math.floor(betAmount * currentMult);
            
            state.balance += winAmt; saveBalance();
            multEl.textContent = '✅ ' + currentMult.toFixed(2) + 'x';
            showResult(c, '💰 Выплата ' + formatNum(winAmt) + ' SPH', 'win');
            cashoutBtn.disabled = true; startBtn.disabled = false;
        });
        registerCleanup(() => { running = false; if (animId) cancelAnimationFrame(animId); });
    }

    function renderMines(c) {

        mineRow.innerHTML = `<span style="font-size:15px;font-weight:700;color:var(--white);">Мин:</span><input class="input" id="mineCount" type="number" min="1" max="24" value="3" style="flex:1;">`;
        c.appendChild(mineRow);
        buildBetInput(c, 100);
        const grid = document.createElement('div'); grid.className = 'mines-grid'; grid.id = 'minesGrid'; c.appendChild(grid);
        const controls = document.createElement('div'); controls.className = 'flex-row mt-16'; controls.style.margin = '16px';
        controls.innerHTML = `<button class="btn btn-outline" id="minesStart">Играть</button><button class="btn" id="minesCashout" disabled>Забрать</button>`;
        c.appendChild(controls);
        let active = false, minesArr = [], revealed = 0, totalSafe = 0, currentMult = 1, betAmount = 0, gameOver = false;

        function calcMultiplier(mines, revealedCount) {
            let mult = 1; for (let i = 0; i < revealedCount; i++) mult *= (25 - i) / (25 - mines - i);
            return Math.max(1, Math.floor((mult * 0.75) * 100) / 100);
        }

        function buildGrid() {
            grid.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div'); cell.className = 'mine-cell'; cell.dataset.index = i;
                cell.addEventListener('click', () => onCellClick(i, cell)); grid.appendChild(cell);
            }
        }

        function onCellClick(idx, cell) {
            if (!active || gameOver || cell.classList.contains('safe') || cell.classList.contains('bomb')) return;
            if (minesArr[idx]) {

                document.querySelectorAll('.mine-cell').forEach((el, i) => {

                getEl('minesCashout').disabled = true; getEl('minesStart').disabled = false; return;
            }

            const cashoutBtn = getEl('minesCashout');
            cashoutBtn.textContent = 'Забрать ' + formatNum(Math.floor(betAmount * currentMult)) + ' SPH';
            cashoutBtn.disabled = false;
            if (revealed >= totalSafe) {
                active = false; gameOver = true; cashoutBtn.disabled = true;
                const winAmt = Math.floor(betAmount * currentMult);
                state.balance += winAmt; saveBalance();
                showResult(c, '🏆 Успех! +' + formatNum(winAmt) + ' SPH', 'win');
                getEl('minesStart').disabled = false;
            }
        }

        getEl('minesStart').addEventListener('click', () => {
            if (active) return;
            const bet = validateBet(); if (!bet) return;
            const mc = parseInt(getEl('mineCount').value, 10);
            if (!mc || mc < 1 || mc > 24) { showToast('Мин 1-24!'); return; }
            betAmount = bet; state.balance -= bet; saveBalance();
            active = true; gameOver = false; revealed = 0; currentMult = 1; totalSafe = 25 - mc;
            minesArr = new Array(25).fill(false);

            getEl('minesStart').disabled = true; const old = c.querySelector('.result-badge'); if (old) old.remove();
        });

        getEl('minesCashout').addEventListener('click', () => {
            if (!active || gameOver) return;
            active = false; gameOver = true;
            const winAmt = Math.floor(betAmount * currentMult);
            state.balance += winAmt; saveBalance();
            showResult(c, '💰 Забрано ' + formatNum(winAmt) + ' SPH', 'win');
            document.querySelectorAll('.mine-cell').forEach((el, i) => {

            });
            getEl('minesCashout').disabled = true; getEl('minesStart').disabled = false;
        });
        buildGrid();
    }

        const wrap = document.createElement('div'); wrap.style.cssText = 'margin:0 auto; position:relative;';

            { label: 'x5', weight: 3, color: '#d4af37' }

        const wheelEl = getEl('wheelEl'), resultEl = getEl('wheelResult'); let spinning = false, currentRotation = 0;
        let currentAngle = 0;
        
        let gradientStr = '';
        sectors.forEach((sec, idx) => {
            const start = currentAngle;
            const end = currentAngle + (sec.weight / 100) * 360;
            gradientStr += `${sec.color} ${start}deg ${end}deg${idx < sectors.length - 1 ? ', ' : ''}`;
            
            const midAngle = currentAngle + ((sec.weight / 100) * 360) / 2;
            const label = document.createElement('div'); label.className = 'wheel-label';
            const rad = (midAngle - 90) * Math.PI / 180, r = 95;
            label.style.transform = `translate(calc(-50% + ${Math.cos(rad) * r}px), calc(-50% + ${Math.sin(rad) * r}px))`;
            label.textContent = sec.label; wheelEl.appendChild(label);
            
            currentAngle = end;
        });
        wheelEl.style.background = `conic-gradient(${gradientStr})`;

        getEl('wheelSpin').addEventListener('click', () => {
            if (spinning) return;
            const bet = validateBet(); if (!bet) return;
            spinning = true; state.balance -= bet; saveBalance();
            resultEl.textContent = ''; resultEl.className = 'result-badge';
            
            const rand = secureRandom() * 100; 
            let selected = sectors[0], acc = 0, selectedStartAngle = 0;
            for (const s of sectors) { if (rand >= acc && rand < acc + s.weight) { selected = s; selectedStartAngle = (acc / 100) * 360; break; } acc += s.weight; }
            
            const sectorSize = (selected.weight / 100) * 360, midAngle = selectedStartAngle + sectorSize / 2;
            const targetAngle = 360 * 5 + (360 - midAngle), baseRot = Math.ceil(currentRotation / 360) * 360;
            currentRotation = baseRot + targetAngle; wheelEl.style.transform = `rotate(${currentRotation}deg)`;
            
            const onEnd = () => {
                wheelEl.removeEventListener('transitionend', onEnd); spinning = false;
                const mult = parseFloat(selected.label.replace('x', ''));

                    const winAmt = Math.floor(bet * mult);

            registerCleanup(() => { wheelEl.removeEventListener('transitionend', onEnd); });

    // ============ THIMBLES ============
    function renderThimbles(c) {
        buildGameHeader(c, 'SHELLS', 'Найдите шарик.');
        buildBetInput(c, 100);
        const row = document.createElement('div'); row.className = 'thimbles-row'; row.id = 'thimblesRow'; c.appendChild(row);
        const startBtn = document.createElement('button'); startBtn.className = 'btn btn-outline'; startBtn.style.cssText = 'display:block;width:80%;margin:16px auto;'; startBtn.textContent = 'Начать'; c.appendChild(startBtn);
        let ballIndex = 0, playing = false, betAmount = 0, phase = 'idle', thimbleEls = [];

        function buildThimbles() {
            row.innerHTML = ''; thimbleEls = [];
            for (let i = 0; i < 3; i++) {
                const t = document.createElement('div'); t.className = 'thimble'; t.dataset.index = i; t.innerHTML = '<div class="ball"></div>';
                t.addEventListener('click', () => onThimbleClick(i)); row.appendChild(t); thimbleEls.push(t);
            }
        }

        function animateShuffle() {
            let step = 0; const totalSteps = 5;
            const shuffleInterval = setInterval(() => {
                thimbleEls.forEach((t) => {
                    t.classList.add('shuffling'); const randX = (secureRandom() - 0.5) * 60, randY = -20 - secureRandom() * 20;
                    t.style.transform = `translate(${randX}px, ${randY}px) rotate(${(secureRandom()-0.5)*30}deg)`;
                    setTimeout(() => { t.classList.remove('shuffling'); t.style.transform = ''; }, 400);
                });
                step++;
                if (step >= totalSteps) {
                    clearInterval(shuffleInterval);
                    const idxArr = [0, 1, 2]; for (let i = idxArr.length - 1; i > 0; i--) { const j = Math.floor(secureRandom() * (i + 1)); [idxArr[i], idxArr[j]] = [idxArr[j], idxArr[i]]; }
                    thimbleEls.forEach((t, i) => { t.dataset.index = idxArr[i]; });
                    phase = 'guess'; startBtn.disabled = false; startBtn.textContent = 'Выбрать';
                }
            }, 500);
            registerCleanup(() => clearInterval(shuffleInterval));
        }

        function onThimbleClick(i) {
            if (phase !== 'guess') return;
            phase = 'result'; playing = false;
            thimbleEls.forEach(t => t.classList.add('lifted'));
            let visualWinnerIdx = -1;
            thimbleEls.forEach((t, idx) => { if (parseInt(t.dataset.index) === ballIndex) { visualWinnerIdx = idx; t.classList.add('show-ball'); } });
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            if (i === visualWinnerIdx) {
                const winAmt = Math.floor(betAmount * 2.7);
                state.balance += winAmt; saveBalance();
                showResult(c, '🎉 Угадали! +' + formatNum(winAmt) + ' SPH', 'win');
            } else {
                showResult(c, '😞 Промах. Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
            }
            startBtn.textContent = 'Ещё раз'; startBtn.disabled = false; startBtn.onclick = null;
        }

        startBtn.addEventListener('click', () => {
            if (playing) return; if (phase === 'guess') return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            playing = true; phase = 'show'; startBtn.disabled = true; startBtn.textContent = 'Смотрим...';
            buildThimbles(); ballIndex = Math.floor(secureRandom() * 3);
            thimbleEls.forEach(t => t.classList.add('lifted'));
            setTimeout(() => { thimbleEls[ballIndex].classList.add('show-ball'); }, 100);
            setTimeout(() => { thimbleEls.forEach(t => { t.classList.remove('lifted'); }); }, 1200);
            setTimeout(() => { thimbleEls.forEach(t => t.classList.remove('show-ball')); phase = 'shuffling'; animateShuffle(); }, 1800);
            const old = c.querySelector('.result-badge'); if (old) old.remove();
        });
        buildThimbles();
        registerCleanup(() => { playing = false; phase = 'idle'; });
    }

    // ============ SLOTS ============
    function renderSlots(c) {
        buildGameHeader(c, 'SLOTS', '3 одинаковых = x7, 2 = x1.5.');
        buildBetInput(c, 100);
        const machine = document.createElement('div'); machine.className = 'slots-machine';

        const symbols = ['7️⃣', '💎', '🍒', '🍋', '🔔']; const reelStrips = [getEl('reel0'), getEl('reel1'), getEl('reel2')];
        let spinning = false, intervals = [], timeouts = [];

        function populateReel(el) {
            el.innerHTML = '';
            for (let i = 0; i < 20; i++) { const s = document.createElement('div'); s.className = 'slot-symbol'; s.textContent = symbols[Math.floor(secureRandom() * symbols.length)]; el.appendChild(s); }
        }
        reelStrips.forEach(populateReel); reelStrips.forEach(r => { r.style.top = '-110px'; });

        function startReelSpin(idx, stopAfter) {
            const el = reelStrips[idx]; let pos = -110;
            const iv = setInterval(() => {
                pos -= 110; if (pos <= -2090) pos = -110; el.style.top = pos + 'px';
                el.querySelectorAll('.slot-symbol').forEach(s => { if (secureRandom() < 0.3) s.textContent = symbols[Math.floor(secureRandom() * symbols.length)]; });
            }, 50);
            intervals.push(iv);
            const to = setTimeout(() => {
                clearInterval(iv); const finalSymbols = [];
                el.querySelectorAll('.slot-symbol').forEach(s => finalSymbols.push(s.textContent));
                el.style.top = '-110px'; const fs = finalSymbols[0] || symbols[0];
                el.querySelectorAll('.slot-symbol').forEach(s => { s.textContent = fs; }); el.dataset.finalSymbol = fs;
                if (idx === 2) finishSlots();
            }, stopAfter);
            timeouts.push(to);
        }

        function finishSlots() {
            spinning = false; spinBtn.disabled = false;
            const results = reelStrips.map(r => r.dataset.finalSymbol);
            const bet = parseInt(spinBtn.dataset.bet || '0', 10);
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            if (results[0] === results[1] && results[1] === results[2]) {
                const winAmt = bet * 7; state.balance += winAmt; saveBalance();
                showResult(c, '🎉 ДЖЕКПОТ! 7x +' + formatNum(winAmt) + ' SPH', 'win');
            } else if (results[0] === results[1] || results[1] === results[2] || results[0] === results[2]) {
                const winAmt = Math.floor(bet * 1.5); state.balance += winAmt; saveBalance();
                showResult(c, '✨ Два совпадения! 1.5x +' + formatNum(winAmt) + ' SPH', 'win');
            } else {
                showResult(c, '😞 Нет совпадений. Потеряно ' + formatNum(bet) + ' SPH', 'lose');
            }
        }

        spinBtn.addEventListener('click', () => {
            if (spinning) return;
            const bet = validateBet(); if (!bet) return;
            spinning = true; spinBtn.disabled = true; state.balance -= bet; saveBalance(); spinBtn.dataset.bet = bet;
            intervals.forEach(i => clearInterval(i)); timeouts.forEach(t => clearTimeout(t)); intervals = []; timeouts = [];
            reelStrips.forEach((r, i) => { r.dataset.finalSymbol = ''; startReelSpin(i, 1000 + i * 300); });

            getEl('bjResult').textContent = ''; getEl('bjResult').className = 'result-badge';
            if (calcScore(playerHand) === 21) {

            }
            function checkResult() {

    // ============ PLINKO ============
    function renderPlinko(c) {
        buildGameHeader(c, 'PLINKO', 'Шарик падает вниз.');
        buildBetInput(c, 100);
        const canvasWrap = document.createElement('div'); canvasWrap.style.cssText = 'margin:0 16px;';
        canvasWrap.innerHTML = '<canvas id="plinkoCanvas" width="600" height="680"></canvas>'; c.appendChild(canvasWrap);
        const btn = document.createElement('button'); btn.className = 'btn'; btn.style.cssText = 'display:block;width:80%;margin:16px auto;'; btn.textContent = 'Запустить'; c.appendChild(btn);
        const canvas = getEl('plinkoCanvas'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
        const rows = 7, pegRadius = 6, bottomSlots = [5, 2, 0.5, 0.2, 0.5, 2, 5], slotColors = ['#d4af37', '#1e3a8a', '#2563eb', '#0f1832', '#2563eb', '#1e3a8a', '#d4af37'];
        let pegs = [], gameActive = false, betAmount = 0;

        function buildPegs() {
            pegs = []; const topY = 80, bottomY = H - 120, rowSpacing = (bottomY - topY) / (rows - 1);
            for (let r = 0; r < rows; r++) {
                const count = r + 2, y = topY + r * rowSpacing, totalWidth = (count - 1) * 60, startX = W / 2 - totalWidth / 2;
                for (let i = 0; i < count; i++) pegs.push({ x: startX + i * 60, y });
            }
        }
        buildPegs();

        function drawPlinko(bx, by) {
            ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#0a1128'; ctx.fillRect(0, 0, W, H);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
            for (let i = 1; i < 6; i++) { ctx.beginPath(); ctx.moveTo(0, H * i / 6); ctx.lineTo(W, H * i / 6); ctx.stroke(); }
            for (const p of pegs) { ctx.beginPath(); ctx.arc(p.x, p.y, pegRadius, 0, Math.PI * 2); ctx.fillStyle = '#1e3a8a'; ctx.fill(); }
            const slotW = W / bottomSlots.length;
            for (let i = 0; i < bottomSlots.length; i++) {
                const x = i * slotW, y = H - 70, h = 55;
                ctx.fillStyle = slotColors[i] + '33'; ctx.strokeStyle = slotColors[i]; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.roundRect(x + 4, y, slotW - 8, h, 8); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(bottomSlots[i] + 'x', x + slotW / 2, y + h / 2);
            }
            if (bx !== null && by !== null) {
                ctx.beginPath(); ctx.arc(bx, by, 10, 0, Math.PI * 2); ctx.fillStyle = '#d4af37'; ctx.fill();
            }
        }
        drawPlinko(null, null);

        btn.addEventListener('click', () => {
            if (gameActive) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance(); gameActive = true;
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            let ballX = W / 2 + (secureRandom() - 0.5) * 10, ballY = 30, vy = 4.5, vx = 0;
            const intervalId = setInterval(() => {
                if (!gameActive) { clearInterval(intervalId); return; }
                ballY += vy; ballX += vx; vx *= 0.85;
                for (const p of pegs) {
                    const dx = ballX - p.x, dy = ballY - p.y, dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 18) {
                        const angle = Math.atan2(dy, dx); ballX = p.x + Math.cos(angle) * 19; ballY = p.y + Math.sin(angle) * 19;
                        vx = (secureRandom() - 0.5) * 12; vy = Math.abs(vy) * 0.9 + 1;
                    }
                }
                if (ballX < 20) { ballX = 20; vx = Math.abs(vx) * 0.6; }
                if (ballX > W - 20) { ballX = W - 20; vx = -Math.abs(vx) * 0.6; }
                if (ballY >= H - 80) {
                    clearInterval(intervalId); gameActive = false;
                    const slotW = W / bottomSlots.length; let slotIdx = Math.floor(ballX / slotW);
                    if (slotIdx < 0) slotIdx = 0; if (slotIdx >= bottomSlots.length) slotIdx = bottomSlots.length - 1;
                    const mult = bottomSlots[slotIdx], winAmt = Math.floor(betAmount * mult);
                    if (mult >= 1) { state.balance += winAmt; saveBalance(); showResult(c, `🎉 Луза ${mult}x! +${formatNum(winAmt)} SPH`, mult >= 2 ? 'win' : 'neutral'); }
                    else { state.balance += winAmt; saveBalance(); showResult(c, `😞 Луза ${mult}x. Возврат ${formatNum(winAmt)} SPH`, 'lose'); }
                    drawPlinko(null, null); return;
                }
                drawPlinko(ballX, ballY);
            }, 16);
            registerCleanup(() => { clearInterval(intervalId); gameActive = false; });
        });
        registerCleanup(() => { gameActive = false; });
    }

    // ============ TOWER ============
    function renderTower(c) {
        buildGameHeader(c, 'TOWER', 'Поднимайтесь выше. Избегайте мин.');
        buildBetInput(c, 100);
        const towerWrap = document.createElement('div'); towerWrap.id = 'towerWrap'; towerWrap.style.cssText = 'margin:16px 0;'; c.appendChild(towerWrap);
        const controls = document.createElement('div'); controls.className = 'flex-row mt-16'; controls.style.margin = '16px';
        controls.innerHTML = `<button class="btn btn-outline" id="towerStart">Начать</button><button class="btn" id="towerCashout" disabled>Забрать</button>`;
        c.appendChild(controls);
        const multipliers = [1.3, 1.8, 2.5, 4.0, 6.0];
        let active = false, currentLevel = 0, betAmount = 0, towerMines = [], gameOver = false;

        function buildTower() {
            towerWrap.innerHTML = '';
            for (let level = 4; level >= 0; level--) {
                const row = document.createElement('div'); row.className = 'tower-row'; row.dataset.level = level;
                for (let cell = 0; cell < 4; cell++) {
                    const el = document.createElement('div'); el.className = 'tower-cell'; el.dataset.level = level; el.dataset.cell = cell;
                    el.innerHTML = `<span class="tower-mult">${multipliers[level]}x</span>`;
                    el.addEventListener('click', () => onTowerClick(level, cell, el));
                    if (level > 0) el.classList.add('locked'); row.appendChild(el);
                }
                towerWrap.appendChild(row);
            }
        }

        function onTowerClick(level, cell, el) {
            if (!active || gameOver) return;
            if (level !== currentLevel) return;
            if (el.classList.contains('safe') || el.classList.contains('bomb')) return;
            if (towerMines[level] === cell) {
                gameOver = true; active = false; el.textContent = '💣'; el.classList.add('bomb');
                towerWrap.querySelectorAll('.tower-cell').forEach(e => {
                    if (parseInt(e.dataset.level) >= currentLevel) {
                        const lv = parseInt(e.dataset.level), cl = parseInt(e.dataset.cell);
                        if (towerMines[lv] === cl && !e.classList.contains('bomb')) { e.textContent = '💣'; e.classList.add('bomb'); }
                    }
                });
                towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
                showResult(c, '💥 Мина! Потеряно ' + formatNum(betAmount) + ' SPH', 'lose');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false; return;
            }
            el.classList.add('safe'); el.textContent = '💎'; el.classList.remove('locked');
            if (currentLevel < 4) {
                const nextRow = towerWrap.querySelectorAll('.tower-row')[4 - (currentLevel + 1)];
                if (nextRow) nextRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
                currentLevel++;
                const cashoutBtn = getEl('towerCashout'); cashoutBtn.disabled = false;
                cashoutBtn.textContent = 'Забрать ' + formatNum(Math.floor(betAmount * multipliers[currentLevel - 1])) + ' SPH';
            } else {
                currentLevel = 5; active = false; gameOver = true;
                const winAmt = Math.floor(betAmount * multipliers[4]); state.balance += winAmt; saveBalance();
                showResult(c, '🏆 Вы прошли башню! +' + formatNum(winAmt) + ' SPH', 'win');
                getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
            }
        }

        getEl('towerStart').addEventListener('click', () => {
            if (active) return;
            const bet = validateBet(); if (!bet) return;
            betAmount = bet; state.balance -= bet; saveBalance();
            active = true; gameOver = false; currentLevel = 0; towerMines = [];
            for (let i = 0; i < 5; i++) towerMines.push(Math.floor(secureRandom() * 4));
            buildTower();
            const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
            if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => { e.classList.remove('locked'); e.classList.add('active-level'); });
            getEl('towerCashout').disabled = true; getEl('towerCashout').textContent = 'Забрать';
            getEl('towerStart').disabled = true; const old = c.querySelector('.result-badge'); if (old) old.remove();
        });

        getEl('towerCashout').addEventListener('click', () => {
            if (!active || gameOver || currentLevel === 0) return;
            active = false; gameOver = true;
            const mult = multipliers[currentLevel - 1], winAmt = Math.floor(betAmount * mult);
            state.balance += winAmt; saveBalance();
            showResult(c, '💰 Забрано ' + formatNum(winAmt) + ' SPH', 'win');
            towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
            getEl('towerCashout').disabled = true; getEl('towerStart').disabled = false;
        });
        buildTower();
        towerWrap.querySelectorAll('.tower-cell').forEach(e => e.classList.add('locked'));
        const firstRow = towerWrap.querySelectorAll('.tower-row')[4];
        if (firstRow) firstRow.querySelectorAll('.tower-cell').forEach(e => e.classList.remove('locked'));
    }
