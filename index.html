                    else if (mode === 'even') { const isEven = result % 2 === 0; win = (evenChoice === 'even' && isEven) || (evenChoice === 'odd' && !isEven); multiplier = 1.9; }
                    else if (mode === 'over') { win = (overChoice === 'over' && result > 3.5) || (overChoice === 'under' && result < 3.5); multiplier = 1.9; }

                    if (win) { const winAmt = Math.floor(betAmount * multiplier); state.balance += winAmt; saveBalance(); showResult(c, `🎉 Выиграло ${result}! +${formatNum(winAmt)} SPH`, 'win'); }
                    else { showResult(c, `😞 Выпало ${result}. Потеряно ${formatNum(betAmount)} SPH`, 'lose'); }
                    rolling = false; playBtn.disabled = false;
                }
            }, 60);
            registerCleanup(() => clearInterval(spinInterval));
        });
        updateModeUI();
    }

    // ============ РУЛЕТКА ============
    function renderRoulette(c) {
        buildGameHeader(c, 'ROULETTE', 'Выберите цвет. Сектор 0 — самый большой.');
        buildBetInput(c, 100);
        
        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;">
                <button class="btn btn-outline" id="roulRed" style="border-color:#ef4444;color:#ef4444;">Красное (x2)</button>
                <button class="btn btn-outline" id="roulBlack" style="border-color:#333;color:#ccc;">Черное (x2)</button>
                <button class="btn btn-outline" id="roulGreen" style="border-color:#22c55e;color:#22c55e;">Зеленое (x5)</button>
                <button class="btn btn-outline" id="roulBlue" style="border-color:#3b82f6;color:#3b82f6;">Синее (x3)</button>
                <button class="btn btn-outline" id="roulPink" style="border-color:#ec4899;color:#ec4899;">Розовое (x1.5)</button>
                <button class="btn btn-outline" id="roulZero" style="border-color:#d4af37;color:#d4af37;">Зеро (x0)</button>
            </div>
            <div class="roulette-wheel" id="roulResult" style="text-align:center;font-size:90px;margin:20px 0;pointer-events:none;">🎯</div>
            <div class="flex-row mt-16"><button class="btn" id="roulSpin" style="width:100%;">Крутить</button></div>
        `;
        c.appendChild(wrap);

        let betAmount = 0, selectedColor = null;
        const resEl = getEl('roulResult');

        const setColor = (color) => { 
            selectedColor = color; 
            showToast('Выбрано: ' + color); 
        };
        getEl('roulRed').addEventListener('click', () => setColor('red'));
        getEl('roulBlack').addEventListener('click', () => setColor('black'));
        getEl('roulGreen').addEventListener('click', () => setColor('green'));
        getEl('roulBlue').addEventListener('click', () => setColor('blue'));
        getEl('roulPink').addEventListener('click', () => setColor('pink'));
        getEl('roulZero').addEventListener('click', () => setColor('zero'));

        getEl('roulSpin').addEventListener('click', () => {
            if (!selectedColor) { showToast('Выберите цвет!'); return; }
            const bet = validateBet(); if (!bet) return;
            
            betAmount = bet; state.balance -= bet; saveBalance();
            const old = c.querySelector('.result-badge'); if (old) old.remove();
            
            let spins = 0;
            const spinInterval = setInterval(() => {
                const num = Math.floor(secureRandom() * 37);
                resEl.textContent = (num === 0 ? '🟢' : (num % 2 === 0 ? '⚫' : '🔴')) + ' ' + num;
                spins++;
                if (spins > 20) {
                    clearInterval(spinInterval);
                    
                    const r = secureRandom() * 100;
                    let finalColor = 'zero';
                    if (r < 5) finalColor = 'green'; // 5% x5
                    else if (r < 15) finalColor = 'blue'; // 10% x3
                    else if (r < 30) finalColor = 'pink'; // 15% x1.5
                    else if (r < 50) finalColor = 'red'; // 20% x2
                    else if (r < 55) finalColor = 'black'; // 5% x2
                    else finalColor = 'zero'; // 45% x0
                    
                    let win = false, mult = 0;
                    if (selectedColor === finalColor) {
                        if (finalColor === 'green') mult = 5;
                        else if (finalColor === 'blue') mult = 3;
                        else if (finalColor === 'pink') mult = 1.5;
                        else if (finalColor === 'red' || finalColor === 'black') mult = 2;
                        win = true;
                    }
                    
                    const colorEmoji = { green: '🟢', blue: '🔵', pink: '🩷', red: '🔴', black: '⚫', zero: '⚪' };
                    resEl.textContent = colorEmoji[finalColor] + ' ' + (finalColor === 'zero' ? 'ZERO' : '');
                    
                    if (win && mult > 0) {
                        const winAmt = Math.floor(betAmount * mult);
                        state.balance += winAmt; saveBalance();
                        showResult(c, `🎉 Победа! ${mult}x +${formatNum(winAmt)} SPH`, 'win');
                    } else {
                        showResult(c, `😞 Проигрыш. Потеряно ${formatNum(betAmount)} SPH`, 'lose');
                    }
                }
            }, 80);
            registerCleanup(() => clearInterval(spinInterval));
        });
    }

    // ============ ДУЭЛЬ ============
    function renderDuel(c) {
        buildGameHeader(c, 'DUEL', 'Выбери бойца. Раунд 1: x1.5, Раунд 2: x3.1, Раунд 3: x5. Если твой боец вылетает — ты теряешь ВСЁ.');
        buildBetInput(c, 100);

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `
            <div id="duelStartScreen">
                <div style="font-weight:700;margin-bottom:12px;text-align:center;">Выберите бойца (1-6):</div>
                <div id="fighterSelectGrid" style="display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;margin-bottom:16px;"></div>
                <button class="btn" id="duelStartBtn" style="width:100%;">Начать бой</button>
            </div>
            <div id="duelGameScreen" class="hidden">
                <div class="ring-container" id="ringContainer"></div>
                <div class="center mt-16">
                    <button class="btn" id="duelCashoutBtn" disabled>Забрать (0)</button>
                </div>
                <div class="result-badge" id="duelResult"></div>
            </div>
        `;
        c.appendChild(wrap);

        const fightersList = ['Мадумар', 'Миха', 'Лёха', 'Камиль', 'Лёня', 'Илюха'];
        const avatars = ['💪', '🥊', '🧔', '👨‍🦲', '🧑‍🦱', '👱'];
        let selectedFighter = null, betAmount = 0, currentRound = 0, roundMult = 0, isPlaying = false;
        
        const selectGrid = getEl('fighterSelectGrid');
        fightersList.forEach((f, i) => {
            const div = document.createElement('div');
            div.className = 'game-card'; div.style.padding = '10px';
            div.innerHTML = `<div style="font-size:28px;">${avatars[i]}</div><div style="font-size:12px;font-weight:bold;margin-top:4px;">${f}</div>`;
            div.addEventListener('click', () => {
                if (isPlaying) return;
                selectedFighter = i;
                document.querySelectorAll('#fighterSelectGrid .game-card').forEach(el => el.style.borderColor = 'rgba(255,255,255,0.05)');
                div.style.borderColor = 'var(--gold)';
            });
            selectGrid.appendChild(div);
        });

        function renderRing(fightersAlive) {
            const ring = getEl('ringContainer');
            ring.innerHTML = '';
            fightersAlive.forEach(idx => {
                const f = document.createElement('div');
                f.className = 'fighter';
                f.innerHTML = `<div class="avatar">${avatars[idx]}</div><div>${fightersList[idx]}</div>`;
                ring.appendChild(f);
            });
            return Array.from(ring.children);
        }

        getEl('duelStartBtn').addEventListener('click', () => {
            if (selectedFighter === null) { showToast('Выберите бойца!'); return; }
            const bet = validateBet(); if (!bet) return;
            
            betAmount = bet; state.balance -= bet; saveBalance();
            isPlaying = true; currentRound = 0; roundMult = 0;
            
            getEl('duelStartScreen').classList.add('hidden');
            getEl('duelGameScreen').classList.remove('hidden');
            getEl('duelCashoutBtn').disabled = true;
            getEl('duelCashoutBtn').textContent = 'Забрать (0)';
            getEl('duelResult').textContent = '';
            
            startRound([0,1,2,3,4,5]);
        });

        function startRound(aliveIndices) {
            currentRound++;
            const els = renderRing(aliveIndices);
            const ring = getEl('ringContainer');
            
            let fightInterval = setInterval(() => {
                els.forEach(el => {
                    if (secureRandom() > 0.5) {
                        el.classList.add('punch');
                        setTimeout(() => el.classList.remove('punch'), 300);
                    }
                });
            }, 300);

            let toDropCount = 0;
            if (currentRound === 1) toDropCount = 2;
            else if (currentRound === 2) toDropCount = 1;
            else if (currentRound === 3) toDropCount = 2;

            setTimeout(() => {
                clearInterval(fightInterval);
                
                let dropPool = [...aliveIndices];
                let dropped = [];
                for(let i=0; i<toDropCount; i++) {
                    const rIdx = Math.floor(secureRandom() * dropPool.length);
                    dropped.push(dropPool[rIdx]);
                    dropPool.splice(rIdx, 1);
                }

                els.forEach((el, i) => {
                    const originalIdx = aliveIndices[i];
                    if (dropped.includes(originalIdx)) {
                        el.classList.add('dead');
                    }
                });

                setTimeout(() => {
                    if (dropped.includes(selectedFighter)) {
                        isPlaying = false;
                        getEl('duelResult').textContent = `💥 Твой боец вылетел! Ты потерял всё.`;
                        getEl('duelResult').className = 'result-badge lose-text';
                        getEl('duelStartScreen').classList.remove('hidden');
                        getEl('duelGameScreen').classList.add('hidden');
                        return;
                    }

                    if (currentRound === 1) {
                        roundMult = 1.5;
                        getEl('duelResult').textContent = `Раунд 1 пройден! Доступно: x1.5`;
                        getEl('duelResult').className = 'result-badge neutral-text';
                        getEl('duelCashoutBtn').disabled = false;
                        getEl('duelCashoutBtn').textContent = `Забрать (${formatNum(betAmount * roundMult)} SPH)`;
                        getEl('duelCashoutBtn').onclick = () => cashoutDuel();
                        
                        if (!getEl('duelNextBtn')) {
                            const nextBtn = document.createElement('button');
                            nextBtn.id = 'duelNextBtn'; nextBtn.className = 'btn btn-outline'; nextBtn.style.cssText = 'width:100%;margin-top:12px;';
                            nextBtn.textContent = '➡ Следующий раунд (x3.1)';
                            nextBtn.onclick = () => {
                                getEl('duelNextBtn').remove();
                                startRound(dropPool);
                            };
                            ring.parentElement.appendChild(nextBtn);
                        }
                    } else if (currentRound === 2) {
                        roundMult = 3.1;
                        getEl('duelResult').textContent = `Раунд 2 пройден! Доступно: x3.1`;
                        getEl('duelResult').className = 'result-badge neutral-text';
                        getEl('duelCashoutBtn').textContent = `Забрать (${formatNum(betAmount * roundMult)} SPH)`;
                        
                        if (!getEl('duelNextBtn')) {
                            const nextBtn = document.createElement('button');
                            nextBtn.id = 'duelNextBtn'; nextBtn.className = 'btn btn-outline'; nextBtn.style.cssText = 'width:100%;margin-top:12px;';
                            nextBtn.textContent = '➡ Финальный раунд (x5)';
                            nextBtn.onclick = () => {
                                getEl('duelNextBtn').remove();
                                startRound(dropPool);
                            };
                            ring.parentElement.appendChild(nextBtn);
                        }
                    } else if (currentRound === 3) {
                        roundMult = 5;
                        isPlaying = false;
                        const winAmt = Math.floor(betAmount * roundMult);
                        state.balance += winAmt; saveBalance();
                        getEl('duelResult').textContent = `🏆 Твой боец выиграл! +${formatNum(winAmt)} SPH`;
                        getEl('duelResult').className = 'result-badge win-text';
                        getEl('duelCashoutBtn').disabled = true;
                        getEl('duelStartScreen').classList.remove('hidden');
                        setTimeout(() => getEl('duelGameScreen').classList.add('hidden'), 3000);
                    }
                }, 1000);
            }, 2500);
            
            registerCleanup(() => clearInterval(fightInterval));
        }

        function cashoutDuel() {
            if (!isPlaying) return;
            isPlaying = false;
            const winAmt = Math.floor(betAmount * roundMult);
            state.balance += winAmt; saveBalance();
            getEl('duelResult').textContent = `💰 Ты забрал ${formatNum(winAmt)} SPH!`;
            getEl('duelResult').className = 'result-badge win-text';
            getEl('duelCashoutBtn').disabled = true;
            if (getEl('duelNextBtn')) getEl('duelNextBtn').remove();
            setTimeout(() => {
                getEl('duelStartScreen').classList.remove('hidden');
                getEl('duelGameScreen').classList.add('hidden');
            }, 2000);
        }
        
        registerCleanup(() => { isPlaying = false; });
    }

    // ============ АПГРЕЙДЕР ============
    function renderUpgrader(c) {
        buildGameHeader(c, 'UPGRADER', 'Выберите шанс. Если стрелка попадет в золотую зону — победа.');
        buildBetInput(c, 100);

        const wrap = document.createElement('div');
        wrap.style.cssText = 'margin:0 16px;';
        wrap.innerHTML = `
            <div class="upg-wheel-wrapper">
                <div class="upg-pointer"></div>
                <div class="upg-wheel-bg" id="upgWheelBg"></div>
                <div class="upg-center">🎯</div>
                <div class="upg-arrow" id="upgArrow"></div>
            </div>
            
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-weight:600;">
                <span>Шанс: <span id="upgChanceVal" style="color:var(--gold)">50%</span></span>
                <span>Множитель: <span id="upgMultVal" style="color:var(--white)">1.90x</span></span>
            </div>
            <input type="range" class="dice-slider" id="upgSlider" min="10" max="90" value="50" step="5">
            
            <button class="btn mt-16" id="upgPlay" style="width:100%;">Апгрейд</button>
            <div class="result-badge" id="upgResult"></div>
        `;
        c.appendChild(wrap);

        const wheelBg = getEl('upgWheelBg'), arrow = getEl('upgArrow'), slider = getEl('upgSlider');
        const chanceVal = getEl('upgChanceVal'), multVal = getEl('upgMultVal');
        let isSpinning = false, currentRotation = 0, betAmount = 0, chance = 50;

        function updateWheel() {
            chance = parseInt(slider.value, 10);
            chanceVal.textContent = chance + '%';
            let mult = 95 / chance;
            multVal.textContent = mult.toFixed(2) + 'x';
            
            wheelBg.style.background = `conic-gradient(var(--gold) 0% ${chance}%, #0f1832 ${chance}% 100%)`;
        }

        slider.addEventListener('input', updateWheel);
        updateWheel();

        getEl('upgPlay').addEventListener('click', () => {
            if (isSpinning) return;
            const bet = validateBet(); if (!bet) return;
            
            betAmount = bet; state.balance -= bet; saveBalance();
            isSpinning = true;
            getEl('upgPlay').disabled = true;
            const old = c.querySelector('.result-badge'); if (old) old.remove();

            const isWin = secureRandom() * 100 < chance;
            let targetAngle;
            if (isWin) {
                targetAngle = secureRandom() * (chance * 3.6);
            } else {
                targetAngle = (chance * 3.6) + secureRandom() * (360 - (chance * 3.6));
            }
            
            const turns = 360 * 5;
            const totalRotation = currentRotation + turns + (360 - targetAngle);
            currentRotation = totalRotation;
            
            arrow.style.transform = `rotate(${totalRotation}deg)`;
            
            const onEnd = () => {
                arrow.removeEventListener('transitionend', onEnd);
                isSpinning = false;
                getEl('upgPlay').disabled = false;
                
                if (isWin) {
                    const mult = 95 / chance;
                    const winAmt = Math.floor(betAmount * mult);
                    state.balance += winAmt; saveBalance();
                    showResult(c, `🎉 Успех! ${mult.toFixed(2)}x +${formatNum(winAmt)} SPH`, 'win');
                } else {
                    showResult(c, `😞 Промах. Потеряно ${formatNum(betAmount)} SPH`, 'lose');
                }
            };
            
            arrow.addEventListener('transitionend', onEnd);
            registerCleanup(() => { arrow.removeEventListener('transitionend', onEnd); });
        });

        registerCleanup(() => { isSpinning = false; });
    }

    // ============ LEADERBOARD ============
    async function fetchLeaderboard() {
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            arr.sort((a, b) => b.balance - a.balance);
            return arr.slice(0, 10);
        } catch (e) {
            return state.nick ? [{ name: state.nick, balance: state.balance, isMe: true }] : [];
        }
    }

    async function savePlayerScore() {
        if (!state.nick) return;
        try {
            const res = await fetch(CLOUD_URL + "/latest", { headers: { "X-Master-Key": API_KEY } });
            const data = await res.json();
            let arr = data.record;
            if (typeof arr === 'string') arr = JSON.parse(arr);
            if (!Array.isArray(arr)) arr = [];
            
            const myId = state.tgId;
            let found = arr.find(p => p.id === myId);
            
            if (found) {
                found.balance = state.balance;
                found.name = state.nick;
            } else {
                arr.push({ id: myId, name: state.nick, balance: state.balance });
            }
            arr.sort((a, b) => b.balance - a.balance);
            const top = arr.slice(0, 100);
            
            await fetch(CLOUD_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(top)
            });
        } catch (e) {}
    }

    async function renderTop(c) {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="center" style="font-size:20px;font-weight:800;margin-bottom:16px;color:var(--gold);">ТОП-10</div><div id="topList" class="center small-text">Загрузка...</div>';
        c.appendChild(card);
        const listEl = card.querySelector('#topList');
        const board = await fetchLeaderboard();
        let html = ''; const medals = ['🥇', '🥈', '🥉'];
        if (board.length === 0) {
            html = '<div class="small-text" style="padding:20px;">Пусто. Сыграйте!</div>';
        } else {
            board.forEach((p, i) => {
                const isMe = p.id === state.tgId || p.name === state.nick;
                const rankDisplay = i < 3 ? medals[i] : (i + 1);
                html += `<div class="leader-row ${isMe ? 'me' : ''}"><div class="leader-rank">${rankDisplay}</div><div class="leader-name">${p.name}${isMe ? ' (вы)' : ''}</div><div class="leader-balance"><span class="coin-icon" style="width:14px;height:14px;"></span> ${formatNum(p.balance)} SPH</div></div>`;
            });
        }
        listEl.innerHTML = html; listEl.classList.remove('center', 'small-text');
    }

    // ============ BONUS ============
    function renderBonus(c) {
        const card = document.createElement('div'); card.className = 'card bonus-card';
        card.innerHTML = `
            <div style="font-size:50px;">🎁</div>
            <div style="font-size:20px;font-weight:800;margin:10px 0;color:var(--text);">Бонус</div>
            <div class="small-text">От 7 000 до 10 000 SPH каждый час!</div>
            <div class="bonus-timer" id="bonusTimer">--:--</div>
            <button class="btn" id="bonusBtn" style="width:100%;">Забрать</button>`;
        c.appendChild(card);
        const timerEl = getEl('bonusTimer'), btn = getEl('bonusBtn');
        
        const bonusKey = LS.bonusTime + '_' + state.tgId;

        function updateBonus() {
            const lastTime = parseInt(localStorage.getItem(bonusKey) || '0', 10);
            const now = Date.now(), elapsed = now - lastTime, cooldown = 60 * 60 * 1000, remaining = Math.max(0, cooldown - elapsed);
            if (remaining <= 0) {
                timerEl.textContent = 'ГОТОВО!'; timerEl.style.color = 'var(--gold)';
                btn.disabled = false; btn.textContent = 'Забрать';
            } else {
                btn.disabled = true; btn.textContent = 'Ожидание';
                const mins = Math.floor(remaining / 60000), secs = Math.floor((remaining % 60000) / 1000);
                timerEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
                timerEl.style.color = 'var(--text)';
            }
        }

        btn.addEventListener('click', () => {
            if (btn.disabled) return;
            const randomBonus = Math.floor(secureRandom() * 3001) + 7000;
            localStorage.setItem(bonusKey, String(Date.now()));
            state.balance += randomBonus; saveBalance(); updateBonus();
            showToast(`🎁 +${formatNum(randomBonus)} SPH`);
        });
        updateBonus();
        state.bonusInterval = setInterval(updateBonus, 1000);
        registerCleanup(() => { if (state.bonusInterval) { clearInterval(state.bonusInterval); state.bonusInterval = null; } });
    }

    // ============ PROFILE ============
    function renderProfile(c) {
        const card = document.createElement('div'); card.className = 'card'; card.style.textAlign = 'center';
        card.innerHTML = `
            <div class="profile-avatar">${(state.nick || '?')[0].toUpperCase()}</div>
            <div style="font-size:22px;font-weight:800;margin-bottom:6px;color:var(--text);">${state.nick || 'Гость'}</div>
            <div style="font-size:16px;color:var(--gold-light);margin-bottom:20px; display:flex; align-items:center; justify-content:center; gap:6px;">
                <span class="coin-icon"></span> ${formatNum(state.balance)} SPH
            </div>
            <button class="btn btn-outline" id="aboutBtn" style="width:100%;">О разработчике</button>`;
        c.appendChild(card);
        getEl('aboutBtn').addEventListener('click', () => showAboutModal());
    }

    function showAboutModal() {
        const overlay = document.createElement('div'); overlay.className = 'modal-overlay';
        overlay.innerHTML = `<div class="modal"><h3>Разработчик</h3><p>by bogname<br>Telegram: @bogname<br><br>Создано с любовью для вашего азарта.</p><button class="btn mt-16" id="aboutClose" style="width:100%;">Закрыть</button></div>`;
        document.body.appendChild(overlay);
        overlay.querySelector('#aboutClose').addEventListener('click', () => overlay.remove());
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    }

    document.querySelectorAll('.nav-btn').forEach(btn => { btn.addEventListener('click', () => setScreen(btn.dataset.nav)); });

    async function init() {
        loadState(); updateHeader();
        if (window.Telegram && Telegram.WebApp) {
            try { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } catch (e) {}
        }
        const isNotBanned = await checkBan();
        if (!isNotBanned) return;
        await syncBalance();
        renderScreen();
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
})();
</script>
